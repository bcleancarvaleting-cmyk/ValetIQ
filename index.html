function isWork(t,date){const S=t.settings;return S.workDays.includes(pd(date).getDay())&&!S.blocked.some(b=>date>=b.from&&date<=b.to)}
function covers(b,date){if(!b.days)return b.date===date;for(let i=0;i<b.days;i++)if(addD(b.date,i)===date)return true;return false}
function onDate(t,date){return t.bookings.filter(b=>b.status!=='Cancelled'&&covers(b,date))}
function clash(t,date,s,e,ex){const B=t.settings.buffer;return onDate(t,date).some(b=>{if(b.id===ex)return false;const bs=b.days?tm(t.settings.hours.start):tm(b.start),be=bEnd(t,b);return s<be+B&&e+B>bs})}
function slotsFor(t,date,svc,ex){const S=t.settings;if(!isWork(t,date)||date<TODAY())return[];
 if(svc.days){for(let i=0;i<svc.days;i++){const d=addD(date,i);if(!isWork(t,d)||onDate(t,d).some(b=>b.id!==ex))return[{time:S.hours.start,ok:false}]}return[{time:S.hours.start,ok:true}]}
 const hs=tm(S.hours.start),he=tm(S.hours.end);const now=new Date();const lim=new Date(now.getTime()+S.minNotice*3600e3);
 const fixed=S.slotMode==='fixed';const off=(S.slotOff||{})[date]||[];const c=fixed?S.slots.filter(x=>x.on&&!off.includes(x.t)).map(x=>tm(x.t)).sort((a,b)=>a-b):[...Array(Math.floor((he-hs)/30)+1)].map((_,i)=>hs+i*30);
 const out=c.map(m=>{const dt=pd(date);dt.setHours(0,m);return{time:ft(m),ok:(fixed||m+svc.mins<=he)&&!clash(t,date,m,m+svc.mins,ex)&&dt>=lim}});
 return S.slotMode==='fixed'?out:out.filter(x=>x.ok)}
function dayHasSlot(t,date,svc){return slotsFor(t,date,svc).some(s=>s.ok)}

function pRange(p){const t=TODAY(),d=pd(t);switch(p){case'today':return[t,t];case'yesterday':{const y=addD(t,-1);return[y,y]}case'week':{const w=(d.getDay()+6)%7;return[addD(t,-w),addD(t,6-w)]}case'month':return[ymd(new Date(d.getFullYear(),d.getMonth(),1)),ymd(new Date(d.getFullYear(),d.getMonth()+1,0))];case'lastmonth':return[ymd(new Date(d.getFullYear(),d.getMonth()-1,1)),ymd(new Date(d.getFullYear(),d.getMonth(),0))];case'year':return[`${d.getFullYear()}-01-01`,`${d.getFullYear()}-12-31`];case'lastyear':return[`${d.getFullYear()-1}-01-01`,`${d.getFullYear()-1}-12-31`];default:{let a=UI.cf||t,b=UI.ct||t;return a<=b?[a,b]:[b,a]}}}
const rev=(t,R,type)=>r2(t.payments.filter(p=>inR(p.date,R)&&(!type||p.type===type)).reduce((s,p)=>s+p.amount,0));

/* ---- Dashboard ---- */
function aDash(){const t=T(),today=TODAY(),d=pd(today);const R=pRange(UI.period);
 const mR=pRange('month'),yR=pRange('year'),tR=[today,today];
 const inP=t.bookings.filter(b=>inR(b.date,R));const done=inP.filter(b=>b.status==='Completed').length,canc=inP.filter(b=>b.status==='Cancelled').length;
 const upc=t.bookings.filter(b=>b.date>=today&&!['Completed','Cancelled'].includes(b.status));
 const outst=r2(t.bookings.filter(b=>b.date<=R[1]).reduce((s,b)=>s+owed(t,b),0));
 const newC=t.customers.filter(c=>inR(c.createdAt,R)).length;const retIds=new Set(inP.filter(b=>b.status!=='Cancelled'&&cust(t,b.customerId).createdAt<R[0]).map(b=>b.customerId));
 const lm=pRange('lastmonth');const samePt=addD(lm[0],d.getDate()-1)>lm[1]?lm[1]:addD(lm[0],d.getDate()-1);const mNow=rev(t,mR.map((x,i)=>i?today:x)),mLast=rev(t,[lm[0],samePt]);const pct=mLast?Math.round((mNow-mLast)/mLast*100):0;
 const todayJobs=onDate(t,today);
 const k=(l,v,s='')=>`<div class="card kpi"><div class="k">${l}</div><div class="v">${v}</div>${s?`<div class="d">${s}</div>`:''}</div>`;
 const spent={};t.payments.forEach(p=>{if(p.customerId)spent[p.customerId]=(spent[p.customerId]||0)+p.amount});const top=Object.entries(spent).sort((a,b)=>b[1]-a[1]).slice(0,6);
 $('main').innerHTML=`<div class="ph"><div><h2>Good ${new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening'}</h2><div class="tiny mu">${fd(today)} · ${todayJobs.length} job${todayJobs.length===1?'':'s'} today worth ${gbp(todayJobs.reduce((s,b)=>s+b.total+(b.credit?0:0),0))}</div></div><span class="sp"></span><button class="btn sm pri" onclick="addBooking()">+ New booking</button></div>
 <div class="grid g3"><div class="card kpi big"><div class="k">Today's revenue</div><div class="v">${gbp(rev(t,tR))}</div><div class="d mu">Payments received today</div></div><div class="card kpi big"><div class="k">Monthly revenue</div><div class="v">${gbp(rev(t,mR))}</div><div class="d ${pct>=0?'up':'dn'}">${pct>=0?'▲':'▼'} ${Math.abs(pct)}% vs same point last month (${gbp(mLast)})</div></div><div class="card kpi big"><div class="k">Yearly revenue</div><div class="v">${gbp(rev(t,yR))}</div><div class="d mu">${d.getFullYear()} to date</div></div></div>
 <div class="card" style="margin-top:12px"><div class="row"><h3 style="margin:0">This month vs previous months</h3><span class="sp"></span><span class="tiny mu"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--ac)"></span> Received &nbsp; <span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--ac);opacity:.35"></span> Booked, still to collect</span></div><div id="chart"></div></div>
 <div class="row" style="margin:18px 0 10px"><h3 style="margin:0">Reporting period</h3><span class="sp"></span>${periodBar('period','aDash')}</div><div class="tiny mu" style="margin:-4px 0 10px">${fdy(R[0])} – ${fdy(R[1])}</div>
 <div class="grid g4">${k('Revenue',gbp(rev(t,R)))}${k('Total bookings',inP.length)}${k('Upcoming bookings',upc.length,'<span class="mu">all future</span>')}${k('Completed',done)}${k('Cancelled',canc,inP.length?`<span class="mu">${Math.round(canc/inP.length*100)}% rate</span>`:'')}${k('Outstanding balances',gbp(outst),'<span class="mu">owed to date</span>')}${k('Deposits collected',gbp(rev(t,R,'deposit')))}${k('Membership revenue',gbp(rev(t,R,'membership')))}${k('New customers',newC)}${k('Returning customers',retIds.size)}${k('Avg booking value',gbp(inP.filter(b=>b.status!=='Cancelled'&&!b.credit).reduce((s,b,_,a)=>s+b.total/a.length,0)))}${k('Gift voucher sales',gbp(rev(t,R,'voucher')))}</div>
 <div class="grid g2" style="margin-top:12px"><div class="card"><div class="row"><h3 style="margin:0">Upcoming</h3><span class="sp"></span><button class="btn xs" onclick="go('diary')">Diary →</button></div>${upc.sort((a,b)=>(a.date+a.start)<(b.date+b.start)?-1:1).slice(0,7).map(b=>bkRow(t,b)).join('')||'<p class="mu">Nothing booked.</p>'}</div>
 <div class="card"><h3>Top clients (all time)</h3>${top.map(([id,v])=>{const c=cust(t,id);return`<div class="row" style="padding:7px 0;border-bottom:1px solid var(--ln);cursor:pointer" onclick="UI.cs='${id}';go('customers')"><b>${c.vip?'<span class="vip">♛</span> ':''}${esc(c.first+' '+c.last)}</b><span class="tiny mu">${t.bookings.filter(b=>b.customerId===id&&b.status==='Completed').length} cleans</span><span class="sp"></span><b>${gbp(v)}</b></div>`}).join('')}</div></div>`;
 drawChart(t)}
function bkRow(t,b){const c=cust(t,b.customerId);return`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--ln);cursor:pointer" onclick="openBk('${b.id}')"><div style="min-width:74px" class="tiny"><b>${fd(b.date).slice(0,6)}</b><div class="mu">${b.start}</div></div><div style="flex:1;min-width:0"><b>${c.vip?'<span class="vip">♛</span> ':''}${esc(c.first+' '+c.last)}</b><div class="tiny mu" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(svcOf(t,b).name)} · ${esc(b.postcode)}</div></div><span class="pill s-${b.status.replace(' ','')}">${b.status}</span></div>`}
function drawChart(t){const today=TODAY(),d=pd(today);const ms=[];for(let i=11;i>=0;i--){const a=new Date(d.getFullYear(),d.getMonth()-i,1),b=new Date(d.getFullYear(),d.getMonth()-i+1,0);const R=[ymd(a),ymd(b)];const got=rev(t,R);const pipe=r2(t.bookings.filter(x=>inR(x.date,R)&&x.date>=today).reduce((s,x)=>s+owed(t,x),0));ms.push({l:MON[a.getMonth()],got,pipe,cur:i===0})}
 const W=760,H=240,pl=46,pb=26,max=Math.max(...ms.map(m=>m.got+m.pipe),100)*1.12;const bw=(W-pl)/12;const y=v=>H-pb-(v/max)*(H-pb-10);const step=Math.pow(10,Math.floor(Math.log10(max/4)));const tk=Math.ceil(max/4/step)*step;
 let g='';for(let v=0;v<=max;v+=tk)g+=`<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--ln)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">£${v>=1000?(v/1000)+'k':v}</text>`;
 ms.forEach((m,i)=>{const x=pl+i*bw+bw*.18,w=bw*.64;g+=`<rect x="${x}" y="${y(m.got)}" width="${w}" height="${H-pb-y(m.got)}" rx="4" fill="var(--ac)" opacity="${m.cur?1:.55}"><title>${m.l}: ${gbp(m.got)} received</title></rect>`;if(m.pipe)g+=`<rect x="${x}" y="${y(m.got+m.pipe)}" width="${w}" height="${y(m.got)-y(m.got+m.pipe)}" rx="4" fill="var(--ac)" opacity=".28"><title>${gbp(m.pipe)} still to collect</title></rect>`;g+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle" style="${m.cur?'fill:var(--tx);font-weight:700':''}">${m.l}</text>`;if(m.cur)g+=`<text x="${x+w/2}" y="${y(m.got+m.pipe)-6}" text-anchor="middle" style="fill:var(--tx);font-weight:700">${gbp(m.got)}</text>`});
 const avg=ms.slice(0,11).reduce((s,m)=>s+m.got,0)/11;g+=`<line x1="${pl}" x2="${W}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--wa)" stroke-dasharray="4 4"/><text x="${pl+6}" y="${y(avg)-5}" text-anchor="start" style="fill:var(--wa)">11-mo avg ${gbp(Math.round(avg))}</text>`;
 $('chart').innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:8px">${g}</svg>`}

/* ---- Diary ---- */
const DS=7,DE=21,PPM=1;
function aDiary(){const t=T(),S=t.settings;const dd=UI.dd;const v=UI.dv;
 let title='',grid='';
 if(v==='month'){const d=pd(dd);title=`${MON[d.getMonth()]} ${d.getFullYear()}`;const first=new Date(d.getFullYear(),d.getMonth(),1);const st=addD(ymd(first),-((first.getDay()+6)%7));let cells='';for(let i=0;i<42;i++){const x=addD(st,i);const bs=onDate(t,x);const inM=pd(x).getMonth()===d.getMonth();cells+=`<div class="mcell ${inM?'':'dim'} ${x===TODAY()?'td':''} ${isWork(t,x)?'':'off'}" onclick="UI.dd='${x}';UI.dv='day';aDiary()"><div class="row"><b>${pd(x).getDate()}</b><span class="sp"></span>${bs.length?`<span class="tiny mu">${gbp(bs.reduce((s,b)=>s+b.total,0))}</span>`:''}</div>${bs.slice(0,3).map(b=>`<span class="dot">${b.days?'▮ ':b.start+' '}${esc(cust(t,b.customerId).first)}</span>`).join('')}${bs.length>3?`<span class="tiny mu">+${bs.length-3} more</span>`:''}${!isWork(t,x)&&S.blocked.some(bl=>x>=bl.from&&x<=bl.to)?'<span class="tiny" style="color:#fca5a5">Blocked</span>':''}</div>`}
  grid=`<div class="mgrid" style="margin-bottom:4px">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="tiny mu" style="text-align:center">${x}</div>`).join('')}</div><div class="mgrid">${cells}</div>`}
 else{const days=v==='week'?[...Array(7)].map((_,i)=>addD(dd,i-((pd(dd).getDay()+6)%7))):[dd];
  title=v==='week'?`${fd(days[0])} – ${fd(days[6])}`:fd(dd)+(dd===TODAY()?' · Today':'');
  const H=(DE-DS)*60*PPM;const cols=`56px repeat(${days.length},minmax(${v==='week'?'90px':'0'},1fr))`;const now=new Date(),nm=now.getHours()*60+now.getMinutes();
  grid=`<div class="tw"><div class="dgrid" style="min-width:${v==='week'?700:0}px"><div class="dhead" style="grid-template-columns:${cols}"><div style="border:0"></div>${days.map(x=>`<div class="${x===TODAY()?'td':''}" onclick="UI.dd='${x}';UI.dv='day';aDiary()" style="cursor:pointer">${DOW[pd(x).getDay()]}<b>${pd(x).getDate()}</b><span class="tiny">${gbp(onDate(t,x).reduce((s,b)=>s+b.total,0))}</span></div>`).join('')}</div>
  <div class="dbody" style="grid-template-columns:${cols};height:${H}px"><div class="hcol">${[...Array(DE-DS)].map((_,i)=>`<div>${pad(DS+i)}:00</div>`).join('')}</div>
  ${days.map(x=>`<div class="dcol ${isWork(t,x)?'':'off'}" data-date="${x}"><div class="hrs" style="top:${(tm(S.hours.start)-DS*60)*PPM}px;height:${(tm(S.hours.end)-tm(S.hours.start))*PPM}px"></div>${x===TODAY()&&nm>DS*60&&nm<DE*60?`<div class="nowl" style="top:${(nm-DS*60)*PPM}px"></div>`:''}${!isWork(t,x)?`<div class="tiny" style="position:absolute;top:${(tm(S.hours.start)-DS*60)*PPM+8}px;left:6px;right:6px;color:#fca5a5;text-align:center">${esc((S.blocked.find(bl=>x>=bl.from&&x<=bl.to)||{}).reason||'Closed')}</div>`:''}${onDate(t,x).map(b=>{const c=cust(t,b.customerId);const s=b.days?tm(S.hours.start):tm(b.start);const e=bEnd(t,b);return`<div class="blk c-${b.status.replace(' ','')}" data-id="${b.id}" style="top:${(s-DS*60)*PPM}px;height:${Math.max(26,(e-s)*PPM-2)}px" onclick="if(!window._dragged)openBk('${b.id}')"><span class="h" data-drag="${b.id}" title="Drag to move">⠿</span><b>${c.vip?'♛ ':''}${esc(c.first+' '+c.last)}</b>${b.days?'All day · ':b.start+' · '}${esc(svcOf(t,b).name)}<br><span class="mu">${esc(b.postcode)} · ${b.credit?'credit':gbp(b.total)}${owed(t,b)?' · owes '+gbp(owed(t,b)):''}</span></div>`}).join('')}</div>`).join('')}</div></div></div>`}
 const dayJobs=v==='day'?onDate(t,dd).sort((a,b)=>a.start<b.start?-1:1):[];
 $('main').innerHTML=`<div class="ph"><h2>Diary</h2><span class="sp"></span><div class="tabs">${['day','week','month'].map(x=>`<button class="tab ${v===x?'on':''}" onclick="UI.dv='${x}';aDiary()">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div></div>
 <div class="row" style="margin-bottom:12px"><button class="btn sm" onclick="diaryNav(-1)">←</button><button class="btn sm" onclick="UI.dd=TODAY();aDiary()">Today</button><button class="btn sm" onclick="diaryNav(1)">→</button><b style="margin-left:6px">${title}</b><span class="sp"></span><input type="date" value="${dd}" onchange="UI.dd=this.value;aDiary()" style="width:auto"><button class="btn sm" onclick="blockDates('${dd}')">Block time off</button><button class="btn sm pri" onclick="addBooking({date:'${dd}'})">+ Booking</button></div>
 ${v==='day'?`<div class="card" style="margin-bottom:12px"><div class="row"><div><div class="tiny mu">Work ${dd===TODAY()?'today':'this day'}</div><div class="disp" style="font-size:28px;font-weight:700">${gbp(dayJobs.reduce((s,b)=>s+b.total,0))}</div></div><span class="sp"></span><div class="tiny mu" style="text-align:right">${dayJobs.length} job${dayJobs.length===1?'':'s'}<br>${gbp(dayJobs.reduce((s,b)=>s+owed(t,b),0))} to collect</div></div>${dayJobs.length?'<hr>'+dayJobs.map(b=>bkRow(t,b)).join(''):''}${S.slotMode==='fixed'&&isWork(t,dd)?daySlots(t,dd):''}</div>`:''}
 ${grid}<p class="tiny mu" style="margin-top:8px">Drag the ⠿ handle to move a booking — the diary checks clashes, buffers (${S.buffer} min) and closed days. Tap a booking for full details.</p>`;
 bindDrag()}
function daySlots(t,dd){const S=t.settings;const off=(S.slotOff||{})[dd]||[];const mnt=t.services.find(s=>s.active&&!s.days)||{mins:120};
 return`<hr><div class="row"><b class="tiny">Start times this day</b><span class="tiny mu">— tap the switch to close a time for this day only</span></div><div class="grid g4" style="margin-top:8px">${[...S.slots].sort((a,b)=>tm(a.t)-tm(b.t)).filter(x=>x.on).map(x=>{const m=tm(x.t);const isOff=off.includes(x.t);const busy=onDate(t,dd).some(b=>{const bs=b.days?tm(S.hours.start):tm(b.start);return m>=bs-S.buffer&&m<bEnd(t,b)+S.buffer});const st=isOff?'off':busy?'busy':'free';
  return`<div class="schip ${st}"><b>${x.t}</b><span class="tiny ${st==='free'?'up':st==='busy'?'dn':'mu'}">${st==='free'?'Free':st==='busy'?'Booked':'Closed'}</span><span class="sp"></span>${st==='free'?`<button class="btn xs" onclick="addBooking({date:'${dd}',time:'${x.t}'})">Book</button>`:''}<label class="sw" title="Open/close this time today"><input type="checkbox" ${isOff?'':'checked'} onchange="daySlotToggle('${dd}','${x.t}')"><span></span></label></div>`}).join('')}</div>`}
function diaryNav(n){const v=UI.dv;UI.dd=v==='month'?addM(UI.dd,n):addD(UI.dd,n*(v==='week'?7:1));aDiary()}
function bindDrag(){document.querySelectorAll('[data-drag]').forEach(h=>{h.onpointerdown=e=>{e.preventDefault();e.stopPropagation();const blk=h.parentNode;const id=h.dataset.drag;const rect=blk.getBoundingClientRect();const offY=e.clientY-rect.top;let gh=null;window._dragged=false;
 const mv=ev=>{if(!gh){gh=blk.cloneNode(true);gh.classList.add('dghost');gh.style.width=rect.width+'px';gh.style.height=rect.height+'px';document.body.appendChild(gh);blk.style.opacity=.3;window._dragged=true}gh.style.left=(ev.clientX-rect.width/2)+'px';gh.style.top=(ev.clientY-offY)+'px'};
 const up=ev=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);if(!gh)return;gh.remove();blk.style.opacity=1;const el=document.elementFromPoint(ev.clientX,ev.clientY);const col=el&&el.closest('.dcol');setTimeout(()=>window._dragged=false,50);if(!col)return aDiary();
  const cr=col.getBoundingClientRect();let m=DS*60+Math.round(((ev.clientY-offY)-cr.top)/PPM/15)*15;moveBooking(id,col.dataset.date,m)};
 document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up)}})}
function moveBooking(id,date,m){const t=T(),S=t.settings,b=t.bookings.find(x=>x.id===id);const s=svcOf(t,b);
 if(b.days){if(!slotsFor(t,date,s,b.id)[0]?.ok){toast('Those days are not free');return aDiary()}b.date=date;b.start=S.hours.start}
 else{m=Math.max(tm(S.hours.start),Math.min(m,DE*60-b.mins));if(!isWork(t,date)){toast('That day is closed/blocked');return aDiary()}if(clash(t,date,m,m+b.mins,b.id)){toast('Clashes with another booking (incl. buffer)');return aDiary()}b.date=date;b.start=ft(m)}
 cnotify(t,b.customerId,'confirm',`Booking ${b.ref} moved to ${fd(b.date)} at ${b.start}`);save();toast(`Moved to ${fd(b.date)} ${b.start} — customer notified`);aDiary()}
function blockDates(d){const t=T(),S=t.settings;modal(`<h3>Block time off</h3><p class="mu tiny">Holidays, days off, van service… Blocked days can't be booked online.</p><div class="grid g2"><div><label class="f">From</label><input type="date" id="blf" value="${d}"></div><div><label class="f">To</label><input type="date" id="blt" value="${d}"></div></div><label class="f">Reason</label><input id="blr" value="Holiday"><button class="btn pri block" style="margin-top:12px" onclick="const t=T();const f=val('blf'),to=val('blt');if(!f||!to)return;const n=t.bookings.filter(b=>b.status!=='Cancelled'&&b.date>=f&&b.date<=to).length;t.settings.blocked.push({id:uid(),from:f<to?f:to,to:f<to?to:f,reason:val('blr')||'Unavailable'});save();closeModal();toast(n?'Blocked — note '+n+' existing booking(s) in that range':'Dates blocked');render()">Block dates</button><hr><h4>Currently blocked</h4>${S.blocked.length?S.blocked.map(b=>`<div class="row tiny" style="padding:6px 0"><b>${fdy(b.from)}${b.to!==b.from?' – '+fdy(b.to):''}</b><span class="mu">${esc(b.reason)}</span><span class="sp"></span><button class="btn xs bad" onclick="T().settings.blocked=T().settings.blocked.filter(x=>x.id!=='${b.id}');save();closeModal();render()">Remove</button></div>`).join(''):'<p class="tiny mu">None</p>'}`)}

/* ---- Booking drawer ---- */
const STATUSES=['Booked','Confirmed','In Progress','Completed','Cancelled'];
function openBk(id){const t=T(),S=t.settings,b=t.bookings.find(x=>x.id===id);if(!b)return;const c=cust(t,b.customerId),v=veh(t,b.vehicleId),s=svcOf(t,b);const pays=t.payments.filter(p=>p.bookingId===b.id);const ow=owed(t,b);
 const wmsg=`Hi ${c.first}, your ${s.name} with ${S.name} is booked for ${fd(b.date)} at ${b.start} (ref ${b.ref}).${ow?` Balance due: ${gbp(ow)}.`:''} Any questions just reply here.`;
 modal(`<div class="tiny mu">${b.ref} · ${b.source} · created ${fdy(b.createdAt)}</div><h2 style="margin:4px 0">${c.vip?'<span class="vip">♛</span> ':''}${esc(c.first+' '+c.last)}</h2><span class="pill s-${b.status.replace(' ','')}">${b.status}</span> ${b.credit?'<span class="pill p-ok">Membership credit</span>':''} ${b.repeatGroup?'<span class="pill p-ac">Repeat</span>':''}

 if(q)L=L.filter(b=>{const c=cust(t,b.customerId),v=veh(t,b.vehicleId);return(c.first+' '+c.last+' '+b.ref+' '+v.reg+' '+b.postcode).toLowerCase().includes(q)});
 L.sort((a,b)=>f==='upcoming'?((a.date+a.start)<(b.date+b.start)?-1:1):((a.date+a.start)<(b.date+b.start)?1:-1));
 $('main').innerHTML=`<div class="ph"><h2>Bookings</h2><span class="sp"></span><button class="btn sm pri" onclick="addBooking()">+ New booking</button></div><div class="row" style="margin-bottom:10px"><div class="tabs">${[['upcoming','Upcoming'],['all','All'],['Booked','Booked'],['Confirmed','Confirmed'],['In Progress','In progress'],['Completed','Completed'],['Cancelled','Cancelled'],['owed','Balance owed'],['requests','Change requests']].map(x=>`<button class="tab ${f===x[0]?'on':''}" onclick="UI.bf='${x[0]}';aBookings()">${x[1]}</button>`).join('')}</div></div><input placeholder="Search name, reg, ref, postcode…" value="${esc(UI.bq)}" oninput="UI.bq=this.value;clearTimeout(window._bq);window._bq=setTimeout(()=>{aBookings();const i=document.querySelector('#main input');i.focus();i.setSelectionRange(99,99)},250)" style="margin-bottom:10px">
 <div class="card" style="padding:0"><div class="tw"><table><tr><th>Date</th><th>Customer</th><th>Service</th><th>Vehicle</th><th>Status</th><th style="text-align:right">Total</th><th style="text-align:right">Owed</th></tr>${L.slice(0,150).map(b=>{const c=cust(t,b.customerId),v=veh(t,b.vehicleId);return`<tr class="click" onclick="openBk('${b.id}')"><td><b>${fd(b.date)}</b><div class="tiny mu">${b.days?'All day':b.start} · ${b.ref}</div></td><td>${c.vip?'<span class="vip">♛</span> ':''}${esc(c.first+' '+c.last)}<div class="tiny mu">${esc(b.postcode)}</div></td><td>${esc(svcOf(t,b).name)}${b.credit?' <span class="pill p-ok">credit</span>':''}</td><td>${esc(v.reg)}</td><td><span class="pill s-${b.status.replace(' ','')}">${b.status}</span>${b.changeReq?' <span class="pill p-wa">request</span>':''}</td><td style="text-align:right">${gbp(b.total)}</td><td style="text-align:right" class="${owed(t,b)?'dn':''}">${owed(t,b)?gbp(owed(t,b)):'—'}</td></tr>`}).join('')||'<tr><td colspan="7" class="empty">No bookings found</td></tr>'}</table></div></div>${L.length>150?`<p class="tiny mu">Showing 150 of ${L.length}. Narrow with search.</p>`:''}`}

/* ---- Customers CRM ---- */
function custStats(t,c){const bs=t.bookings.filter(b=>b.customerId===c.id);const spent=r2(t.payments.filter(p=>p.customerId===c.id).reduce((s,p)=>s+p.amount,0));return{bs,spent,done:bs.filter(b=>b.status==='Completed').length,last:bs.filter(b=>b.status==='Completed').map(b=>b.date).sort().slice(-1)[0]}}
function aCustomers(){const t=T();if(UI.cs){const c=t.customers.find(x=>x.id===UI.cs);if(c)return custProfile(c);UI.cs=null}
 const q=UI.cq.toLowerCase();let L=t.customers.filter(c=>!q||(c.first+' '+c.last+' '+c.email+' '+c.mobile+' '+c.postcode+' '+t.vehicles.filter(v=>v.customerId===c.id).map(v=>v.reg).join(' ')).toLowerCase().includes(q));
 const rows=L.map(c=>({c,...custStats(t,c),sub:activeSub(t,c.id)})).sort((a,b)=>b.spent-a.spent);
 $('main').innerHTML=`<div class="ph"><h2>Customers</h2><span class="pill p-mu">${t.customers.length}</span><span class="sp"></span><button class="btn sm" onclick="installsList()">App installs</button><button class="btn sm pri" onclick="addBooking()">+ New booking</button></div><input placeholder="Search name, email, mobile, postcode, reg…" value="${esc(UI.cq)}" oninput="UI.cq=this.value;clearTimeout(window._cq);window._cq=setTimeout(()=>{aCustomers();const i=document.querySelector('#main input');i.focus();i.setSelectionRange(99,99)},250)" style="margin-bottom:10px">
 <div class="card" style="padding:0"><div class="tw"><table><tr><th>Customer</th><th>Vehicles</th><th>Cleans</th><th>Last clean</th><th>Membership</th><th style="text-align:right">Total spent</th></tr>${rows.slice(0,200).map(r=>`<tr class="click" onclick="UI.cs='${r.c.id}';aCustomers()"><td><b>${r.c.vip?'<span class="vip">♛</span> ':''}${esc(r.c.first+' '+r.c.last)}</b><div class="tiny mu">${esc(r.c.postcode)} · ${esc(r.c.mobile)}</div></td><td class="tiny">${t.vehicles.filter(v=>v.customerId===r.c.id).map(v=>esc(v.reg)).join('<br>')}</td><td>${r.done}</td><td class="tiny">${r.last?fdy(r.last):'—'}</td><td>${r.sub?`<span class="pill ${r.sub.status==='active'?'p-ok':'p-bd'}">${esc(planOf(t,r.sub.planId).name)} · ${r.sub.credits} cr</span>`:'<span class="tiny mu">—</span>'}</td><td style="text-align:right"><b>${gbp(r.spent)}</b></td></tr>`).join('')}</table></div></div>`}
function installsList(){const t=T();const L=t.customers.filter(c=>c.installed);modal(`<h3>App installs (${L.length})</h3><div class="tw"><table><tr><th>First</th><th>Last</th><th>Mobile</th><th>Installed</th></tr>${L.map(c=>`<tr><td>${esc(c.first)}</td><td>${esc(c.last)}</td><td>${esc(c.mobile)}</td><td>${fdy(c.createdAt)}</td></tr>`).join('')}</table></div>`,{wide:true})}
function custProfile(c){const t=T();const st=custStats(t,c);const vs=t.vehicles.filter(v=>v.customerId===c.id);const subs=t.subs.filter(s=>s.customerId===c.id);const sub=activeSub(t,c.id);const photos=st.bs.flatMap(b=>b.photos||[]);const refs=t.referrals.filter(r=>r.referrerId===c.id);
 $('main').innerHTML=`<div class="ph"><button class="btn sm ghost" onclick="UI.cs=null;aCustomers()">← Customers</button><span class="sp"></span><button class="btn sm" onclick="emailPreview('register','${c.id}')">${c.registered?'Send password reset':'Send “register your account”'}</button><button class="btn sm pri" onclick="addBooking({cid:'${c.id}'})">+ Book</button></div>
 <div class="row"><h2 style="margin:0">${c.vip?'<span class="vip">♛</span> ':''}${esc(c.first+' '+c.last)}</h2><button class="btn xs ${c.vip?'':'ghost'}" onclick="const c=T().customers.find(x=>x.id==='${c.id}');c.vip=!c.vip;save();aCustomers()">${c.vip?'♛ VIP':'Make VIP'}</button>${c.registered?'<span class="pill p-ok">Account active</span>':'<span class="pill p-mu">No account yet</span>'}${c.installed?'<span class="pill p-ac">App installed</span>':''}</div><div class="tiny mu">Customer since ${fdy(c.createdAt)} · referral code ${esc(c.ref)}</div>
 <div class="grid g4" style="margin-top:14px"><div class="card kpi"><div class="k">Total spent</div><div class="v">${gbp(st.spent)}</div></div><div class="card kpi"><div class="k">Bookings</div><div class="v">${st.bs.length}</div><div class="d mu">${st.done} completed</div></div><div class="card kpi"><div class="k">Prepaid credits</div><div class="v">${sub?sub.credits:'—'}</div><div class="d mu">${sub?esc(planOf(t,sub.planId).name):'No membership'}</div></div><div class="card kpi"><div class="k">Wallet</div><div class="v">${gbp(c.wallet)}</div><div class="d"><a href="javascript:void 0" onclick="walletAdj('${c.id}')">Adjust</a></div></div></div>
 <div class="grid g2" style="margin-top:12px"><div class="card"><h3>Details</h3><div class="grid g2"><div><label class="f">First name</label><input id="cpf" value="${esc(c.first)}"></div><div><label class="f">Last name</label><input id="cpl" value="${esc(c.last)}"></div><div><label class="f">Email</label><input id="cpe" value="${esc(c.email)}"></div><div><label class="f">Mobile</label><input id="cpm" value="${esc(c.mobile)}"></div><div><label class="f">House no.</label><input id="cph" value="${esc(c.house)}"></div><div><label class="f">Postcode</label><input id="cpp" value="${esc(c.postcode)}"></div></div><label class="f">Address</label><input id="cpa" value="${esc(c.addr)}"><label class="f">Customer notes</label><textarea id="cpn">${esc(c.notes)}</textarea><div class="row" style="margin-top:8px"><button class="btn sm pri" onclick="saveCust('${c.id}')">Save</button><a class="btn sm" href="tel:${esc(c.mobile)}">Call</a><a class="btn sm" href="https://wa.me/${intl(c.mobile)}">WhatsApp</a><span class="sp"></span><button class="btn xs bad" onclick="askConfirm('Delete ${esc(c.first)} and all their bookings, vehicles and history?',()=>delCust('${c.id}'),'Delete customer')">Delete</button></div></div>
 <div class="col"><div class="card"><div class="row"><h3 style="margin:0">Vehicles</h3><span class="sp"></span><button class="btn xs" onclick="addVeh('${c.id}')">+ Add</button></div>${vs.map(v=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--ln)"><b style="background:#f5c518;color:#000;padding:0 6px;border-radius:4px;font-family:Sora">${esc(v.reg)}</b><span class="tiny">${esc(v.make+' '+v.model)} · ${esc(v.colour)} · ${SIZES[v.size]}</span><span class="sp"></span><span class="tiny mu">${st.bs.filter(b=>b.vehicleId===v.id&&b.status==='Completed').length} cleans</span></div>`).join('')}</div>
 <div class="card"><h3>Membership</h3>${subs.length?subs.map(s=>`<div class="row" style="padding:6px 0;cursor:pointer" onclick="subModal('${s.id}')"><b>${esc(planOf(t,s.planId).name)}</b><span class="pill ${s.status==='active'?'p-ok':s.status==='past_due'?'p-bd':'p-mu'}">${s.status.replace('_',' ')}</span><span class="tiny mu">${fdy(s.start)} – ${fdy(s.end)}</span><span class="sp"></span><b>${s.credits} cr</b></div>`).join(''):`<p class="tiny mu">No membership.</p>`}<button class="btn xs" onclick="adminSub('${c.id}')">+ Add membership</button></div>
 ${refs.length?`<div class="card"><h3>Referrals</h3>${refs.map(r=>`<div class="tiny">${esc(cust(t,r.refereeId).first+' '+cust(t,r.refereeId).last)} · <span class="pill ${r.status==='rewarded'?'p-ok':'p-wa'}">${r.status}</span> ${gbp(r.reward)}</div>`).join('')}</div>`:''}</div></div>
 <div class="card" style="margin-top:12px;padding:0"><h3 style="padding:14px 14px 0">Booking history & invoices</h3><div class="tw"><table><tr><th>Date</th><th>Service</th><th>Vehicle</th><th>Status</th><th style="text-align:right">Total</th><th></th></tr>${st.bs.sort((a,b)=>a.date<b.date?1:-1).map(b=>`<tr class="click" onclick="openBk('${b.id}')"><td>${fdy(b.date)}</td><td>${esc(svcOf(t,b).name)}${b.credit?' <span class="pill p-ok">credit</span>':''}</td><td>${esc(veh(t,b.vehicleId).reg)}</td><td><span class="pill s-${b.status.replace(' ','')}">${b.status}</span></td><td style="text-align:right">${gbp(b.total)}${owed(t,b)?`<div class="tiny dn">owes ${gbp(owed(t,b))}</div>`:''}</td><td><button class="btn xs" onclick="event.stopPropagation();showInvoice('${b.id}')">${owed(t,b)?'Invoice':'Receipt'}</button></td></tr>`).join('')}</table></div></div>
 ${photos.length?`<div class="card" style="margin-top:12px"><h3>Before & after</h3><div class="grid g3">${photos.map(p=>`<div>${baHTML(p)}<div class="tiny mu">${esc(p.title||'')}</div></div>`).join('')}</div></div>`:''}`}
function saveCust(id){const c=T().customers.find(x=>x.id===id);Object.assign(c,{first:val('cpf'),last:val('cpl'),email:val('cpe'),mobile:val('cpm'),house:val('cph'),postcode:fmtPC(val('cpp')),addr:val('cpa'),notes:val('cpn')});save();toast('Customer saved');aCustomers()}
function delCust(id){const t=T();const bids=new Set(t.bookings.filter(b=>b.customerId===id).map(b=>b.id));t.bookings=t.bookings.filter(b=>!bids.has(b.id));t.payments=t.payments.filter(p=>!bids.has(p.bookingId)&&p.customerId!==id);t.vehicles=t.vehicles.filter(v=>v.customerId!==id);t.subs=t.subs.filter(s=>s.customerId!==id);t.customers=t.customers.filter(c=>c.id!==id);UI.cs=null;save();toast('Customer deleted');aCustomers()}
function walletAdj(id){modal(`<h3>Adjust wallet</h3><label class="f">Amount (use minus to deduct)</label><input id="wa" type="number" step="0.01" value="10"><label class="f">Reason</label><input id="wr" value="Goodwill credit"><button class="btn pri block" style="margin-top:10px" onclick="const t=T(),c=t.customers.find(x=>x.id==='${id}');c.wallet=r2((c.wallet||0)+(+val('wa')||0));cnotify(t,c.id,'credits',gbp(+val('wa'))+' wallet adjustment: '+val('wr'));save();closeModal();aCustomers()">Apply</button>`)}
function addVeh(cid){modal(`<h3>Add vehicle</h3><label class="f">Registration <b>*</b></label><input id="nvr" style="text-transform:uppercase"><div class="grid g3"><div><label class="f">Make</label><input id="nvm"></div><div><label class="f">Model</label><input id="nvo"></div><div><label class="f">Colour</label><input id="nvc"></div></div><label class="f">Size</label><select id="nvs">${SIZES.map((z,i)=>`<option value="${i}">${z}</option>`).join('')}</select><button class="btn pri block" style="margin-top:10px" onclick="if(!val('nvr'))return toast('Add a reg');T().vehicles.push({id:uid(),customerId:'${cid}',reg:val('nvr').toUpperCase(),make:val('nvm'),model:val('nvo'),colour:val('nvc'),size:+val('nvs')});save();closeModal();aCustomers()">Add vehicle</button>`)}

/* ---- Memberships ---- */
function aMembers(){const t=T(),today=TODAY();const st=UI.stab;let L=t.subs.slice();if(st!=='all')L=L.filter(s=>s.status===st);
 const act=t.subs.filter(s=>s.status==='active'||s.status==='past_due');const sales=rev(t,[addD(today,-365),today],'membership');const cred=act.reduce((x,s)=>x+s.credits,0);const owedVal=r2(act.reduce((x,s)=>x+(s.count?s.amount/s.count:0)*s.credits,0));const ren=act.filter(s=>s.end<=addD(today,30));
 $('main').innerHTML=`<div class="ph"><h2>Pre-paid plans</h2><span class="sp"></span><button class="btn sm" onclick="runBilling()">Run daily checks</button><button class="btn sm pri" onclick="editPlan()">+ New plan</button></div>
 <div class="notice" style="margin-bottom:12px">Customers pay once for a block of visits at <b>${t.settings.prepaidOff}% off</b> (e.g. 12 × ${gbp(t.services.find(x=>x.id==='mnt')?.p[0]||80)} maintenance = ${gbp(12*(t.services.find(x=>x.id==='mnt')?.p[0]||80))} → <b>${gbp(r2(12*(t.services.find(x=>x.id==='mnt')?.p[0]||80)*(1-t.settings.prepaidOff/100)))}</b>). Credits go into their stamp book; each booking uses one. <a href="javascript:void 0" onclick="setPrepaidOff()">Change default discount</a></div>
 <div class="grid g4"><div class="card kpi"><div class="k">Active plans</div><div class="v">${act.length}</div></div><div class="card kpi"><div class="k">Pre-paid sales (12 months)</div><div class="v">${gbp(sales)}</div></div><div class="card kpi"><div class="k">Visits still owed</div><div class="v">${cred}</div><div class="d mu">worth ${gbp(owedVal)} already paid</div></div><div class="card kpi"><div class="k">Renewals in 30 days</div><div class="v">${ren.length}</div><div class="d ${t.subs.filter(s=>s.status==='past_due').length?'dn':'mu'}">${t.subs.filter(s=>s.status==='past_due').length} failed renewal(s)</div></div></div>
 <h3 style="margin-top:20px">Plans</h3><div class="grid g3">${t.plans.map(p=>{const sv=t.services.find(x=>x.id===p.serviceId)||{name:'?'};return`<div class="card"><div class="row"><b>${esc(p.name)}</b>${p.active?'':'<span class="pill p-mu">hidden</span>'}<span class="sp"></span><button class="btn xs" onclick="editPlan('${p.id}')">Edit</button></div><div class="tiny mu">${p.counts.join(' or ')} × ${esc(sv.name)} · ${planOff(t,p)}% off · ${p.months} months</div><div class="tiny" style="margin-top:6px">${p.counts.map(n=>`${n} visits: ${SIZES.map((z,i)=>`${z[0]} ${gbp(planPrice(t,p,i,n))}`).join(' · ')}`).join('<br>')}</div><div class="tiny mu" style="margin-top:6px">Redeemable on: ${p.eligible.map(e=>esc((t.services.find(s=>s.id===e)||{}).name)).join(', ')} · ${t.subs.filter(s=>s.planId===p.id&&s.status==='active').length} active</div></div>`}).join('')}</div>
 <div class="row" style="margin:20px 0 10px"><h3 style="margin:0">Customers on plans</h3><span class="sp"></span><div class="tabs">${[['all','All'],['active','Active'],['past_due','Failed renewal'],['paused','Paused'],['cancelled','Cancelled'],['expired','Expired']].map(x=>`<button class="tab ${st===x[0]?'on':''}" onclick="UI.stab='${x[0]}';aMembers()">${x[1]}</button>`).join('')}</div></div>
 <div class="card" style="padding:0"><div class="tw"><table><tr><th>Customer</th><th>Plan</th><th>Paid</th><th>Valid</th><th>Stamps</th><th>Status</th></tr>${L.map(s=>{const c=cust(t,s.customerId);const used=t.bookings.filter(b=>b.subId===s.id&&b.status!=='Cancelled').length;return`<tr class="click" onclick="subModal('${s.id}')"><td><b>${esc(c.first+' '+c.last)}</b>${s.request?`<div class="tiny" style="color:#fcd34d">Request: ${esc(s.request)}</div>`:''}</td><td>${esc(planOf(t,s.planId).name)}<div class="tiny mu">${s.count} visits · ${SIZES[s.size||0]}</div></td><td>${gbp(s.amount||0)}</td><td class="tiny">${fdy(s.start)} – ${fdy(s.end)}${s.end<=addD(today,30)&&s.status==='active'?' <span class="pill p-wa">renews soon</span>':''}</td><td><b>${used}</b><span class="mu"> used · </span><b>${s.credits}</b><span class="mu"> left</span></td><td><span class="pill ${s.status==='active'?'p-ok':s.status==='past_due'?'p-bd':'p-mu'}">${s.status.replace('_',' ')}</span>${s.autoRenew?'':'<div class="tiny mu">no auto-renew</div>'}</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">None</td></tr>'}</table></div></div>
 <p class="tiny mu">A credit is used when a booking is made and returned if the booking is cancelled within policy. Unused credits expire ${t.settings.creditGrace} days after the plan ends. Auto-renew charges the same block again at today's prices.</p>`}
function setPrepaidOff(){modal(`<h3>Default pre-paid discount</h3><label class="f">Discount %</label><input id="ppo" type="number" value="${T().settings.prepaidOff}"><p class="tiny mu">Applies to every plan unless the plan sets its own.</p><button class="btn pri block" onclick="T().settings.prepaidOff=+val('ppo');save();closeModal();refreshMain()">Save</button>`)}
function editPlan(id){const t=T();const p=id?t.plans.find(x=>x.id===id):{id:'',name:'',serviceId:'mnt',eligible:['mnt'],counts:[12,24],months:12,off:null,desc:'',active:true};
 modal(`<h3>${id?'Edit':'New'} pre-paid plan</h3><label class="f">Name</label><input id="pn" value="${esc(p.name)}"><label class="f">Description</label><input id="pd" value="${esc(p.desc)}"><div class="grid g2"><div><label class="f">Priced on (service)</label><select id="ps">${t.services.filter(s=>!s.days).map(s=>`<option value="${s.id}" ${p.serviceId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div><label class="f">Visit options (comma separated)</label><input id="pc" value="${p.counts.join(', ')}"></div><div><label class="f">Discount % (blank = default ${t.settings.prepaidOff}%)</label><input id="po" type="number" value="${p.off??''}"></div><div><label class="f">Valid for (months)</label><input id="pmo" type="number" value="${p.months}"></div></div><label class="f">Credits can also be redeemed against</label><div class="col">${t.services.map(s=>`<label class="row tiny" style="gap:6px"><input type="checkbox" class="pe" value="${s.id}" ${p.eligible.includes(s.id)?'checked':''}> ${esc(s.name)}</label>`).join('')}</div><label class="row tiny" style="gap:6px;margin-top:10px"><input type="checkbox" id="pa" ${p.active?'checked':''}> Show on website</label><label class="row tiny" style="gap:6px"><input type="checkbox" id="pf" ${p.featured?'checked':''}> Mark as most popular</label>
 <div class="row" style="margin-top:12px"><button class="btn pri" onclick="savePlan('${p.id}')">Save plan</button>${id?`<button class="btn bad" onclick="if(T().subs.some(s=>s.planId==='${id}'))return toast('Plan has customers — hide it instead');T().plans=T().plans.filter(x=>x.id!=='${id}');save();closeModal();aMembers()">Delete</button>`:''}</div>`)}
function savePlan(id){const t=T();const counts=val('pc').split(',').map(x=>parseInt(x)).filter(n=>n>0);const el=[...document.querySelectorAll('.pe:checked')].map(x=>x.value);if(!el.includes(val('ps')))el.unshift(val('ps'));
 const o={name:val('pn')||'Plan',desc:val('pd'),serviceId:val('ps'),counts:counts.length?counts:[12],off:val('po')===''?null:+val('po'),months:Math.max(1,+val('pmo')||12),eligible:el,active:$('pa').checked,featured:$('pf').checked};
 if(id)Object.assign(t.plans.find(x=>x.id===id),o);else t.plans.push({id:uid(),...o});save();closeModal();toast('Plan saved');aMembers()}
function subModal(id){const t=T(),s=t.subs.find(x=>x.id===id),c=cust(t,s.customerId),p=planOf(t,s.planId);
 modal(`<div class="tiny mu">Pre-paid plan</div><h2 style="margin:2px 0">${esc(c.first+' '+c.last)}</h2><div class="row"><span class="pill ${s.status==='active'?'p-ok':s.status==='past_due'?'p-bd':'p-mu'}">${s.status.replace('_',' ')}</span><b>${esc(p.name)}</b><span class="tiny mu">${s.count} visits · ${SIZES[s.size||0]} · paid ${gbp(s.amount||0)}</span></div>

 else{const C=S.chat;body=`<div class="card"><div class="row"><h3 style="margin:0">Live chat on website</h3><span class="sp"></span><label class="sw"><input type="checkbox" ${C.on?'checked':''} onchange="T().settings.chat.on=this.checked;save()"><span></span></label></div><label class="f">Greeting (first message visitors see)</label><textarea id="cg">${esc(C.greeting)}</textarea><label class="f">Away message (outside working hours, no keyword match)</label><textarea id="caw">${esc(C.away)}</textarea><button class="btn sm pri" style="margin-top:8px" onclick="const C=T().settings.chat;C.greeting=val('cg');C.away=val('caw');save();toast('Saved')">Save</button></div>
