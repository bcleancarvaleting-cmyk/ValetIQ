<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>B Clean Admin</title>
<meta name="theme-color" content="#07080a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="B Clean Admin">
<link rel="manifest" href="/admin/manifest.webmanifest">
<link rel="apple-touch-icon" href="/admin/apple-touch-icon.png">
<link rel="icon" href="/admin/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080a;--p1:#0e1014;--p2:#151820;--p3:#1c2029;--ln:#242935;--tx:#eef1f6;--mu:#8a92a6;--ac:#2f7bff;--ok:#22c55e;--wa:#f59e0b;--bd:#ef4444;--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Sora,Inter,sans-serif;letter-spacing:-.02em;margin:0 0 .4em}h2{font-size:22px}h3{font-size:17px}h4{font-size:14px;margin-top:14px}
p{margin:0 0 .7em}.mu{color:var(--mu)}.tiny{font-size:12.5px}.b{font-weight:700}
button{font:inherit;cursor:pointer;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--ln);background:var(--p2);color:var(--tx);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}.btn.xs{padding:4px 9px;font-size:12px;border-radius:8px}.btn.bad{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.4);color:#fca5a5}.btn.ok{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.4);color:#86efac}.btn.wa{background:#25D366;border-color:#25D366;color:#03140a}.btn.block{width:100%}.btn:disabled{opacity:.45}
input,select,textarea{background:var(--p2);border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:11px 12px;font:inherit;font-size:16px;width:100%;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--ac)}input[type=checkbox]{width:auto;accent-color:var(--ac)}textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px;font-weight:500}label.f b{color:var(--bd)}
.card{background:var(--p1);border:1px solid var(--ln);border-radius:16px;padding:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}.col{display:flex;flex-direction:column;gap:8px}
.grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:520px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.s-Pending{background:rgba(245,158,11,.15);color:#fcd34d}.s-Booked{background:rgba(138,146,166,.16);color:#c3c9d6}.s-Confirmed{background:rgba(47,123,255,.16);color:#8db6ff}.s-InProgress{background:rgba(245,158,11,.15);color:#fcd34d}.s-Completed{background:rgba(34,197,94,.14);color:#86efac}.s-Cancelled{background:rgba(239,68,68,.13);color:#fca5a5}
.p-ok{background:rgba(34,197,94,.14);color:#86efac}.p-bd{background:rgba(239,68,68,.13);color:#fca5a5}.p-mu{background:var(--p3);color:var(--mu)}.p-ac{background:rgba(47,123,255,.16);color:#8db6ff}
.top{position:sticky;top:0;z-index:20;background:rgba(7,8,10,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--ln);padding:calc(10px + var(--st)) 14px 10px;display:flex;align-items:center;gap:10px}
.badge{width:34px;height:34px;border-radius:50%;background:var(--ac);display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;font-family:Sora;flex:none}
.main{padding:14px 14px calc(96px + var(--sb));max-width:900px;margin:0 auto}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(14,16,20,.95);backdrop-filter:blur(14px);border-top:1px solid var(--ln);display:grid;grid-template-columns:repeat(6,1fr);padding:6px 6px calc(6px + var(--sb))}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mu);padding:6px 0;border-radius:10px}.nav button.on{color:var(--tx)}.nav button.on svg{color:var(--ac)}.nav svg{width:22px;height:22px}
.nav .add{background:var(--ac);color:#fff;border-radius:14px;margin:2px 4px}@media(max-width:380px){.nav button{font-size:10px}}.nav .add svg{color:#fff!important}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{padding:7px 14px;border-radius:999px;background:var(--p2);border:1px solid var(--ln);color:var(--mu);font-size:13px;font-weight:600;white-space:nowrap}.tab.on{background:var(--tx);color:#000;border-color:var(--tx)}
.job{display:flex;gap:12px;padding:12px;border:1px solid var(--ln);border-radius:14px;background:var(--p1);margin-bottom:8px;cursor:pointer;border-left:4px solid var(--mu)}
.job.c-Confirmed{border-left-color:var(--ac)}.job.c-InProgress{border-left-color:var(--wa)}.job.c-Completed{border-left-color:var(--ok)}.job.c-Pending{border-left-color:var(--wa)}.job.c-Cancelled{opacity:.55;border-left-color:var(--bd)}
.job .t{min-width:52px;font-family:Sora;font-weight:700}.job .t small{display:block;font-family:Inter;font-weight:500;color:var(--mu);font-size:11.5px}
.reg{background:#f5c518;color:#000;font-family:Sora;font-weight:700;padding:1px 7px;border-radius:5px;font-size:12.5px;letter-spacing:.03em}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.chip{border:1px solid var(--ln);border-radius:10px;padding:7px 4px;text-align:center;font-size:12.5px;background:var(--p2)}.chip b{display:block;font-family:Sora;font-size:14px}.chip.free{border-color:rgba(34,197,94,.5)}.chip.busy{border-color:rgba(239,68,68,.4);opacity:.75}.chip.off{opacity:.4;text-decoration:line-through}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.mcell{min-height:62px;background:var(--p1);border:1px solid var(--ln);border-radius:10px;padding:5px;font-size:11px;cursor:pointer}.mcell.dim{opacity:.35}.mcell.td{border-color:var(--ac)}.mcell.off{background:rgba(239,68,68,.06)}.mcell b{font-family:Sora;font-size:13px}.mcell .n{display:block;margin-top:4px;color:var(--ac);font-weight:700}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.sheet .in{background:var(--p1);border:1px solid var(--ln);border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:18px 16px calc(24px + var(--sb));animation:up .2s ease}
@media(min-width:700px){.sheet{align-items:center}.sheet .in{border-radius:20px;max-height:88vh}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet .x{float:right;width:34px;height:34px;border-radius:50%;border:1px solid var(--ln);background:var(--p2)}
.sum{background:var(--p2);border-radius:12px;padding:12px}.sum .l{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}.sum .t{font-weight:700;border-top:1px solid var(--ln);margin-top:6px;padding-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + var(--sb));z-index:90;background:#fff;color:#000;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw;text-align:center}
.toast.err{background:#fecaca;color:#7f1d1d}
.sw{position:relative;display:inline-block;width:46px;height:26px;flex:none}.sw input{opacity:0;width:0;height:0}.sw span{position:absolute;inset:0;background:var(--p3);border:1px solid var(--ln);border-radius:999px;transition:.15s}.sw span:before{content:'';position:absolute;width:20px;height:20px;left:2px;top:2px;border-radius:50%;background:#fff;transition:.15s}.sw input:checked+span{background:var(--ok);border-color:var(--ok)}.sw input:checked+span:before{transform:translateX(20px)}
.kpi .k{font-size:12px;color:var(--mu)}.kpi .v{font-family:Sora;font-size:22px;font-weight:700}
.list .it{padding:11px 0;border-bottom:1px solid var(--ln);cursor:pointer}.list .it:last-child{border-bottom:0}
.empty{padding:26px;text-align:center;color:var(--mu)}
.spin{width:22px;height:22px;border:3px solid var(--ln);border-top-color:var(--ac);border-radius:50%;animation:sp 0.8s linear infinite;margin:30px auto}@keyframes sp{to{transform:rotate(360deg)}}
.banner{border-radius:14px;padding:12px 14px;font-size:13.5px;border:1px solid}.banner.off{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.45)}.banner.on{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.4)}
.sug{background:var(--p2);border:1px solid var(--ln);border-radius:10px;margin-top:4px;max-height:220px;overflow:auto}.sug div{padding:9px 12px;border-bottom:1px solid var(--ln);cursor:pointer}.sug div:last-child{border-bottom:0}
.thumb{width:96px;height:56px;border-radius:8px;background:var(--p3) center/cover;flex:none;border:1px solid var(--ln)}.thumb.sq{width:64px;height:64px}
.up{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--ln);border-radius:12px;padding:16px;color:var(--mu);font-weight:600;cursor:pointer;text-align:center}.up input{display:none}
.auth{max-width:400px;margin:0 auto;padding:calc(50px + var(--st)) 20px 40px}
</style>
</head>
<body>
<div id="app"><div class="spin"></div></div>
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================= helpers ================= */
const CFG=window.VALETIQ||{};
const $=id=>document.getElementById(id);const val=id=>{const e=$(id);return e?e.value.trim():''};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const addM=(s,n)=>{const d=pd(s);d.setDate(1);d.setMonth(d.getMonth()+n);return ymd(d)};
const TODAY=()=>ymd(new Date());const hm=t=>(t||'').slice(0,5);const tm=s=>{const[h,m]=hm(s).split(':').map(Number);return h*60+m};const ft=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fd=s=>{const d=pd(s);return`${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`};const fdy=s=>{const d=pd(s);return`${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`};
const gbp=n=>{n=Math.round((+n||0)*100)/100;return'£'+n.toLocaleString('en-GB',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})};
const r2=n=>Math.round(n*100)/100;const intl=m=>{m=(m||'').replace(/\D/g,'');return m.startsWith('0')?'44'+m.slice(1):m};
const SIZES=['Small','Medium','Large'];const STATUSES=['Booked','Confirmed','In Progress','Completed','Cancelled'];const CATS=['Valeting','Detailing','Additional Services'];
const NOEMAIL='@no-email.invalid';const showEmail=e=>e&&e.endsWith(NOEMAIL)?'':e;
function toast(m,err){const e=document.createElement('div');e.className='toast'+(err?' err':'');e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),err?4500:2600)}
function sheet(html){closeSheet();const s=document.createElement('div');s.className='sheet';s.id='sheet';s.innerHTML=`<div class="in"><button class="x" onclick="closeSheet()" aria-label="Close">✕</button>${html}</div>`;s.addEventListener('click',e=>{if(e.target===s)closeSheet()});document.body.appendChild(s)}
function closeSheet(){const s=$('sheet');if(s)s.remove()}
let _cf=null;function confirmBox(msg,fn,yes='Yes'){_cf=fn;sheet(`<h3>Are you sure?</h3><p class="mu">${msg}</p><div class="row"><button class="btn bad" onclick="closeSheet();_cf&&_cf()">${yes}</button><button class="btn" onclick="closeSheet()">Back</button></div>`)}
const errMsg=e=>(e&&(e.message||e.error_description))||String(e);
const ICON={web:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z',home:'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',diary:'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z',plus:'M12 5v14M5 12h14',users:'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75',gear:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z'};
const ico=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${ICON[k]}"/></svg>`;

/* ================= state ================= */
const sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const S={user:null,biz:null,services:[],slots:[],blocked:[],view:'home',date:TODAY(),dv:'day',cq:'',cust:null};
const svcById=id=>S.services.find(s=>s.id===id);
const priceFor=(s,size)=>size==2?(s.price_large??s.price_medium??s.price_small):size==1?(s.price_medium??s.price_small):s.price_small;
const isWork=d=>{const wd=S.biz.settings.workDays||[1,2,3,4,5,6];return wd.includes(pd(d).getDay())&&!S.blocked.some(b=>d>=b.from_date&&d<=b.to_date)};
const blockedReason=d=>(S.blocked.find(b=>d>=b.from_date&&d<=b.to_date)||{}).reason;
const paid=(b,pays)=>r2(pays.filter(p=>p.booking_id===b.id).reduce((s,p)=>s+ +p.amount,0));
const owed=(b,pays)=>b.status==='Cancelled'?0:Math.max(0,r2(+b.total-paid(b,pays)));
const endMin=b=>b.days>0?tm(S.biz.settings.hours?.end||'18:00'):tm(b.start_time)+b.duration_mins;

/* ================= boot / auth ================= */
async function boot(){
 if('serviceWorker' in navigator)navigator.serviceWorker.register('/admin/sw.js').catch(()=>{});
 const{data:{session}}=await sb.auth.getSession();
 sb.auth.onAuthStateChange((ev,ses)=>{if(ev==='PASSWORD_RECOVERY')return newPassword();if(ev==='SIGNED_OUT'){S.user=null;renderAuth()}});
 if(location.hash.includes('type=recovery'))return newPassword();
 if(!session)return renderAuth();
 S.user=session.user;await loadBiz()}
function renderAuth(mode='login'){
 $('app').innerHTML=`<div class="auth"><div style="text-align:center;margin-bottom:22px"><div class="badge" style="width:64px;height:64px;font-size:22px;margin:0 auto 12px">BC</div><h2>B Clean Admin</h2><p class="mu">${mode==='signup'?'Create your admin login':'Sign in to manage your diary and bookings'}</p></div>
 <div class="card"><label class="f">Email</label><input id="ae" type="email" autocomplete="email" inputmode="email"><label class="f">Password</label><input id="ap" type="password" autocomplete="${mode==='signup'?'new-password':'current-password'}">
 ${mode==='signup'?'<p class="tiny mu" style="margin-top:8px">At least 8 characters. You\'ll get an email to confirm your address.</p>':''}
 <button class="btn pri block" style="margin-top:14px" onclick="${mode==='signup'?'doSignup()':'doLogin()'}">${mode==='signup'?'Create login':'Sign in'}</button>
 <div class="row" style="margin-top:12px;justify-content:space-between">${mode==='signup'?`<button class="btn sm" onclick="renderAuth('login')">I have a login</button>`:`<button class="btn sm" onclick="renderAuth('signup')">Create a login</button><button class="btn sm" onclick="forgot()">Forgot password?</button>`}</div></div></div>`;
 $('ap').addEventListener('keydown',e=>{if(e.key==='Enter')mode==='signup'?doSignup():doLogin()})}
async function doLogin(){const{data,error}=await sb.auth.signInWithPassword({email:val('ae'),password:$('ap').value});if(error)return toast(error.message==='Invalid login credentials'?'Email or password not recognised':errMsg(error),1);S.user=data.user;loadBiz()}
async function doSignup(){if($('ap').value.length<8)return toast('Password must be at least 8 characters',1);const{data,error}=await sb.auth.signUp({email:val('ae'),password:$('ap').value,options:{emailRedirectTo:location.origin+'/admin/'}});if(error)return toast(errMsg(error),1);
 if(data.session){S.user=data.user;return loadBiz()}$('app').innerHTML=`<div class="auth"><div class="card"><h3>Check your email 📧</h3><p class="mu">We've sent a confirmation link to <b>${esc(val('ae')||'your email')}</b>. Tap it, then come back here and sign in.</p><button class="btn pri block" onclick="renderAuth('login')">Back to sign in</button></div></div>`}
async function forgot(){const e=val('ae');if(!e)return toast('Type your email first',1);const{error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+'/admin/'});if(error)return toast(errMsg(error),1);toast('Password reset email sent')}
function newPassword(){$('app').innerHTML=`<div class="auth"><div class="card"><h3>Choose a new password</h3><input id="np" type="password" autocomplete="new-password"><button class="btn pri block" style="margin-top:12px" onclick="setPw()">Save password</button></div></div>`}
async function setPw(){const p=$('np').value;if(p.length<8)return toast('At least 8 characters',1);const{data,error}=await sb.auth.updateUser({password:p});if(error)return toast(errMsg(error),1);toast('Password updated');history.replaceState(null,'',location.pathname);S.user=data.user;loadBiz()}
async function signOut(){await sb.auth.signOut();location.reload()}
async function loadBiz(){
 $('app').innerHTML='<div class="spin"></div>';
 const{data:m,error}=await sb.from('business_members').select('role, businesses(*)').eq('user_id',S.user.id);
 if(error)return fatal(error);
 const mem=(m||[]).find(x=>x.businesses&&x.businesses.slug===(CFG.business||'bclean'))||(m||[])[0];
 if(!mem){$('app').innerHTML=`<div class="auth"><div class="card"><h3>Almost there</h3><p class="mu">You're signed in as <b>${esc(S.user.email)}</b>, but this login isn't linked to a business yet.</p><p class="mu">Ask valetIQ to link it — once done, tap refresh.</p><div class="row"><button class="btn pri" onclick="loadBiz()">Refresh</button><button class="btn" onclick="signOut()">Sign out</button></div></div></div>`;return}
 S.biz=mem.businesses;S.role=mem.role;S.biz.settings=S.biz.settings||{};
 await loadCatalogue();renderShell()}
async function loadCatalogue(){const b=S.biz.id;
 const [sv,sl,bl]=await Promise.all([sb.from('services').select('*').eq('business_id',b).order('sort'),sb.from('time_slots').select('*').eq('business_id',b).order('start_time'),sb.from('blocked_dates').select('*').eq('business_id',b).gte('to_date',addD(TODAY(),-400)).order('from_date')]);
 if(sv.error||sl.error||bl.error)return fatal(sv.error||sl.error||bl.error);S.services=sv.data;S.slots=sl.data;S.blocked=bl.data}
function fatal(e){$('app').innerHTML=`<div class="auth"><div class="card"><h3>Something went wrong</h3><p class="mu">${esc(errMsg(e))}</p><button class="btn pri" onclick="location.reload()">Try again</button></div></div>`}
async function saveSettings(patch){const settings={...S.biz.settings,...patch};const{error}=await sb.from('businesses').update({settings}).eq('id',S.biz.id);if(error){toast(errMsg(error),1);return false}S.biz.settings=settings;return true}

/* ================= shell ================= */
function renderShell(){const st=S.biz.settings;
 $('app').innerHTML=`<div class="top"><div class="badge">${esc((S.biz.name.match(/\b\w/g)||['V']).join('').slice(0,2).toUpperCase())}</div><div style="flex:1;min-width:0"><b>${esc(S.biz.name)} Admin</b><div class="tiny mu">${st.onlineBooking?'<span style="color:#86efac">● Online booking on</span>':'<span style="color:#fcd34d">● Online booking off</span>'}</div></div><button class="btn sm" onclick="go(S.view)" title="Refresh">↻</button></div>
 <div class="main" id="main"></div>
 <nav class="nav">${[['home','Home','home'],['diary','Diary','diary'],['add','Add','plus'],['customers','Customers','users'],['website','Website','web'],['settings','Settings','gear']].map(n=>`<button class="${n[0]==='add'?'add':''} ${S.view===n[0]?'on':''}" onclick="${n[0]==='add'?'addBooking()':`go('${n[0]}')`}">${ico(n[2])}${n[1]}</button>`).join('')}</nav>`;
 go(S.view)}
function go(v){S.view=v;document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('on',['home','diary','add','customers','website','settings'][i]===v));const m=$('main');if(!m)return;m.innerHTML='<div class="spin"></div>';window.scrollTo(0,0);({home:vHome,diary:vDiary,customers:vCustomers,website:vWebsite,settings:vSettings})[v]().catch(e=>{m.innerHTML=`<div class="card"><b>Couldn't load</b><p class="mu">${esc(errMsg(e))}</p><button class="btn sm" onclick="go('${v}')">Try again</button></div>`})}

async function fetchBookings(from,to){const{data,error}=await sb.from('bookings').select('*, customers(id,first_name,last_name,mobile,email,vip), vehicles(reg,make,model,colour)').eq('business_id',S.biz.id).gte('date',addD(from,-3)).lte('date',to).order('date').order('start_time');if(error)throw error;
 const L=data.filter(b=>{const end=b.days>0?addD(b.date,b.days-1):b.date;return end>=from&&b.date<=to});
 const ids=L.map(b=>b.id);let pays=[];if(ids.length){for(let i=0;i<ids.length;i+=150){const r=await sb.from('payments').select('*').in('booking_id',ids.slice(i,i+150));if(r.error)throw r.error;pays=pays.concat(r.data)}}return{L,pays}}
const covers=(b,d)=>b.days>0?(d>=b.date&&d<=addD(b.date,b.days-1)):b.date===d;

/* ================= HOME ================= */
async function vHome(){const t=TODAY(),d=pd(t);const mFrom=ymd(new Date(d.getFullYear(),d.getMonth(),1)),mTo=ymd(new Date(d.getFullYear(),d.getMonth()+1,0));
 const[{L,pays},nt]=await Promise.all([fetchBookings(mFrom<t?mFrom:t,addD(t,30)>mTo?addD(t,30):mTo),sb.from('notifications').select('*').eq('business_id',S.biz.id).order('created_at',{ascending:false}).limit(8)]);
 const live=L.filter(b=>b.status!=='Cancelled');const today=live.filter(b=>covers(b,t));const month=live.filter(b=>b.date>=mFrom&&b.date<=mTo);const up=live.filter(b=>b.date>=t&&b.status!=='Completed').slice(0,8);
 const st=S.biz.settings;
 $('main').innerHTML=`${!st.onlineBooking?`<div class="banner off" style="margin-bottom:12px"><b>Online booking is off.</b> Customers can only send requests by WhatsApp/email. Add your existing bookings, then switch it on in <a href="javascript:void 0" onclick="go('settings')" style="color:#fcd34d">Settings</a>.</div>`:''}
 <div class="card" style="margin-bottom:12px"><div class="row"><div><div class="tiny mu">Work today · ${fd(t)}</div><div class="kpi"><div class="v" style="font-size:30px">${gbp(today.reduce((s,b)=>s+ +b.total,0))}</div></div></div><span class="sp"></span><div class="tiny mu" style="text-align:right">${today.length} job${today.length===1?'':'s'}<br>${gbp(today.reduce((s,b)=>s+owed(b,pays),0))} to collect</div></div>
 ${today.length?'<div style="margin-top:10px">'+today.map(b=>jobHTML(b,pays)).join('')+'</div>':'<p class="mu tiny" style="margin:8px 0 0">Nothing booked today.</p>'}</div>
 <div class="grid g3" style="margin-bottom:12px"><div class="card kpi"><div class="k">This month</div><div class="v">${gbp(month.reduce((s,b)=>s+ +b.total,0))}</div><div class="tiny mu">${month.length} bookings</div></div><div class="card kpi"><div class="k">Taken this month</div><div class="v">${gbp(pays.filter(p=>p.created_at.slice(0,10)>=mFrom).reduce((s,p)=>s+ +p.amount,0))}</div></div><div class="card kpi"><div class="k">Upcoming</div><div class="v">${live.filter(b=>b.date>=t&&b.status!=='Completed').length}</div><div class="tiny mu">next 30 days</div></div></div>
 <div class="card" style="margin-bottom:12px"><div class="row" style="margin-bottom:6px"><h3 style="margin:0">Coming up</h3><span class="sp"></span><button class="btn xs" onclick="go('diary')">Diary →</button></div>${up.length?up.map(b=>jobHTML(b,pays,true)).join(''):'<p class="mu tiny">No upcoming bookings yet.</p>'}</div>
 ${(nt.data||[]).length?`<div class="card"><h3>Notifications</h3><div class="list">${nt.data.map(n=>`<div class="it" onclick="${n.booking_id?`openBooking('${n.booking_id}')`:''}"><div class="row"><span>${n.read?'':'<span style="color:var(--ac)">●</span> '}${esc(n.text)}</span></div><div class="tiny mu">${new Date(n.created_at).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div></div>`).join('')}</div><button class="btn xs" style="margin-top:8px" onclick="markRead()">Mark all read</button></div>`:''}`}
async function markRead(){await sb.from('notifications').update({read:true}).eq('business_id',S.biz.id).eq('read',false);go('home')}
function jobHTML(b,pays,showDate){const c=b.customers||{};const v=b.vehicles||{};const ow=owed(b,pays);
 return`<div class="job c-${b.status.replace(' ','')}" onclick="openBooking('${b.id}')"><div class="t">${b.days>0?'All day':hm(b.start_time)}${showDate?`<small>${fd(b.date)}</small>`:`<small>${b.days>0?b.day_label||b.days+' days':ft(endMin(b))}</small>`}</div><div style="flex:1;min-width:0"><div class="row" style="gap:6px"><b>${c.vip?'♛ ':''}${esc((c.first_name||'')+' '+(c.last_name||''))}</b>${v.reg?`<span class="reg">${esc(v.reg)}</span>`:''}</div><div class="tiny mu" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(b.service_name)} · ${esc(b.postcode||'')}</div><div class="row" style="gap:6px;margin-top:4px"><span class="pill s-${b.status.replace(' ','')}">${b.status}</span><span class="tiny"><b>${gbp(b.total)}</b>${ow&&b.status!=='Cancelled'?` · <span style="color:#fca5a5">owes ${gbp(ow)}</span>`:b.status!=='Cancelled'&&+b.total>0?' · <span style="color:#86efac">paid</span>':''}</span>${b.repeat_group?'<span class="pill p-ac">repeat</span>':''}</div></div></div>`}

/* ================= DIARY ================= */
async function vDiary(){const v=S.dv,dd=S.date;let from,to,title;
 if(v==='day'){from=to=dd;title=fd(dd)+(dd===TODAY()?' · Today':'')}
 else if(v==='week'){from=addD(dd,-((pd(dd).getDay()+6)%7));to=addD(from,6);title=`${fd(from)} – ${fd(to)}`}
 else{const d=pd(dd);from=ymd(new Date(d.getFullYear(),d.getMonth(),1));to=ymd(new Date(d.getFullYear(),d.getMonth()+1,0));title=`${MON[d.getMonth()]} ${d.getFullYear()}`}
 const gFrom=v==='month'?addD(from,-((pd(from).getDay()+6)%7)):from,gTo=v==='month'?addD(gFrom,41):to;
 const[{L,pays},cl]=await Promise.all([fetchBookings(gFrom,gTo),v==='day'?sb.from('slot_closures').select('*').eq('business_id',S.biz.id).eq('date',dd):Promise.resolve({data:[]})]);
 const live=L.filter(b=>b.status!=='Cancelled');let body='';
 if(v==='day'){const jobs=L.filter(b=>covers(b,dd));const lj=jobs.filter(b=>b.status!=='Cancelled');const closed=(cl.data||[]).map(c=>hm(c.start_time));
  body=`<div class="card" style="margin-bottom:12px"><div class="row"><div><div class="tiny mu">Work this day</div><div class="kpi"><div class="v">${gbp(lj.reduce((s,b)=>s+ +b.total,0))}</div></div></div><span class="sp"></span><div class="tiny mu" style="text-align:right">${lj.length} job${lj.length===1?'':'s'}<br>${gbp(lj.reduce((s,b)=>s+owed(b,pays),0))} to collect</div></div>
  ${!isWork(dd)?`<div class="banner off" style="margin-top:10px">${esc(blockedReason(dd)||'Not a working day')} — closed to online bookings.</div>`:''}</div>
  ${jobs.length?jobs.map(b=>jobHTML(b,pays)).join(''):'<div class="card empty">Nothing booked.</div>'}
  ${S.biz.settings.slotMode!=='auto'&&isWork(dd)?`<div class="card" style="margin-top:12px"><div class="row" style="margin-bottom:8px"><b>Start times</b><span class="tiny mu">tap to close/open for this day</span></div><div class="chips">${S.slots.filter(s=>s.enabled).map(s=>{const t=hm(s.start_time),m=tm(t);const busy=lj.some(b=>b.days>0||(m>=tm(b.start_time)-(S.biz.settings.buffer??30)&&m<endMin(b)+(S.biz.settings.buffer??30)));const off=closed.includes(t);const c=off?'off':busy?'busy':'free';
   return`<button class="chip ${c}" onclick="${busy&&!off?`addBooking({date:'${dd}',time:'${t}'})`:`toggleClosure('${dd}','${t}',${off})`}"><b>${t}</b>${off?'Closed':busy?'Booked':'Free'}</button>`}).join('')}</div>
  <div class="row" style="margin-top:10px"><button class="btn sm" onclick="addBooking({date:'${dd}'})">+ Add booking this day</button><button class="btn sm" onclick="blockSheet('${dd}')">Block day / time off</button></div></div>`:`<div class="row" style="margin-top:12px"><button class="btn sm" onclick="addBooking({date:'${dd}'})">+ Add booking this day</button><button class="btn sm" onclick="blockSheet('${dd}')">Block day / time off</button></div>`}`}
 else if(v==='week'){body=[...Array(7)].map((_,i)=>{const d=addD(from,i);const js=L.filter(b=>covers(b,d));const lj=js.filter(b=>b.status!=='Cancelled');return`<div class="row" style="margin:14px 0 6px;cursor:pointer" onclick="S.date='${d}';S.dv='day';go('diary')"><b style="${d===TODAY()?'color:var(--ac)':''}">${fd(d)}</b>${!isWork(d)?`<span class="pill p-bd">${esc(blockedReason(d)||'Closed')}</span>`:''}<span class="sp"></span><span class="tiny mu">${lj.length} · ${gbp(lj.reduce((s,b)=>s+ +b.total,0))}</span></div>${js.map(b=>jobHTML(b,pays)).join('')||'<div class="tiny mu" style="padding:4px 2px">—</div>'}`}).join('')}
 else{let cells='';for(let i=0;i<42;i++){const d=addD(gFrom,i);const js=live.filter(b=>covers(b,d));const inM=d>=from&&d<=to;cells+=`<div class="mcell ${inM?'':'dim'} ${d===TODAY()?'td':''} ${isWork(d)?'':'off'}" onclick="S.date='${d}';S.dv='day';go('diary')"><b>${pd(d).getDate()}</b>${js.length?`<span class="n">${js.length} job${js.length>1?'s':''}</span><span class="tiny mu">${gbp(js.reduce((s,b)=>s+ +b.total,0))}</span>`:''}</div>`}
  body=`<div class="mgrid" style="margin-bottom:4px">${['M','T','W','T','F','S','S'].map(x=>`<div class="tiny mu" style="text-align:center">${x}</div>`).join('')}</div><div class="mgrid">${cells}</div><p class="tiny mu" style="margin-top:8px">Month total: <b>${gbp(live.filter(b=>b.date>=from&&b.date<=to).reduce((s,b)=>s+ +b.total,0))}</b> · ${live.filter(b=>b.date>=from&&b.date<=to).length} bookings</p>`}
 $('main').innerHTML=`<div class="row" style="margin-bottom:10px"><div class="tabs">${['day','week','month'].map(x=>`<button class="tab ${v===x?'on':''}" onclick="S.dv='${x}';go('diary')">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div><span class="sp"></span><input type="date" value="${dd}" onchange="S.date=this.value;go('diary')" style="width:auto;padding:7px 10px;font-size:14px"></div>
 <div class="row" style="margin-bottom:12px"><button class="btn sm" onclick="dNav(-1)">‹</button><button class="btn sm" onclick="S.date=TODAY();go('diary')">Today</button><button class="btn sm" onclick="dNav(1)">›</button><b style="margin-left:4px">${title}</b></div>${body}`}
function dNav(n){S.date=S.dv==='month'?addM(S.date,n):addD(S.date,n*(S.dv==='week'?7:1));go('diary')}
async function toggleClosure(d,t,isOff){const q=isOff?sb.from('slot_closures').delete().eq('business_id',S.biz.id).eq('date',d).eq('start_time',t):sb.from('slot_closures').insert({business_id:S.biz.id,date:d,start_time:t});const{error}=await q;if(error)return toast(errMsg(error),1);toast(`${t} ${isOff?'reopened':'closed'} for ${fd(d)}`);go('diary')}
function blockSheet(d){sheet(`<h3>Block time off</h3><p class="tiny mu">Holidays, days off, van service… Blocked days can't be booked online.</p><div class="grid g2"><div><label class="f">From</label><input type="date" id="bf" value="${d}"></div><div><label class="f">To</label><input type="date" id="bt" value="${d}"></div></div><label class="f">Reason</label><input id="br" value="Holiday"><button class="btn pri block" style="margin-top:12px" onclick="saveBlock()">Block dates</button>
 <h4>Blocked</h4>${S.blocked.filter(b=>b.to_date>=TODAY()).map(b=>`<div class="row" style="padding:6px 0"><span class="tiny"><b>${fdy(b.from_date)}${b.to_date!==b.from_date?' – '+fdy(b.to_date):''}</b> · ${esc(b.reason)}</span><span class="sp"></span><button class="btn xs bad" onclick="delBlock('${b.id}')">Remove</button></div>`).join('')||'<p class="tiny mu">Nothing blocked.</p>'}`)}
async function saveBlock(){let f=val('bf'),t=val('bt');if(!f||!t)return;if(t<f)[f,t]=[t,f];const{error}=await sb.from('blocked_dates').insert({business_id:S.biz.id,from_date:f,to_date:t,reason:val('br')||'Unavailable'});if(error)return toast(errMsg(error),1);await loadCatalogue();closeSheet();toast('Dates blocked');go(S.view)}
async function delBlock(id){const{error}=await sb.from('blocked_dates').delete().eq('id',id);if(error)return toast(errMsg(error),1);await loadCatalogue();closeSheet();toast('Removed');go(S.view)}

/* ================= BOOKING DETAIL ================= */
async function openBooking(id){sheet('<div class="spin"></div>');
 const[{data:b,error},{data:pays}]=await Promise.all([sb.from('bookings').select('*, customers(*), vehicles(*)').eq('id',id).single(),sb.from('payments').select('*').eq('booking_id',id).order('created_at')]);
 if(error)return sheet(`<p>${esc(errMsg(error))}</p>`);const c=b.customers||{},v=b.vehicles||{};const ow=owed(b,pays||[]);const pd_=paid(b,pays||[]);
 const msg=`Hi ${c.first_name}, your ${b.service_name} with ${S.biz.name} is booked for ${fd(b.date)}${b.days>0?'':' at '+hm(b.start_time)} (ref ${b.ref}).${ow?` Balance: ${gbp(ow)}.`:''}`;
 sheet(`<div class="tiny mu">${esc(b.ref)} · ${b.source==='manual'?'Added by you':'Online booking'}</div><h2 style="margin:2px 0 6px">${c.vip?'♛ ':''}${esc(c.first_name+' '+(c.last_name||''))}</h2>
 <div class="tabs" style="margin:10px 0">${STATUSES.map(s=>`<button class="tab ${b.status===s?'on':''}" onclick="setStatus('${b.id}','${s}')">${s}</button>`).join('')}</div>
 <div class="grid g2"><div class="card" style="padding:10px"><div class="tiny mu">When</div><b>${fd(b.date)}</b><div class="tiny">${b.days>0?(b.day_label||b.days+' day(s)'):hm(b.start_time)+' – '+ft(endMin(b))}</div></div><div class="card" style="padding:10px"><div class="tiny mu">Service</div><b class="tiny">${esc(b.service_name)}</b><div class="tiny mu">${SIZES[b.size]||''}</div></div>
 <div class="card" style="padding:10px"><div class="tiny mu">Vehicle</div>${v.reg?`<span class="reg">${esc(v.reg)}</span>`:'—'}<div class="tiny">${esc([v.make,v.model,v.colour].filter(Boolean).join(' · '))}</div></div><div class="card" style="padding:10px"><div class="tiny mu">Address</div><div class="tiny"><b>${esc(b.address||'—')}</b><br>${esc(b.postcode||'')}</div></div></div>
 <div class="row" style="margin-top:10px">${c.mobile?`<a class="btn sm" href="tel:${esc(c.mobile.replace(/\s/g,''))}">Call</a><a class="btn sm wa" href="https://wa.me/${intl(c.mobile)}?text=${encodeURIComponent(msg)}">WhatsApp</a>`:''}${showEmail(c.email)?`<a class="btn sm" href="mailto:${esc(c.email)}">Email</a>`:''}${b.postcode?`<a class="btn sm" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((b.address||'')+' '+b.postcode)}">Map</a>`:''}<button class="btn sm" onclick="closeSheet();openCustomer('${c.id}')">Customer</button></div>
 <h4>Money</h4><div class="sum"><div class="l"><span>Price</span><span>${gbp(b.price)}</span></div>${+b.callout?`<div class="l"><span>Call-out</span><span>${gbp(b.callout)}</span></div>`:''}${+b.discount?`<div class="l"><span>Discount</span><span>-${gbp(b.discount)}</span></div>`:''}<div class="l"><b>Total</b><b>${gbp(b.total)}</b></div>${(pays||[]).map(p=>`<div class="l tiny"><span>${new Date(p.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short'})} · ${p.type} · ${esc(p.method)}</span><span style="color:${+p.amount<0?'#fca5a5':'#86efac'}">${gbp(p.amount)}</span></div>`).join('')}<div class="l t"><span>${b.status==='Cancelled'?'Cancelled':'Outstanding'}</span><span style="color:${ow?'#fca5a5':'#86efac'}">${b.status==='Cancelled'?'—':gbp(ow)}</span></div></div>
 <div class="row" style="margin-top:8px">${ow?`<button class="btn sm pri" onclick="payBox('${b.id}',${ow})">Take payment</button>`:''}${pd_>0?`<button class="btn sm" onclick="refundBox('${b.id}',${pd_})">Refund</button>`:''}<button class="btn sm" onclick="editPrice('${b.id}',${+b.price})">Change price</button></div>
 <h4>Manage</h4><div class="row"><button class="btn sm" onclick="reschedule('${b.id}')">Reschedule</button>${b.status!=='Cancelled'?`<button class="btn sm bad" onclick="confirmBox('Cancel ${esc(b.ref)}? It frees up the slot.',()=>setStatus('${b.id}','Cancelled'),'Cancel booking')">Cancel</button>`:''}<button class="btn sm bad" onclick="confirmBox('Delete ${esc(b.ref)} permanently, including its payments?',()=>delBooking('${b.id}'),'Delete')">Delete</button></div>
 <label class="f">Notes</label><textarea id="bn">${esc(b.notes)}</textarea><button class="btn sm" style="margin-top:6px" onclick="saveNotes('${b.id}')">Save notes</button>`)}
async function setStatus(id,s){const{error}=await sb.from('bookings').update({status:s}).eq('id',id);if(error)return toast(errMsg(error),1);toast('Marked '+s);closeSheet();go(S.view);if(s!=='Cancelled')openBooking(id)}
async function saveNotes(id){const{error}=await sb.from('bookings').update({notes:val('bn')}).eq('id',id);if(error)return toast(errMsg(error),1);toast('Notes saved')}
async function delBooking(id){await sb.from('payments').delete().eq('booking_id',id);const{error}=await sb.from('bookings').delete().eq('id',id);if(error)return toast(errMsg(error),1);toast('Booking deleted');go(S.view)}
function payBox(id,amt){sheet(`<h3>Take payment</h3><label class="f">Amount (£)</label><input id="pa" type="number" step="0.01" inputmode="decimal" value="${amt}"><label class="f">Type</label><select id="pt"><option value="balance">Balance</option><option value="deposit">Deposit</option><option value="full">Paid in full</option></select><label class="f">Method</label><select id="pm"><option>Cash</option><option>Card</option><option>Bank transfer</option></select><button class="btn pri block" style="margin-top:12px" onclick="savePay('${id}')">Record payment</button>`)}
async function savePay(id,amtOverride,typeOverride,methodOverride){const{data:b}=await sb.from('bookings').select('customer_id').eq('id',id).single();const amount=amtOverride??+val('pa');if(!amount)return toast('Enter an amount',1);
 const{error}=await sb.from('payments').insert({business_id:S.biz.id,booking_id:id,customer_id:b.customer_id,type:typeOverride||val('pt'),amount,method:methodOverride||val('pm')});if(error)return toast(errMsg(error),1);if(amtOverride==null){toast('Payment recorded');closeSheet();go(S.view);openBooking(id)}}
function refundBox(id,max){sheet(`<h3>Refund</h3><label class="f">Amount (max ${gbp(max)})</label><input id="ra" type="number" step="0.01" value="${max}"><label class="f">Method</label><select id="rm"><option>Cash</option><option>Card</option><option>Bank transfer</option></select><button class="btn bad block" style="margin-top:12px" onclick="doRefund('${id}',${max})">Record refund</button>`)}
async function doRefund(id,max){const a=Math.min(+val('ra'),max);if(!a)return;const{data:b}=await sb.from('bookings').select('customer_id').eq('id',id).single();const{error}=await sb.from('payments').insert({business_id:S.biz.id,booking_id:id,customer_id:b.customer_id,type:'refund',amount:-a,method:val('rm')});if(error)return toast(errMsg(error),1);toast('Refund recorded');closeSheet();go(S.view);openBooking(id)}
function editPrice(id,p){sheet(`<h3>Change price</h3><label class="f">Price (£)</label><input id="ep" type="number" step="0.01" value="${p}"><button class="btn pri block" style="margin-top:12px" onclick="savePrice('${id}')">Save</button>`)}
async function savePrice(id){const p=+val('ep');const{data:b}=await sb.from('bookings').select('callout,discount').eq('id',id).single();const total=r2(p+ +b.callout- +b.discount);const{error}=await sb.from('bookings').update({price:p,total}).eq('id',id);if(error)return toast(errMsg(error),1);toast('Price updated');closeSheet();go(S.view);openBooking(id)}
async function reschedule(id){const{data:b}=await sb.from('bookings').select('*').eq('id',id).single();sheet(`<h3>Reschedule ${esc(b.ref)}</h3><div class="grid g2"><div><label class="f">Date</label><input type="date" id="rd" value="${b.date}"></div><div><label class="f">Start time</label><input type="time" id="rt" value="${hm(b.start_time)}" step="900"></div></div><div class="chips" style="margin-top:8px">${S.slots.filter(s=>s.enabled).map(s=>`<button class="chip" onclick="$('rt').value='${hm(s.start_time)}'"><b>${hm(s.start_time)}</b></button>`).join('')}</div><button class="btn pri block" style="margin-top:12px" onclick="saveResched('${id}',${b.days},${b.duration_mins})">Move booking</button>`)}
async function saveResched(id,days,mins){const d=val('rd'),t=val('rt');if(!d||!t)return;
 const{data:others}=await sb.from('bookings').select('id,date,start_time,duration_mins,days').eq('business_id',S.biz.id).neq('id',id).neq('status','Cancelled').gte('date',addD(d,-3)).lte('date',addD(d,Math.max(days,1)));
 const buf=S.biz.settings.buffer??30;const s=tm(t),e=s+mins;
 const clash=(others||[]).some(o=>{if(days>0)return [...Array(days)].some((_,i)=>covers(o,addD(d,i)));if(o.days>0)return covers(o,d);return o.date===d&&s<tm(o.start_time)+o.duration_mins+buf&&e+buf>tm(o.start_time)});
 const doIt=async()=>{const{error}=await sb.from('bookings').update({date:d,start_time:t}).eq('id',id);if(error)return toast(errMsg(error),1);toast('Moved to '+fd(d)+' '+t);S.date=d;closeSheet();go(S.view)};
 if(clash)return confirmBox('That overlaps another booking (including your '+buf+'-minute buffer). Move it anyway?',doIt,'Move anyway');doIt()}

 sheet(`<h2>Add booking</h2>

function abPrice(){const s=svcById(val('as'));if(!s)return;const p=priceFor(s,+val('az'));$('ap2').value=p??'';$('ap2').placeholder=s.price_on_request?'Price on request — enter price':''}
let _cst;function custSuggest(){clearTimeout(_cst);_cst=setTimeout(async()=>{const q=val('cq').replace(/[,()%]/g,' ').trim();const box=$('csug');if(q.length<2){box.innerHTML='';return}
 const{data}=await sb.from('customers').select('id,first_name,last_name,mobile,email,postcode').eq('business_id',S.biz.id).or(`first_name.ilike.%${q}%,last_name.ilike.%${q}%,mobile.ilike.%${q}%,email.ilike.%${q}%`).limit(8);
 box.innerHTML=(data||[]).length?`<div class="sug">${data.map(c=>`<div onclick="pickCust('${c.id}')"><b>${esc(c.first_name+' '+c.last_name)}</b> <span class="tiny mu">${esc(c.mobile)} · ${esc(c.postcode)}</span></div>`).join('')}</div>`:`<div class="tiny mu" style="margin-top:4px">No match — fill in the new customer below.</div>`;
 if(!AB.cust){const parts=val('cq').split(' ');if(!/\d|@/.test(val('cq'))){$('nf').value=parts[0]||'';$('nl').value=parts.slice(1).join(' ')}else if(/@/.test(val('cq')))$('ne').value=val('cq');else $('nm').value=val('cq')}},250)}
async function pickCust(id){const[{data:c},{data:vs}]=await Promise.all([sb.from('customers').select('*').eq('id',id).single(),sb.from('vehicles').select('*').eq('customer_id',id).order('created_at',{ascending:false})]);AB.cust=c;AB.vehicles=vs||[];
 $('abc').innerHTML=`<div class="card" style="padding:10px"><div class="row"><b>${esc(c.first_name+' '+c.last_name)}</b><span class="sp"></span><button class="btn xs" onclick="addBooking({date:val('ad'),time:val('at')})">Change</button></div><div class="tiny mu">${esc(c.mobile)}${showEmail(c.email)?' · '+esc(c.email):''} · ${esc(c.postcode)}</div></div>`;$('abnew').style.display='none';
 $('abveh').innerHTML=`<label class="f">Vehicle</label><select id="avs" onchange="$('abvn').style.display=this.value?'none':'grid';const v=AB.vehicles.find(x=>x.id===this.value);if(v){$('az').value=v.size;abPrice()}">${AB.vehicles.map(v=>`<option value="${v.id}">${esc(v.reg)} · ${esc(v.make+' '+v.model)}</option>`).join('')}<option value="">+ New vehicle</option></select><div class="grid g2" id="abvn" style="display:${AB.vehicles.length?'none':'grid'};margin-top:6px"><input id="vr" placeholder="Reg" style="text-transform:uppercase"><input id="vm" placeholder="Make & model"></div>`;
 if(AB.vehicles[0]){$('az').value=AB.vehicles[0].size;abPrice()}}
async function saveBooking(){const s=svcById(val('as'));let c=AB.cust;const price=val('ap2');if(price===''||isNaN(+price))return toast('Enter a price',1);if(!val('ad')||!val('at'))return toast('Choose a date and time',1);
 let cust;if(c)cust={first_name:c.first_name,last_name:c.last_name,email:c.email,mobile:c.mobile||'—',postcode:c.postcode,house:c.house,address:c.address};
 else{if(!val('nf')||!val('nm'))return toast('Add the customer\'s first name and mobile',1);const em=val('ne')||(val('nm').replace(/\D/g,'')+NOEMAIL);if(val('ne')&&!/^\S+@\S+\.\S+$/.test(val('ne')))return toast('That email doesn\'t look right',1);cust={first_name:val('nf'),last_name:val('nl'),email:em,mobile:val('nm'),postcode:val('np2').toUpperCase(),house:'',address:val('na')}}
 let veh={};const vsel=$('avs');if(vsel&&vsel.value){const v=AB.vehicles.find(x=>x.id===vsel.value);veh={reg:v.reg,make:v.make,model:v.model}}else{const mm=val('vm').split(' ');veh={reg:val('vr').toUpperCase(),make:mm[0]||'',model:mm.slice(1).join(' ')}}
 const rep=+val('ar');const n=rep?Math.max(2,Math.min(52,+val('arn')||2)):1;const grp=rep?((crypto.randomUUID&&crypto.randomUUID())||'10000000-1000-4000-8000-100000000000'.replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16))):null;
 const btn=document.querySelector('#sheet .btn.pri.block:last-of-type');if(btn){btn.disabled=true;btn.textContent='Saving…'}
 const made=[],failed=[];
 for(let i=0;i<n;i++){const date=addD(val('ad'),i*rep*7);
  const{data,error}=await sb.rpc('create_booking',{p_business:S.biz.id,p:{...cust,...veh,service_id:s.id,size:+val('az'),date,start_time:val('at'),price:+price,notes:val('ano')}});
  if(error){failed.push(`${fd(date)}: ${errMsg(error).replace(/^.*?:\s*/,'')}`);continue}made.push(data)}
 for(const b of made){const upd={};if(val('ast')!=='Booked')upd.status=val('ast');if(grp)upd.repeat_group=grp;if(Object.keys(upd).length)await sb.from('bookings').update(upd).eq('id',b.id)}
 if(made[0]&&val('apy')!=='none'){const tot=+made[0].total;const amt=val('apy')==='deposit'?r2(tot*(S.biz.settings.depositPct??20)/100):tot;if(amt>0)await savePay(made[0].id,amt,val('apy'),val('apm'))}
 if(!made.length){if(btn){btn.disabled=false;btn.textContent='Save booking'}return toast('Not saved — '+failed[0],1)}
 closeSheet();S.date=val('ad')||S.date;toast(`${made.length} booking${made.length>1?'s':''} added${failed.length?` · ${failed.length} skipped`:''}`);
 if(failed.length)sheet(`<h3>Some dates were skipped</h3><p class="mu tiny">These clash with existing bookings (or your buffer). Add them at a different time if needed.</p>${failed.map(f=>`<div class="tiny" style="padding:4px 0">• ${esc(f)}</div>`).join('')}<button class="btn block" style="margin-top:10px" onclick="closeSheet()">OK</button>`);
 go(S.view==='home'?'home':'diary')}

 <div class="card" style="margin-bottom:12px"><h3>Start times</h3><p class="tiny mu">Times customers can book online. Switch any off; you can still add bookings at any time yourself.</p><div class="col">${S.slots.map(s=>`<div class="row"><b style="font-family:Sora;min-width:60px">${hm(s.start_time)}</b><span class="sp"></span><label class="sw"><input type="checkbox" ${s.enabled?'checked':''} onchange="toggleSlot('${hm(s.start_time)}',this.checked)"><span></span></label><button class="btn xs" onclick="delSlot('${hm(s.start_time)}')">✕</button></div>`).join('')}</div><div class="row" style="margin-top:10px"><input type="time" id="ns" step="900" style="width:auto"><button class="btn sm" onclick="addSlot()">+ Add time</button></div></div>
 <div class="card" style="margin-bottom:12px"><div class="row"><h3 style="margin:0">Blocked dates</h3><span class="sp"></span><button class="btn sm" onclick="blockSheet(TODAY())">Manage</button></div>${S.blocked.filter(b=>b.to_date>=TODAY()).map(b=>`<div class="tiny" style="margin-top:6px">${fdy(b.from_date)}${b.to_date!==b.from_date?' – '+fdy(b.to_date):''} · ${esc(b.reason)}</div>`).join('')||'<p class="tiny mu" style="margin:6px 0 0">Nothing blocked.</p>'}</div>
 <div class="card" style="margin-bottom:12px"><h3>Services & prices</h3><p class="tiny mu">Medium and large left blank use the small price.</p>${S.services.map(s=>`<div style="padding:10px 0;border-bottom:1px solid var(--ln)"><div class="row"><b style="flex:1">${esc(s.name)}</b><label class="sw" title="Active"><input type="checkbox" ${s.active?'checked':''} onchange="svcField('${s.id}','active',this.checked)"><span></span></label></div><div class="grid g4" style="margin-top:6px">${['price_small','price_medium','price_large'].map((k,i)=>`<div><label class="f" style="margin-top:0">${SIZES[i]}</label><input type="number" step="0.01" inputmode="decimal" value="${s[k]??''}" placeholder="${s.price_on_request?'POA':i?'same':''}" onchange="svcField('${s.id}','${k}',this.value===''?null:+this.value)"></div>`).join('')}<div><label class="f" style="margin-top:0">${s.days>0?'Days':'Mins'}</label><input type="number" value="${s.days>0?s.days:s.duration_mins}" onchange="svcField('${s.id}','${s.days>0?'days':'duration_mins'}',+this.value)"></div></div></div>`).join('')}</div>
 <div class="card" style="margin-bottom:12px"><h3>Booking rules</h3><div class="grid g3"><div><label class="f">Deposit %</label><input id="sd" type="number" value="${st.depositPct??20}"></div><div><label class="f">Buffer (mins)</label><input id="sbf" type="number" value="${st.buffer??30}"></div><div><label class="f">Min notice (hrs)</label><input id="smn" type="number" value="${st.minNoticeHours??24}"></div></div><label class="f">Working days</label><div class="row">${[1,2,3,4,5,6,0].map(d=>`<label class="row tiny" style="gap:4px"><input type="checkbox" class="wd" value="${d}" ${(st.workDays||[]).includes(d)?'checked':''}> ${DOW[d]}</label>`).join('')}</div><button class="btn sm pri" style="margin-top:10px" onclick="saveRules()">Save</button></div>
 <div class="card" style="margin-bottom:12px"><h3>Business details</h3><div class="grid g2"><div><label class="f">Phone</label><input id="bp" value="${esc(st.phone||'')}"></div><div><label class="f">WhatsApp</label><input id="bw" value="${esc(st.whatsapp||'')}"></div></div><label class="f">Email</label><input id="be" value="${esc(st.email||'')}"><button class="btn sm pri" style="margin-top:10px" onclick="saveDetails()">Save</button></div>
 <div class="card"><h3>Your login</h3><p class="tiny mu">${esc(S.user.email)}</p><div class="row"><button class="btn sm" onclick="installHelp()">Install on home screen</button><button class="btn sm bad" onclick="signOut()">Sign out</button></div></div>`}
async function toggleOnline(on){go('settings');if(on)return confirmBox('Switch online booking ON? Customers will be able to book straight into your diary from the website.',async()=>{if(await saveSettings({onlineBooking:true})){toast('Online booking is ON');renderShell()}},'Switch on');if(await saveSettings({onlineBooking:false})){toast('Online booking is OFF');renderShell()}}
async function toggleSlot(t,on){const{error}=await sb.from('time_slots').update({enabled:on}).eq('business_id',S.biz.id).eq('start_time',t);if(error)return toast(errMsg(error),1);await loadCatalogue();toast(`${t} ${on?'on':'off'}`)}
async function addSlot(){const t=val('ns');if(!t)return toast('Pick a time',1);const{error}=await sb.from('time_slots').insert({business_id:S.biz.id,start_time:t});if(error)return toast(/duplicate/i.test(errMsg(error))?'Already added':errMsg(error),1);await loadCatalogue();go('settings')}
async function delSlot(t){const{error}=await sb.from('time_slots').delete().eq('business_id',S.biz.id).eq('start_time',t);if(error)return toast(errMsg(error),1);await loadCatalogue();go('settings')}
async function svcField(id,k,v){const{error}=await sb.from('services').update({[k]:v}).eq('id',id);if(error)return toast(errMsg(error),1);const s=svcById(id);if(s)s[k]=v;toast('Saved')}
async function saveRules(){if(await saveSettings({depositPct:+val('sd'),buffer:+val('sbf'),minNoticeHours:+val('smn'),workDays:[...document.querySelectorAll('.wd:checked')].map(x=>+x.value)}))toast('Saved')}
async function saveDetails(){if(await saveSettings({phone:val('bp'),whatsapp:val('bw'),email:val('be')}))toast('Saved')}
function installHelp(){sheet(`<h3>Install B Clean Admin</h3><p><b>iPhone (Safari):</b> tap the Share button <span class="mu">(square with arrow)</span> → <b>Add to Home Screen</b> → Add.</p><p><b>Android (Chrome):</b> tap ⋮ → <b>Install app</b>.</p><p class="tiny mu">It opens full-screen like a normal app and stays signed in.</p>`)}

/* ================= WEBSITE ================= */
function resizeImg(file,max){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(new Error('Could not read that file'));fr.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error('Could not process image')),'image/jpeg',.84)};im.onerror=()=>rej(new Error('Could not read image — try a JPG or PNG'));im.src=fr.result};fr.readAsDataURL(file)})}
async function uploadImg(file,folder,max){const blob=await resizeImg(file,max);const path=`${S.biz.id}/${folder}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
 const{error}=await sb.storage.from('media').upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000'});if(error)throw error;return sb.storage.from('media').getPublicUrl(path).data.publicUrl}
function busy(msg){const e=document.createElement('div');e.id='busy';e.className='sheet';e.innerHTML=`<div class="in" style="text-align:center"><div class="spin" style="margin:10px auto"></div><b>${esc(msg)}</b></div>`;document.body.appendChild(e);return()=>e.remove()}
async function vWebsite(){const st=S.biz.settings;const tab=S.wt||'home';let body='';
 if(tab==='home'){const slides=st.heroSlides||[];const stats=[0,1,2,3].map(i=>(st.stats||[])[i]||{v:'',l:''});
  body=`<div class="card" style="margin-bottom:12px"><h3>Slideshow photos</h3><p class="tiny mu">The big photos at the top of your homepage. Landscape photos work best — keep the car in the centre or right. They change every few seconds.</p>
  <div class="col">${slides.map((h,i)=>`<div class="row" style="background:var(--p2);border-radius:12px;padding:8px;flex-wrap:nowrap"><div class="thumb" style="background-image:url('${esc(h.url)}')"></div><div style="flex:1;min-width:0" class="tiny mu">Photo ${i+1}</div><button class="btn xs" ${i?'':'disabled'} onclick="moveSlide(${i},-1)">↑</button><button class="btn xs" ${i<slides.length-1?'':'disabled'} onclick="moveSlide(${i},1)">↓</button><button class="btn xs bad" onclick="delSlide(${i})">✕</button></div>`).join('')||'<p class="tiny mu">No photos yet — the website shows a placeholder until you add some.</p>'}</div>
  <label class="up" style="margin-top:10px">📷 Add photos (you can pick several)<input type="file" accept="image/*" multiple onchange="addSlides(this.files)"></label></div>
  <div class="card" style="margin-bottom:12px"><h3>Business name & description</h3><div class="grid g2"><div><label class="f">Name — white</label><input id="hw" value="${esc(st.heroWhite||'')}" placeholder="B Clean"></div><div><label class="f">Name — blue</label><input id="hb" value="${esc(st.heroBlue||'')}" placeholder="Valeting"></div></div><label class="f">Description</label><textarea id="hd">${esc(st.heroDesc||'')}</textarea>
  <label class="f">Highlights (up to 4, e.g. "5+" / "years in business")</label>${stats.map((x,i)=>`<div class="grid g2" style="margin-bottom:6px"><input id="sv${i}" value="${esc(x.v)}" placeholder="Value"><input id="sl${i}" value="${esc(x.l)}" placeholder="Label"></div>`).join('')}
  <button class="btn pri" style="margin-top:8px" onclick="saveHomeText()">Save</button></div>`}
 if(tab==='services')body=`<p class="tiny mu">Each service card on the homepage has its own photo and description. Prices and durations are in Settings.</p>${S.services.map(s=>`<div class="card" style="margin-bottom:10px"><div class="row" style="flex-wrap:nowrap"><div class="thumb sq" style="background-image:${s.image_url?`url('${esc(s.image_url)}')`:'none'}">${s.image_url?'':'<div class="tiny mu" style="text-align:center;padding-top:20px">No photo</div>'}</div><div style="flex:1;min-width:0"><b>${esc(s.name)}</b><div class="tiny mu">${esc(s.category)}${s.active?'':' · hidden'}</div><div class="row" style="margin-top:6px"><label class="btn xs">${s.image_url?'Change photo':'Add photo'}<input type="file" accept="image/*" style="display:none" onchange="svcPhoto('${s.id}',this.files[0])"></label>${s.image_url?`<button class="btn xs" onclick="svcField('${s.id}','image_url',null).then(()=>go('website'))">Remove</button>`:''}</div></div></div>
  <label class="f">Description</label><textarea id="sd_${s.id}" style="min-height:56px">${esc(s.description)}</textarea><label class="f">What's included (one per line)</label><textarea id="si_${s.id}" style="min-height:90px">${esc((s.includes||[]).join('\n'))}</textarea><button class="btn sm" style="margin-top:6px" onclick="saveSvcText('${s.id}')">Save</button></div>`).join('')}`;
 if(tab==='offers'){const O=st.offers||[];body=`<p class="tiny mu">The first offer that's switched on shows in the bar under your menu, with a Book now button. When none are on, the bar just says "Book now".</p>${O.map((o,i)=>`<div class="card" style="margin-bottom:10px"><div class="row"><b style="flex:1">${esc(o.title||'Offer')}</b><label class="sw"><input type="checkbox" ${o.active?'checked':''} onchange="offerSet(${i},'active',this.checked)"><span></span></label></div>
  <div class="grid g2"><div><label class="f">Label (e.g. Winter Special)</label><input value="${esc(o.title||'')}" onchange="offerSet(${i},'title',this.value)"></div><div><label class="f">Offer text</label><input value="${esc(o.text||'')}" onchange="offerSet(${i},'text',this.value)" placeholder="15% off a Full Valet"></div><div><label class="f">Service it's for</label><select onchange="offerSet(${i},'serviceId',this.value)">${S.services.filter(s=>s.active).map(s=>`<option value="${s.id}" ${o.serviceId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div><label class="f">Ends</label><input type="date" value="${o.expires||''}" onchange="offerSet(${i},'expires',this.value)"></div></div>
  <button class="btn xs bad" style="margin-top:8px" onclick="offerDel(${i})">Delete offer</button></div>`).join('')}<button class="btn pri" onclick="offerAdd()">+ New offer</button>`}
 if(tab==='info')body=`<div class="card" style="margin-bottom:12px"><h3>FAQs</h3><p class="tiny mu">One per line: <b>Question | Answer</b></p><textarea id="fq" style="min-height:220px">${esc((st.faq||[]).map(f=>f.join(' | ')).join('\n'))}</textarea></div>
  <div class="card" style="margin-bottom:12px"><h3>Policies</h3><label class="f">Terms of service</label><textarea id="pt2">${esc(st.terms||'')}</textarea><label class="f">Cancellation policy</label><textarea id="pc2">${esc(st.cancel||'')}</textarea><label class="f">Refund policy</label><textarea id="pr2">${esc(st.refund||'')}</textarea></div><button class="btn pri block" onclick="saveInfo()">Save FAQs & policies</button>`;
 if(tab==='social'){const so=st.social||{};body=`<div class="card"><p class="tiny mu">Icons appear at the top of your website. Leave blank to hide.</p>${[['facebook','Facebook page link'],['instagram','Instagram link'],['tiktok','TikTok link'],['google','Google reviews link']].map(([k,l])=>`<label class="f">${l}</label><input id="so_${k}" value="${esc(so[k]||'')}" placeholder="https://…">`).join('')}<button class="btn pri" style="margin-top:12px" onclick="saveSocial()">Save</button></div>`}
 $('main').innerHTML=`<div class="row"><h2 style="margin:0">Website</h2><span class="sp"></span><a class="btn sm" href="/" target="_blank" rel="noopener">View site ↗</a></div><p class="tiny mu" style="margin:4px 0 10px">Changes show on bcleanvaleting.co.uk straight away.</p>
 <div class="tabs" style="margin-bottom:12px">${[['home','Homepage'],['services','Service cards'],['offers','Offers'],['info','FAQs & policies'],['social','Social links']].map(t=>`<button class="tab ${tab===t[0]?'on':''}" onclick="S.wt='${t[0]}';go('website')">${t[1]}</button>`).join('')}</div>${body}`}
async function addSlides(files){files=[...files];if(!files.length)return;const done=busy(`Uploading ${files.length} photo${files.length>1?'s':''}…`);const urls=[];
 try{for(const f of files)urls.push({url:await uploadImg(f,'hero',1920),caption:''})}catch(e){done();return toast(errMsg(e),1)}
 const ok=await saveSettings({heroSlides:[...(S.biz.settings.heroSlides||[]),...urls]});done();if(ok){toast(`${urls.length} photo${urls.length>1?'s':''} added`);go('website')}}
async function moveSlide(i,d){const L=[...(S.biz.settings.heroSlides||[])];[L[i],L[i+d]]=[L[i+d],L[i]];if(await saveSettings({heroSlides:L}))go('website')}
function delSlide(i){confirmBox('Remove this photo from the slideshow?',async()=>{const L=[...(S.biz.settings.heroSlides||[])];L.splice(i,1);if(await saveSettings({heroSlides:L})){toast('Removed');go('website')}},'Remove')}
async function saveHomeText(){const stats=[0,1,2,3].map(i=>({v:val('sv'+i),l:val('sl'+i)})).filter(x=>x.v||x.l);if(await saveSettings({heroWhite:val('hw'),heroBlue:val('hb'),heroDesc:val('hd'),stats}))toast('Saved — live on your website')}
async function svcPhoto(id,f){if(!f)return;const done=busy('Uploading photo…');try{const url=await uploadImg(f,'services',1400);await svcField(id,'image_url',url);done();toast('Photo updated');go('website')}catch(e){done();toast(errMsg(e),1)}}
async function saveSvcText(id){const d=val('sd_'+id),inc=val('si_'+id).split('\n').map(x=>x.trim()).filter(Boolean);const{error}=await sb.from('services').update({description:d,includes:inc}).eq('id',id);if(error)return toast(errMsg(error),1);const s=svcById(id);s.description=d;s.includes=inc;toast('Saved')}
async function offerSet(i,k,v){const O=[...(S.biz.settings.offers||[])];O[i]={...O[i],[k]:v};if(k==='active'&&v)O.forEach((o,j)=>{if(j!==i)o.active=false});if(await saveSettings({offers:O})){toast(k==='active'?(v?'Offer is live':'Offer hidden'):'Saved');if(k==='active')go('website')}}
async function offerAdd(){const O=[...(S.biz.settings.offers||[])];O.push({id:Date.now().toString(36),title:'Winter Special',text:'15% off a Full Valet',serviceId:(S.services.find(s=>s.active)||{}).id,expires:addD(TODAY(),30),active:false});if(await saveSettings({offers:O}))go('website')}
function offerDel(i){confirmBox('Delete this offer?',async()=>{const O=[...(S.biz.settings.offers||[])];O.splice(i,1);if(await saveSettings({offers:O}))go('website')},'Delete')}
async function saveInfo(){const faq=val('fq').split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(x=>x[0]&&x[1]).map(x=>[x[0],x.slice(1).join(' | ')]);if(await saveSettings({faq,terms:val('pt2'),cancel:val('pc2'),refund:val('pr2')}))toast('Saved')}
async function saveSocial(){const social={};['facebook','instagram','tiktok','google'].forEach(k=>social[k]=val('so_'+k));if(await saveSettings({social}))toast('Saved')}

boot();
</script>
