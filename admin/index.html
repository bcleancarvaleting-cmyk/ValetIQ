<div id="app"><div class="spin"></div></div>
<script src="/cert.js?v=1" defer></script><script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"></script><script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"><\/script>')</script>
<script>
/* ================= helpers ================= */
const CFG=window.VALETIQ||{};
const $=id=>document.getElementById(id);const val=id=>{const e=$(id);return e?e.value.trim():''};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const addM=(s,n)=>{const d=pd(s);d.setDate(1);d.setMonth(d.getMonth()+n);return ymd(d)};
const TODAY=()=>ymd(new Date());const hm=t=>(t||'').slice(0,5);const tm=s=>{const[h,m]=hm(s).split(':').map(Number);return h*60+m};const ft=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fd=s=>{const d=pd(s);return`${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`};const fdy=s=>{const d=pd(s);return`${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`};
const gbp=n=>{n=Math.round((+n||0)*100)/100;const neg=n<0;n=Math.abs(n);return(neg?'-':'')+'£'+n.toLocaleString('en-GB',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})};
const r2=n=>Math.round(n*100)/100;const intl=m=>{m=(m||'').replace(/\D/g,'');return m.startsWith('0')?'44'+m.slice(1):m};
const SIZES=['Small','Medium','Large'];const STATUSES=['Booked','Confirmed','In Progress','Completed','Cancelled'];const CATS=['Valeting','Detailing','Additional Services'];
const normM=t=>{let d=(t||'').replace(/\D/g,'');if(!d)return'';if(d.startsWith('0044'))return'0'+d.slice(4);if(d.startsWith('44')&&d.length>=12)return'0'+d.slice(2);if(d.startsWith('7')&&d.length===10)return'0'+d;return d};
const NOEMAIL='@no-email.invalid';const noEmail=m=>{const d=(m||'').replace(/\D/g,'');return(d?d:'nm'+Date.now().toString(36)+Math.random().toString(36).slice(2,6))+NOEMAIL};const showEmail=e=>e&&e.endsWith(NOEMAIL)?'':e;
function toast(m,err){const e=document.createElement('div');e.className='toast'+(err?' err':'');e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),err?4500:2600)}
function sheet(html){closeSheet();const s=document.createElement('div');s.className='sheet';s.id='sheet';s.innerHTML=`<div class="in"><button class="x" onclick="closeSheet()" aria-label="Close">✕</button>${html}</div>`;s.addEventListener('click',e=>{if(e.target===s)closeSheet()});document.body.appendChild(s)}
function closeSheet(){const s=$('sheet');if(s)s.remove()}
let _cf=null;function confirmBox(msg,fn,yes='Yes'){_cf=fn;sheet(`<h3>Are you sure?</h3><p class="mu">${msg}</p><div class="row"><button class="btn bad" onclick="closeSheet();_cf&&_cf()">${yes}</button><button class="btn" onclick="closeSheet()">Back</button></div>`)}
const errMsg=e=>(e&&(e.message||e.error_description))||String(e);
const ICON={inv:'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h5',web:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z',home:'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',diary:'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z',plus:'M12 5v14M5 12h14',users:'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75',gear:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z'};
const ico=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${ICON[k]}"/></svg>`;

/* ================= state ================= */
const sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,lock:async(n,t,fn)=>await fn()}});
const S={user:null,biz:null,services:[],slots:[],blocked:[],view:'home',date:TODAY(),dv:'day',cq:'',cust:null};
const svcById=id=>S.services.find(s=>s.id===id);
const priceFor=(s,size)=>size==2?(s.price_large??s.price_medium??s.price_small):size==1?(s.price_medium??s.price_small):s.price_small;
const isWork=d=>{const wd=S.biz.settings.workDays||[1,2,3,4,5,6];return wd.includes(pd(d).getDay())&&!S.blocked.some(b=>d>=b.from_date&&d<=b.to_date)};
const blockedReason=d=>(S.blocked.find(b=>d>=b.from_date&&d<=b.to_date)||{}).reason;
const paid=(b,pays)=>r2(pays.filter(p=>p.booking_id===b.id).reduce((s,p)=>s+ +p.amount,0));
const owed=(b,pays)=>b.status==='Cancelled'?0:Math.max(0,r2(+b.total-paid(b,pays)));
const endMin=b=>b.days>0?tm(S.biz.settings.hours?.end||'18:00'):tm(b.start_time)+b.duration_mins;

/* ================= boot / auth ================= */

async function fetchBookings(from,to){const{data,error}=await sb.from('bookings').select('*, customers(id,first_name,last_name,mobile,email,vip,business_account,company_name,invoice_email,company_address,house,address,postcode), vehicles(reg,make,model,colour)').eq('business_id',S.biz.id).neq('status','Pending').gte('date',addD(from,-3)).lte('date',to).order('date').order('start_time');if(error)throw error;
 const L=data.filter(b=>{const end=b.days>0?addD(b.date,b.days-1):b.date;return end>=from&&b.date<=to});
 const ids=L.map(b=>b.id);let pays=[];if(ids.length){for(let i=0;i<ids.length;i+=150){const r=await sb.from('payments').select('*').in('booking_id',ids.slice(i,i+150));if(r.error)throw r.error;pays=pays.concat(r.data)}}return{L,pays}}

 const n=D.reduce((s,b)=>s+q(b),0),sum=D.reduce((s,b)=>s+ +b.total,0),avg=n?r2(sum/n):0,nb=B.reduce((s,b)=>s+q(b),0),bavg=nb?r2(B.reduce((s,b)=>s+ +b.total,0)/nb):0,diff=r2(avg-at);

 const per=Array(days).fill(0);month.forEach(b=>{per[pd(b.date).getDate()-1]+= +b.total});let run=0;const cum=per.map(v=>run+=v);const max=Math.max(tg,tot)*1.12||1;
 const W=320,H=130,P=6,x=i=>P+(W-2*P)*i/(days-1),y=v=>H-18-(H-30)*v/max;const today=t>=mFrom&&t<=mTo?pd(t).getDate()-1:(t>mTo?days-1:-1);

async function vDiary(){const v=S.dv,dd=S.date;let from,to,title;
 if(v==='day'){from=to=dd;title=fd(dd)+(dd===TODAY()?' · Today':'')}
 else if(v==='week'){from=addD(dd,-((pd(dd).getDay()+6)%7));to=addD(from,6);title=`${fd(from)} – ${fd(to)}`}
 else{const d=pd(dd);from=ymd(new Date(d.getFullYear(),d.getMonth(),1));to=ymd(new Date(d.getFullYear(),d.getMonth()+1,0));title=`${MON[d.getMonth()]} ${d.getFullYear()}`}
 const gFrom=v==='month'?addD(from,-((pd(from).getDay()+6)%7)):from,gTo=v==='month'?addD(gFrom,41):to;
 const[{L,pays},cl]=await Promise.all([fetchBookings(gFrom,gTo),v==='day'?sb.from('slot_closures').select('*').eq('business_id',S.biz.id).eq('date',dd):Promise.resolve({data:[]})]);
 const live=L.filter(b=>b.status!=='Cancelled');let body='';
 if(v==='day'){const jobs=L.filter(b=>covers(b,dd));const lj=jobs.filter(b=>b.status!=='Cancelled');const closed=(cl.data||[]).map(c=>hm(c.start_time));
  body=`<div class="card" style="margin-bottom:12px"><div class="row"><div><div class="tiny mu">Work this day</div><div class="kpi"><div class="v">${gbp(lj.reduce((s,b)=>s+ +b.total,0))}</div></div></div><span class="sp"></span><div class="tiny mu" style="text-align:right">${lj.length} job${lj.length===1?'':'s'}<br>${gbp(lj.reduce((s,b)=>s+owed(b,pays),0))} to collect</div></div>
  ${!isWork(dd)?`<div class="banner off" style="margin-top:10px">${esc(blockedReason(dd)||'Not a working day')} — closed to online bookings.</div>`:''}</div>
  ${jobs.length?jobs.map(b=>jobHTML(b,pays)).join(''):'<div class="card empty">Nothing booked.</div>'}
  ${S.biz.settings.slotMode!=='auto'&&isWork(dd)?`<div class="card" style="margin-top:12px"><div class="row" style="margin-bottom:8px"><b>Start times</b><span class="tiny mu">tap to close/open for this day</span></div><div class="chips">${S.slots.filter(s=>s.enabled).map(s=>{const t=hm(s.start_time),m=tm(t);const busy=lj.some(b=>b.days>0||(m>=tm(b.start_time)-(S.biz.settings.buffer??30)&&m<endMin(b)+(S.biz.settings.buffer??30)));const off=closed.includes(t);const c=off?'off':busy?'busy':'free';
   return`<button class="chip ${c}" onclick="${busy&&!off?`addBooking({date:'${dd}',time:'${t}'})`:`toggleClosure('${dd}','${t}',${off})`}"><b>${t}</b>${off?'Closed':busy?'Booked':'Free'}</button>`}).join('')}</div>
  <div class="row" style="margin-top:10px"><button class="btn sm" onclick="addBooking({date:'${dd}'})">+ Add booking this day</button><button class="btn sm" onclick="blockSheet('${dd}')">Block day / time off</button></div></div>`:`<div class="row" style="margin-top:12px"><button class="btn sm" onclick="addBooking({date:'${dd}'})">+ Add booking this day</button><button class="btn sm" onclick="blockSheet('${dd}')">Block day / time off</button></div>`}`}
 else if(v==='week'){body=[...Array(7)].map((_,i)=>{const d=addD(from,i);const js=L.filter(b=>covers(b,d));const lj=js.filter(b=>b.status!=='Cancelled');return`<div class="row" style="margin:14px 0 6px;cursor:pointer" onclick="S.date='${d}';S.dv='day';go('diary')"><b style="${d===TODAY()?'color:var(--ac)':''}">${fd(d)}</b>${!isWork(d)?`<span class="pill p-bd">${esc(blockedReason(d)||'Closed')}</span>`:''}<span class="sp"></span><span class="tiny mu">${lj.length} · ${gbp(lj.reduce((s,b)=>s+ +b.total,0))}</span></div>${js.map(b=>jobHTML(b,pays)).join('')||'<div class="tiny mu" style="padding:4px 2px">—</div>'}`}).join('')}
 else{let cells='';for(let i=0;i<42;i++){const d=addD(gFrom,i);const js=live.filter(b=>covers(b,d));const inM=d>=from&&d<=to;cells+=`<div class="mcell ${inM?'':'dim'} ${d===TODAY()?'td':''} ${isWork(d)?'':'off'}" onclick="S.date='${d}';S.dv='day';go('diary')"><b>${pd(d).getDate()}</b>${js.length?`<span class="n">${js.length} job${js.length>1?'s':''}</span><span class="tiny mu">${gbp(js.reduce((s,b)=>s+ +b.total,0))}</span>`:''}</div>`}
  body=`<div class="mgrid" style="margin-bottom:4px">${['M','T','W','T','F','S','S'].map(x=>`<div class="tiny mu" style="text-align:center">${x}</div>`).join('')}</div><div class="mgrid">${cells}</div><p class="tiny mu" style="margin-top:8px">Month total: <b>${gbp(live.filter(b=>b.date>=from&&b.date<=to).reduce((s,b)=>s+ +b.total,0))}</b> · ${live.filter(b=>b.date>=from&&b.date<=to).length} bookings</p>`}

function prepaidHTML(c,subs){return`<div class="card" style="margin-top:12px"><div class="row"><h3 style="margin:0">Pre-paid washes</h3><span class="sp"></span><button class="btn xs pri" onclick="ppBox('${c.id}')">+ Add pre-paid</button></div>
 ${subs.length?subs.map(x=>{const exp=x.end_date<TODAY();const W=ppWash(x,S._custBk);return`<div style="padding:10px 0;border-top:1px solid var(--ln);margin-top:8px;opacity:${x.status==='active'&&!exp?1:.55}"><div class="row"><b style="font-size:20px">${x.credits}</b><span class="tiny mu">&nbsp;of ${x.visits} left</span><span class="sp"></span><span class="tiny ${exp?'':'mu'}" style="${exp?'color:#fca5a5':''}">${exp?'Expired':'Until'} ${fdy(x.end_date)}</span></div>
 <div class="ppdots">${ppDots(x,W)}</div><div class="tiny" style="margin-bottom:4px"><span style="color:#4ade80">✓ ${W.done} done</span>${W.booked?` · <span style="color:#fbbf24">🕒 ${W.booked} booked</span>`:''} · ${x.credits} still to use</div>${W.list.length?`<div class="tiny mu">${W.list.slice(0,6).map(b=>`✓ ${fdy(b.date)} · ${esc(b.ref)}`).join('<br>')}</div>`:''}
 <div class="tiny mu">${esc(ppSvcNames(x.eligible))}${+x.amount?` · paid ${gbp(x.amount)}`:''}${x.note?' · '+esc(x.note):''}</div>
 <div class="row" style="margin-top:6px;gap:6px"><button class="btn xs" style="background:#14532d;color:#bbf7d0;border-color:#166534" onclick="ppAdj('${x.id}',-1)">✓ Wash done</button><button class="btn xs" onclick="ppAdj('${x.id}',1)">↺ Give one back</button><span class="sp"></span>${x.status==='active'?`<button class="btn xs bad" onclick="confirmBox('End this pre-paid plan? Remaining washes can no longer be used.',()=>ppEnd('${x.id}'),'End plan')">End</button>`:`<span class="tiny mu">${esc(x.status)}</span>`}</div></div>`}).join(''):'<p class="tiny mu" style="margin-top:6px">None. Add one for customers on a maintenance or pre-paid plan — they can then book with their washes online.</p>'}</div>`}
function ppWash(x,B){const L=(B||[]).filter(b=>b.subscription_id===x.id&&b.status!=='Cancelled');const list=L.filter(b=>b.status==='Completed').sort((a,b)=>b.date.localeCompare(a.date));const q=b=>Math.max(1,+b.qty||1);
 const booked=L.filter(b=>b.status!=='Completed').reduce((s,b)=>s+q(b),0),used=Math.max(0,x.visits-x.credits),done=Math.max(0,used-booked);return{done,booked,list}}
function ppDots(x,W){const n=Math.min(x.visits,40);return Array.from({length:n},(_,i)=>i<W.done?'<i class="d"></i>':i<W.done+W.booked?'<i class="b"></i>':'<i></i>').join('')}

function ppBox(cid){const def=S.services.filter(s=>s.requires_approval).map(s=>s.id);const end=addD(TODAY(),365);
 sheet(`<h3>Add pre-paid washes</h3><p class="tiny mu">For a plan they've paid for. Each booking made with it uses one wash; cancelling gives it back.</p>

 <div><label class="f">Amount paid (£)</label><input id="pp_a" type="number" step="0.01" inputmode="decimal" placeholder="optional"></div><div><label class="f">Use by</label><input id="pp_e" type="date" value="${end}"></div></div>
 <label class="f">Can be used for</label><div class="col" style="gap:6px">${S.services.filter(s=>s.active).map(s=>`<label class="row tiny" style="gap:8px"><input type="checkbox" class="pp_s" value="${s.id}" style="width:auto" ${def.includes(s.id)?'checked':''}> ${esc(s.name)}</label>`).join('')}</div>

 <button class="btn pri block" style="margin-top:14px" onclick="ppSave('${cid}')">Add pre-paid washes</button>`)}
async function ppSave(cid){const v=+val('pp_v'),cr=+val('pp_c');if(!(v>0)||cr<0||cr>v)return toast('Check the number of washes',1);if(!val('pp_e'))return toast('Pick a use-by date',1);const el=[...document.querySelectorAll('.pp_s:checked')].map(x=>x.value);
 const{data,error}=await sb.from('plan_subscriptions').insert({business_id:S.biz.id,customer_id:cid,visits:v,credits:cr,amount:+val('pp_a')||0,start_date:TODAY(),end_date:val('pp_e'),eligible:el,note:val('pp_n'),auto_renew:false,status:'active'}).select().single();if(error)return toast(errMsg(error),1);
 await sb.from('credit_ledger').insert({business_id:S.biz.id,subscription_id:data.id,delta:cr,note:'Added by '+S.biz.name});await sb.from('customers').update({maintenance_ok:true}).eq('id',cid);closeSheet();toast(`${cr} washes added`);go('customers')}
async function ppAdj(id,d){const x=S._custSubs.find(y=>y.id===id);if(!x)return;const n=x.credits+d;if(n<0)return toast('No washes left',1);const{error}=await sb.from('plan_subscriptions').update({credits:n,visits:Math.max(x.visits,n)}).eq('id',id);if(error)return toast(errMsg(error),1);await sb.from('credit_ledger').insert({business_id:S.biz.id,subscription_id:id,delta:d,note:d<0?'Wash done (marked by '+S.biz.name+')':'Wash given back by '+S.biz.name});toast(d<0?`✓ Wash ticked off — ${n} left`:`Wash given back — ${n} left`);go('customers')}

async function warrBox(id){const{data:b,error}=await sb.from('bookings').select('*, customers(*), vehicles(*)').eq('id',id).single();if(error)return toast(errMsg(error),1);const sv=svcById(b.service_id)||{};const u=(S.upgrades||[]).find(x=>x.id===b.upgrade_id);
 const veh=(b.cars&&b.cars[0])||b.vehicles||{};const w=b.warranty||{product:(u&&u.name)||(/ceramic/i.test(sv.name||'')?((u&&u.warranty_years)||sv.warranty_years||2)+'-year Ceramic Coating':sv.name),years:(u&&u.warranty_years)||sv.warranty_years||2,applied:b.date,reg:(veh.reg||''),vehicle:[veh.make,veh.model].filter(Boolean).join(' '),notes:''};

async function warrSave(id){const y=+val('w_y'),a=val('w_a');if(!(y>0)||!a)return toast('Add years and date applied',1);const ex=new Date(a+'T12:00');ex.setFullYear(ex.getFullYear()+y);
 const w={product:val('w_p'),years:y,applied:a,expires:ymd(ex),reg:val('w_r').toUpperCase(),vehicle:val('w_v'),notes:val('w_n'),issued:TODAY()};
 const{data:b,error}=await sb.from('bookings').update({warranty:w}).eq('id',id).select('*, customers(*)').single();if(error)return toast(errMsg(error),1);warrShow(b)}
function warrShow(b){const w=b.warranty,c=b.customers||{};const txt=`Hi ${c.first_name}, here's your ${w.product} certificate — ${w.years}-year protection on ${w.reg} (applied ${fdy(w.applied)}, valid until ${fdy(w.expires)}). You can view and download it any time in your account: ${location.origin}/account/\n\nTo keep your warranty valid, the vehicle must be regularly maintained by ${S.biz.settings.legalName||S.biz.name}.`;

function warrantyHTML(biz,c,w,ref){const br=(biz.settings||{}).brand||{};const ac=(biz.settings||{}).accent||'#2f7bff';const full=(biz.settings||{}).legalName||biz.name;
 return`<div style="font-family:Georgia,serif;color:#111;background:#fff;max-width:760px;margin:0 auto;padding:30px 26px;border:10px double ${ac};border-radius:6px">
 <div style="text-align:center">${br.logo?`<img src="${esc(br.logo)}" style="height:70px;object-fit:contain">`:''}<div style="font:700 12px/1 Arial;letter-spacing:.3em;color:${ac};margin-top:10px">CERTIFICATE OF PROTECTION</div><h1 style="font-size:26px;margin:10px 0 2px;color:#111">${esc(w.product||'Ceramic Coating')}</h1><div style="font:14px Arial;color:#555">${esc(String(w.years))}-year warranty · Ref ${esc(ref||'')}</div></div>
 <table style="width:100%;margin:22px 0;font:14px Arial;border-collapse:collapse">${[['Owner',(c.first_name||'')+' '+(c.last_name||'')],['Vehicle',[w.reg,w.vehicle].filter(Boolean).join(' · ')],['Date applied',fdy(w.applied)],['Protection valid until',fdy(w.expires)],['Applied by',full]].map(r=>`<tr><td style="padding:7px 0;color:#666;width:42%;border-bottom:1px solid #eee">${r[0]}</td><td style="padding:7px 0;font-weight:700;border-bottom:1px solid #eee;color:#111">${esc(r[1]||'—')}</td></tr>`).join('')}</table>
 <div style="font:13px/1.55 Arial;color:#333;background:#f6f7f9;border-radius:8px;padding:12px 14px"><b>Warranty conditions</b><br>This warranty is valid only while the vehicle is <b>regularly maintained by ${esc(full)}</b> using approved, coating-safe products and methods (we recommend a maintenance valet at least every 4–6 weeks). It covers premature failure of the coating's hydrophobic and protective properties under normal use. It does not cover damage from accidents, stone chips, scratches, bird lime or tree sap left uncleaned, automatic/brush car washes, harsh chemicals, or repairs and resprays after application. ${w.notes?esc(w.notes):''}</div>

async function loadPhotos(id){const box=$('bphotos');if(!box)return;const[{data:ph},{data:gi}]=await Promise.all([sb.from('booking_photos').select('*').eq('booking_id',id).order('created_at'),sb.from('gallery_items').select('id,show').eq('booking_id',id)]);if(!$('bphotos'))return;
 const P=ph||[];const be=P.filter(x=>x.kind==='before'),af=P.filter(x=>x.kind==='after');const g=(gi||[])[0];
 box.innerHTML=`${P.length?`<div class="phgrid">${P.map(x=>`<div class="ph"><img src="${esc(x.url)}" loading="lazy" onclick="window.open('${esc(x.url)}')"><span>${x.kind==='before'?'Before':'After'}</span><button onclick="delPhoto('${x.id}','${id}')">✕</button></div>`).join('')}</div>`:'<div class="tiny mu">Snap a few before and after shots — customers see them in their account, and you can add the best to your website.</div>'}

async function addPhotos(inp,id,kind){const files=[...inp.files];if(!files.length)return;const done=busy(`Uploading ${files.length} photo${files.length>1?'s':''}…`);try{for(const f of files){const url=await uploadImg(f,'jobs/'+id,1600);const{error}=await sb.from('booking_photos').insert({business_id:S.biz.id,booking_id:id,kind,url});if(error)throw error}}catch(e){toast(errMsg(e),1)}done();loadPhotos(id);galSync(id)}

async function galSync(id){const[{data:ph},{data:gi}]=await Promise.all([sb.from('booking_photos').select('*').eq('booking_id',id).order('created_at'),sb.from('gallery_items').select('*').eq('booking_id',id)]);const g=(gi||[])[0];if(!g)return;
 const P=ph||[],be=P.find(x=>x.kind==='before'),af=P.filter(x=>x.kind==='after').slice(-1)[0];
 if(!be||!af){if(g.show){await sb.from('gallery_items').update({show:false}).eq('id',g.id);toast('Taken off your website — it needs a before and an after photo');loadPhotos(id)}return}

 await sb.from('gallery_items').update({before_url:be.url,after_url:af.url,show:false}).eq('id',g.id);loadPhotos(id);

function insRange(k){const t=TODAY(),d=pd(t);let from,to=t,label;if(k==='lm'){const a=new Date(d.getFullYear(),d.getMonth()-1,1);from=ymd(a);to=ymd(new Date(d.getFullYear(),d.getMonth(),0));label=MON[a.getMonth()]}
 else if(k==='90'){from=addD(t,-89);label='Last 90 days'}else if(k==='y'){from=ymd(new Date(d.getFullYear(),0,1));label=String(d.getFullYear())}else{from=ymd(new Date(d.getFullYear(),d.getMonth(),1));to=ymd(new Date(d.getFullYear(),d.getMonth()+1,0));label=MON[d.getMonth()]+' (whole month)'}

 const{data,error}=await sb.functions.invoke('stripe-setup',{body:{business_id:S.biz.id,secret_key:k}});done();let msg=error?errMsg(error):data&&data.error;if(error&&error.context&&error.context.json){try{const j=await error.context.json();msg=j.error||msg}catch(e){}}

function squarePng(file,size,pad,bg){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');if(bg){x.fillStyle=bg;x.fillRect(0,0,size,size)}const inner=size*(1-pad*2);const sc=Math.min(inner/im.width,inner/im.height);const w=im.width*sc,h=im.height*sc;x.drawImage(im,(size-w)/2,(size-h)/2,w,h);c.toBlob(b=>b?res(b):rej(new Error('Could not process image')),'image/png')};im.onerror=()=>rej(new Error('Could not read image — try a PNG or JPG'));im.src=fr.result};fr.readAsDataURL(file)})}

 out.bg=bg;if(await saveSettings({brand:{...(S.biz.settings.brand||{}),...out}})){applyBrand();toast('Logo updated on your website & apps');go('website')}}catch(e){toast(errMsg(e),1)}done()}

function resizeImg(file,max){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(new Error('Could not read that file'));fr.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error('Could not process image')),'image/jpeg',.84)};im.onerror=()=>rej(new Error('Could not read image — try a JPG or PNG'));im.src=fr.result};fr.readAsDataURL(file)})}
async function uploadImg(file,folder,max){const blob=await resizeImg(file,max);const path=`${S.biz.id}/${folder}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
 const{error}=await sb.storage.from('media').upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000'});if(error)throw error;return sb.storage.from('media').getPublicUrl(path).data.publicUrl}
function busy(msg){const e=document.createElement('div');e.id='busy';e.className='sheet';e.innerHTML=`<div class="in" style="text-align:center"><div class="spin" style="margin:10px auto"></div><b>${esc(msg)}</b></div>`;document.body.appendChild(e);return()=>e.remove()}

function wrapTxt(x,t,maxW){const w=String(t).split(' ');let l='',out=[];for(const p of w){const tt=l?l+' '+p:p;if(x.measureText(tt).width>maxW&&l){out.push(l);l=p}else l=tt}if(l)out.push(l);return out}
function coverImg(x,im,X,Y,W,H){if(!im){x.fillStyle='#1c2029';x.fillRect(X,Y,W,H);return}const r=Math.max(W/im.width,H/im.height),w=im.width*r,h=im.height*r;x.save();x.beginPath();x.rect(X,Y,W,H);x.clip();x.drawImage(im,X+(W-w)/2,Y+(H-h)/2,w,h);x.restore()}

 const[b,a,logo]=await Promise.all([ogImgM(g.before_url),ogImgM(g.after_url),ogImg(br.logo)]);x.fillStyle='#0b0d12';x.fillRect(0,0,W,H);
 const top=120,ph=520;coverImg(x,b,0,top,W,ph);coverImg(x,a,0,top+ph+8,W,ph);x.fillStyle='#0b0d12';x.fillRect(0,top+ph,W,8);
 const lab=(t,y,bg)=>{x.font='800 30px Inter, sans-serif';const w=x.measureText(t).width+44;x.fillStyle=bg;x.beginPath();x.roundRect(28,y,w,56,28);x.fill();x.fillStyle='#fff';x.fillText(t,50,y+39)};
 lab('BEFORE',top+24,'rgba(0,0,0,.72)');lab('AFTER',top+ph+8+24,ac);
 if(logo){x.save();x.beginPath();x.arc(80,60,40,0,Math.PI*2);x.clip();x.drawImage(logo,40,20,80,80);x.restore()}
 x.fillStyle='#fff';x.font='800 38px Inter, sans-serif';x.fillText(S.biz.name,logo?136:40,58);x.fillStyle='#9aa3b5';x.font='500 24px Inter, sans-serif';x.fillText('Mobile valeting & detailing',logo?136:40,92);
 const fy=top+ph*2+8;x.fillStyle='#0b0d12';x.fillRect(0,fy,W,H-fy);x.fillStyle=ac;x.fillRect(0,fy,W,6);
 x.fillStyle='#fff';x.font='800 36px Inter, sans-serif';const tl=wrapTxt(x,g.title||'Before & after',W-80).slice(0,1);x.fillText(tl[0],40,fy+56);
 const sub=[g.done_on?'📅 '+new Date(g.done_on+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'',g.location?'📍 '+g.location:''].filter(Boolean).join('     ');x.fillStyle='#c7cdd9';x.font='500 26px Inter, sans-serif';if(sub)x.fillText(sub,40,fy+98);
 x.fillStyle='#fff';x.font='800 28px Inter, sans-serif';const site=location.host.replace(/^www\./,'');x.fillText(site,40,fy+148);x.fillStyle='#c7cdd9';x.font='600 26px Inter, sans-serif';const ph_=st.phone||'';if(ph_){const tw=x.measureText(ph_).width;x.fillText(ph_,W-40-tw,fy+148)}
 return c}

 for(const it of items){if(Array.isArray(it)){mc.fillRect(it[0]*W,it[1]*H,it[2]*W,it[3]*H);continue}const P=it.p||[];if(!P.length)continue;mc.lineWidth=Math.max(4,(it.w||.04)*W);mc.beginPath();mc.moveTo(P[0][0]*W,P[0][1]*H);if(P.length===1)mc.lineTo(P[0][0]*W+.1,P[0][1]*H);for(let i=1;i<P.length;i++)mc.lineTo(P[i][0]*W,P[i][1]*H);mc.stroke()}

 S.biz.settings.reviewStats=data;const n=(data.google&&data.google.fetched||0)+(data.facebook&&data.facebook.fetched||0);(data.errors||[]).length?toast(data.errors.join(' · '),1):toast(`Reviews updated ✓ ${n?'('+n+' pulled in)':''}`);go('website')}catch(e){done();toast('Could not refresh: '+errMsg(e),1)}}

const CD_F=['title','subtitle','theme','accent','gold','product','warranty','layers','intro','aftercare','sign','role','footer'];
function certD(){return Object.assign({},window.CERT_DEF||{},S.biz.settings.certDesign||{})}

async function certsTab(){const{data:C}=await sb.from('certificates').select('*').eq('business_id',S.biz.id).order('created_at',{ascending:false}).limit(300);S._certs=C||[];const D=certD();setTimeout(certPreview,60);
 const inp=(k,l,ph,t)=>`<label class="f">${l}</label><input id="cd_${k}" ${t?`type="${t}"`:''} value="${esc(String(D[k]??''))}" placeholder="${esc(ph||'')}" oninput="certPrevSoon()">`;
 return`<div class="card" style="margin-bottom:12px"><div class="row"><h3 style="margin:0">🛡️ Ceramic coating certificates</h3><span class="sp"></span><button class="btn sm pri" onclick="certNew()">+ Issue a certificate</button></div><p class="tiny mu" style="margin-bottom:0">Give every coating customer a premium certificate. The QR code opens a “Genuine certificate” page on your website, so buyers can check it when the car is sold.</p></div>
 <div class="card" style="margin-bottom:12px"><h3>Design your certificate</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;align-items:start"><div><div class="tiny mu" style="margin-bottom:6px">Live preview</div><img id="cd_prev" alt="" style="width:100%;border-radius:10px;background:#05070c;aspect-ratio:1.414;display:block"><p class="tiny mu">Your logo comes from Branding.</p></div><div>

 <label class="f">Style</label><select id="cd_theme" onchange="certPrevSoon()"><option value="dark" ${D.theme!=='light'?'selected':''}>Dark with gold frame</option><option value="light" ${D.theme==='light'?'selected':''}>Light with gold frame</option></select>
 <div class="grid g2"><div><label class="f">Highlight colour</label><input type="color" id="cd_accent" value="${esc(D.accent)}" oninput="certPrevSoon()" style="height:44px;padding:4px"></div><div><label class="f">Frame colour</label><input type="color" id="cd_gold" value="${esc(D.gold)}" oninput="certPrevSoon()" style="height:44px;padding:4px"></div></div>
 ${inp('product','Default coating product','e.g. Gtechniq Crystal Serum Ultra')}<div class="grid g2"><div>${inp('warranty','Default warranty (years)','2','number')}</div><div>${inp('layers','Default layers','1','number')}</div></div>
 <label class="f">Intro line</label><textarea id="cd_intro" rows="2" oninput="certPrevSoon()">${esc(D.intro)}</textarea>

 <div class="grid g2"><div>${inp('sign','Signed by','Your name')}</div><div>${inp('role','Under the signature','Authorised applicator')}</div></div>${inp('footer','Footer line (optional)','e.g. Fully insured · Kent')}
 <label class="row tiny" style="margin-top:8px;gap:8px"><input type="checkbox" id="cd_qr" ${D.qr!==false?'checked':''} onchange="certPrevSoon()" style="width:auto"> Show “scan to verify” QR code</label>
 <div class="row" style="gap:6px;margin-top:10px"><button class="btn pri" onclick="certSaveDesign()">Save design</button><button class="btn" onclick="certResetDesign()">Reset to default</button></div></div>
 </div></div>
 <div class="card"><h3>Issued certificates (${(C||[]).length})</h3><div class="col">${(C||[]).map(c=>`<div class="row" style="background:var(--p2);border-radius:12px;padding:10px;gap:10px;${c.void?'opacity:.55':''}"><div style="flex:1;min-width:0"><b>${esc(c.customer_name||'—')}</b> ${c.reg?`<span class="reg">${esc(c.reg)}</span>`:''}<div class="tiny mu">${esc(c.code)} · ${esc(c.product)} · ${new Date(c.applied_on+'T12:00').toLocaleDateString('en-GB')}${c.void?' · VOID':''}</div></div><button class="btn xs pri" onclick="certView('${c.id}')">View</button></div>`).join('')||'<p class="tiny mu">None yet — tap “Issue a certificate” after your next coating.</p>'}</div></div>`}
function certReadDesign(){const o={};CD_F.forEach(k=>{const e=$('cd_'+k);if(e)o[k]=['warranty','layers'].includes(k)?+e.value||0:e.value});const q=$('cd_qr');o.qr=q?q.checked:true;return o}
let _cpT=null;function certPrevSoon(){clearTimeout(_cpT);_cpT=setTimeout(certPreview,250)}
async function certPreview(){const im=$('cd_prev');if(!im||!window.certCanvas)return;const D=certReadDesign();const code=(S.biz.settings.invoicePrefix||'BC')+'-CERT-SAMPLE';
 const cv=await certCanvas({code,customer_name:'James Smith',reg:'AB12 CDE',vehicle:'BMW M3 Competition',colour:'Isle of Man Green',product:D.product||'Ceramic coating',layers:D.layers||1,warranty_years:D.warranty||2,applied_on:TODAY(),coverage:'Paintwork, wheels and glass'},D,certOpts(code));im.src=cv.toDataURL('image/jpeg',.86)}

async function certNew(pre){pre=pre||{};const D=certD();if(!S._certCust){const{data}=await sb.from('customers').select('id,first_name,last_name,company_name,customer_type,mobile,email').eq('business_id',S.biz.id).order('first_name').limit(2000);S._certCust=data||[]}
 sheet(`<h3>Issue a certificate</h3><label class="f">Customer</label><input id="ce_cs" list="ce_cl" placeholder="Start typing a name…" oninput="certPickCust()" value="${esc(pre.name||'')}"><datalist id="ce_cl">${S._certCust.map(c=>`<option value="${esc(cn(c))}${c.mobile?' · '+esc(c.mobile):''}"></option>`).join('')}</datalist>
 <div class="grid g2"><div><label class="f">Name on certificate</label><input id="ce_n" value="${esc(pre.name||'')}"></div><div><label class="f">Registration</label><input id="ce_r" style="text-transform:uppercase" value="${esc(pre.reg||'')}"></div></div>
 <div class="grid g2"><div><label class="f">Vehicle</label><input id="ce_v" placeholder="e.g. BMW M3" value="${esc(pre.vehicle||'')}"></div><div><label class="f">Colour</label><input id="ce_c" value="${esc(pre.colour||'')}"></div></div>
 <label class="f">Coating product</label><input id="ce_p" value="${esc(D.product||'')}">
 <div class="grid g3"><div><label class="f">Layers</label><input id="ce_l" type="number" value="${+D.layers||1}"></div><div><label class="f">Warranty (yrs)</label><input id="ce_w" type="number" step="0.5" value="${+D.warranty||2}"></div><div><label class="f">Applied</label><input id="ce_d" type="date" value="${TODAY()}"></div></div>
 <label class="f">Coverage</label><input id="ce_cv" value="Paintwork, wheels and glass"><label class="f">Private notes (not shown)</label><input id="ce_no">
 <button class="btn pri block" style="margin-top:12px" id="ce_go" onclick="certIssue()">Create certificate</button>`);S._ceCust=pre.customer_id||null}
async function certPickCust(){const v=val('ce_cs'),c=(S._certCust||[]).find(x=>v.startsWith(cn(x))&&(v===cn(x)||v.startsWith(cn(x)+' · ')));if(!c)return;S._ceCust=c.id;$('ce_n').value=cn(c);
 const{data:V}=await sb.from('vehicles').select('*').eq('customer_id',c.id).limit(5);const x=(V||[])[0];if(x){$('ce_r').value=x.reg||'';$('ce_v').value=[x.make,x.model].filter(Boolean).join(' ');$('ce_c').value=x.colour||''}}
async function certIssue(){const b=$('ce_go');if(!val('ce_n'))return toast('Add the name for the certificate',1);b.disabled=true;b.textContent='Creating…';
 try{const{data:code,error:e1}=await sb.rpc('new_cert_code',{p_business:S.biz.id});if(e1)throw e1;const w=+val('ce_w')||0,ap=val('ce_d')||TODAY();
  const row={business_id:S.biz.id,code,customer_id:S._ceCust||null,customer_name:val('ce_n'),reg:val('ce_r').toUpperCase(),vehicle:val('ce_v'),colour:val('ce_c'),product:val('ce_p'),layers:+val('ce_l')||1,warranty_years:w,applied_on:ap,expires_on:certAddYears(ap,w),coverage:val('ce_cv'),notes:val('ce_no')};
  const{data,error}=await sb.from('certificates').insert(row).select().single();if(error)throw error;closeSheet();toast('Certificate created 🛡️');(S._certs=S._certs||[]).unshift(data);certView(data.id)}catch(e){b.disabled=false;b.textContent='Create certificate';toast(errMsg(e),1)}}
async function certView(id){let c=(S._certs||[]).find(x=>x.id===id);if(!c){const{data}=await sb.from('certificates').select('*').eq('id',id).single();c=data}if(!c)return;
 sheet(`<h3>${esc(c.customer_name)} ${c.reg?`<span class="reg">${esc(c.reg)}</span>`:''}</h3><div class="tiny mu">${esc(c.code)}${c.void?' · <b style="color:#f87171">VOID</b>':''}</div><div id="cv_img" style="margin:10px 0"><div class="spin" style="margin:30px auto"></div></div>
 <div class="grid g2"><button class="btn pri" onclick="certShare('${c.id}')">📤 Share / save image</button><button class="btn" onclick="certLink('${c.code}')">🔗 Copy verify link</button><button class="btn" onclick="certWa('${c.id}')">💬 Send on WhatsApp</button><button class="btn" onclick="certMail('${c.id}')">✉️ Email link</button></div>
 <div class="row" style="margin-top:10px;gap:6px"><button class="btn sm" onclick="certNew({name:'${esc(c.customer_name).replace(/'/g,"\\'")}',reg:'${esc(c.reg)}',vehicle:'${esc(c.vehicle).replace(/'/g,"\\'")}',colour:'${esc(c.colour).replace(/'/g,"\\'")}',customer_id:${c.customer_id?`'${c.customer_id}'`:'null'}})">Duplicate</button><span class="sp"></span><button class="btn sm ${c.void?'':'bad'}" onclick="certVoid('${c.id}',${!c.void})">${c.void?'Restore':'Void'}</button></div>`);
 const cv=await certCanvas(c,certD(),certOpts(c.code));S._cvBlob=await new Promise(r=>cv.toBlob(r,'image/png'));S._cvCert=c;const u=URL.createObjectURL(S._cvBlob);const box=$('cv_img');if(box)box.innerHTML=`<img src="${u}" style="width:100%;border-radius:10px;display:block" alt="Certificate">`}
async function certShare(){const c=S._cvCert,b=S._cvBlob;if(!c||!b)return;const f=new File([b],`${c.code}.png`,{type:'image/png'});const url=`${location.origin}/cert/${c.code}`;
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:`Ceramic coating certificate ${c.code}`,text:`Your ${S.biz.name} ceramic coating certificate — verify it any time at ${url}`});return}catch(e){if(e.name==='AbortError')return}}

async function certLink(code){const url=`${location.origin}/cert/${code}`;try{await navigator.clipboard.writeText(url);toast('Link copied — '+url.replace(/^https?:\/\//,''))}catch(e){prompt('Copy this link',url)}}

async function certWa(id){const c=S._cvCert;const k=await certContact(c);const url=`${location.origin}/cert/${c.code}`;const msg=`Hi ${k.first_name||c.customer_name.split(' ')[0]}, here's your ceramic coating certificate from ${S.biz.name} 🛡️\n\n${c.product} · ${c.layers} layer${c.layers>1?'s':''} · protected until ${certFmt(c.expires_on||certAddYears(c.applied_on,c.warranty_years))}\n\nView or download it any time (and anyone can scan the QR to check it's genuine): ${url}`;

async function certMail(id){const c=S._cvCert;const k=await certContact(c);const url=`${location.origin}/cert/${c.code}`;location.href=`mailto:${encodeURIComponent(k.email||'')}?subject=${encodeURIComponent('Your ceramic coating certificate — '+c.code)}&body=${encodeURIComponent(`Hi ${k.first_name||c.customer_name.split(' ')[0]},\n\nThanks for choosing ${S.biz.name}. Your ceramic coating certificate is ready:\n\n${url}\n\nYou can view and download it any time, and anyone can scan the QR code to check it's genuine.\n\nAftercare: wait 7 days before washing, use a pH-neutral shampoo and avoid automatic car washes.\n\nThanks\n${S.biz.name}`)}`}

// ---------- Hero video clips ----------
function videoPoster(file){return new Promise(res=>{let done=false;const fin=b=>{if(done)return;done=true;try{v.pause();v.remove()}catch(e){}URL.revokeObjectURL(u);res(b)};
 const v=document.createElement('video');v.muted=true;v.defaultMuted=true;v.playsInline=true;v.setAttribute('playsinline','');v.setAttribute('muted','');v.preload='auto';v.style.cssText='position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0';const u=URL.createObjectURL(file);v.src=u;document.body.appendChild(v);
 const grab=()=>{try{if(!v.videoWidth)return;const sc=Math.min(1,1920/Math.max(v.videoWidth,v.videoHeight));const c=document.createElement('canvas');c.width=Math.round(v.videoWidth*sc);c.height=Math.round(v.videoHeight*sc);c.getContext('2d').drawImage(v,0,0,c.width,c.height);c.toBlob(b=>fin(b||null),'image/jpeg',.82)}catch(e){fin(null)}};
 v.onloadedmetadata=()=>{S._vdur=v.duration||0;try{v.currentTime=Math.min(1,(v.duration||2)/3)}catch(e){}};v.onseeked=grab;v.onloadeddata=()=>setTimeout(grab,300);v.onerror=()=>fin(null);
 const p=v.play();if(p&&p.catch)p.catch(()=>{});setTimeout(()=>fin(null),8000)})}
function shrinkVideo(file,onp){return new Promise(res=>{let done=false,rec=null,poster=null;const u=URL.createObjectURL(file);
 const fin=out=>{if(done)return;done=true;try{v.pause();v.remove()}catch(e){}URL.revokeObjectURL(u);res(out)};
 const mt=window.MediaRecorder&&MediaRecorder.isTypeSupported?['video/mp4;codecs=avc1.42E01F','video/mp4;codecs=avc1','video/mp4'].find(t=>{try{return MediaRecorder.isTypeSupported(t)}catch(e){return false}}):null;
 const v=document.createElement('video');v.muted=true;v.defaultMuted=true;v.playsInline=true;v.setAttribute('playsinline','');v.setAttribute('muted','');v.preload='auto';v.style.cssText='position:fixed;left:0;top:0;width:4px;height:4px;opacity:.01;pointer-events:none;z-index:-1';v.src=u;document.body.appendChild(v);
 v.onerror=()=>fin({poster:null,blob:null});setTimeout(()=>{if(!rec)fin({poster,blob:null})},10000);
 v.onloadeddata=()=>{try{const W=v.videoWidth,H=v.videoHeight;if(!W)return fin({poster:null,blob:null});const sc=Math.min(1,1280/Math.max(W,H));const c=document.createElement('canvas');c.width=Math.round(W*sc/2)*2;c.height=Math.round(H*sc/2)*2;const g=c.getContext('2d');
  const snap=()=>new Promise(r=>{try{g.drawImage(v,0,0,c.width,c.height);c.toBlob(b=>r(b),'image/jpeg',.82)}catch(e){r(null)}});
  if(!mt||!c.captureStream){v.currentTime=Math.min(1,(v.duration||2)/3);v.onseeked=async()=>fin({poster:await snap(),blob:null});return}
  const st=c.captureStream(30);const chunks=[];rec=new MediaRecorder(st,{mimeType:mt,videoBitsPerSecond:3000000});rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  rec.onstop=()=>{const b=new Blob(chunks,{type:'video/mp4'});fin({poster,blob:b.size>50000?b:null})};
  const max=Math.min(v.duration||20,20);let raf;const draw=()=>{if(done)return;g.drawImage(v,0,0,c.width,c.height);if(onp)onp(Math.min(99,Math.round(v.currentTime/max*100)));if(v.currentTime>=max-.05||v.ended){try{rec.state!=='inactive'&&rec.stop()}catch(e){}return}raf=requestAnimationFrame(draw)};
  v.onended=()=>{try{rec.state!=='inactive'&&rec.stop()}catch(e){}};
  v.currentTime=0;const p=v.play();Promise.resolve(p).then(async()=>{g.drawImage(v,0,0,c.width,c.height);rec.start(500);draw();setTimeout(async()=>{poster=await snap()},400)}).catch(async()=>{poster=await snap();fin({poster,blob:null})});
  setTimeout(()=>{try{rec&&rec.state!=='inactive'&&rec.stop()}catch(e){}},(max+15)*1000)}catch(e){fin({poster:null,blob:null})}}})}
async function addVideo(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;if(f.size>50*1024*1024)return toast(`That clip is ${Math.round(f.size/1048576)}MB — the limit is 50MB. Trim it to 10–20 seconds (Photos → Edit) and try again`,1);
 let done=busy('Optimising your clip for the website… 0%');try{
  const sv=await shrinkVideo(f,p=>{const m=document.querySelector('#busy b');if(m)m.textContent=`Optimising your clip for the website… ${p}% (keep this screen open)`});
  let poster=sv.poster;if(!poster)poster=await videoPoster(f);const id=`${Date.now()}-${Math.random().toString(36).slice(2,8)}`;let url='';
  if(poster){const pPath=`${S.biz.id}/hero/${id}.jpg`;const r=await sb.storage.from('media').upload(pPath,poster,{contentType:'image/jpeg',cacheControl:'31536000'});if(!r.error)url=sb.storage.from('media').getPublicUrl(pPath).data.publicUrl}
  const body=sv.blob||f;const conv=!!sv.blob;
  done();done=busy(`Uploading video (${Math.max(1,Math.round(body.size/1048576))}MB) — keep this screen open…`);
  const ext=conv?'mp4':(f.name.split('.').pop()||'mp4').toLowerCase();const type=conv?'video/mp4':(f.type||(ext==='mov'?'video/quicktime':ext==='webm'?'video/webm':'video/mp4'));const vPath=`${S.biz.id}/hero/${id}.${ext}`;
  const r=await sb.storage.from('media').upload(vPath,body,{contentType:type,cacheControl:'31536000'});done();done=null;if(r.error)throw r.error;
  const video=sb.storage.from('media').getPublicUrl(vPath).data.publicUrl;
  const all=S.biz.settings.heroSlides||[];const vids=all.filter(h=>h.video),rest=all.filter(h=>!h.video);
  const ok=await saveSettings({heroSlides:[...vids,{url:url||video,video,caption:''},...rest]});if(ok){toast(conv?`Video ${vids.length+1} added 🎬 — ${vids.length?'your clips fade from one to the next':'add another to fade between them'}`:'Video added 🎬 — if it doesn’t play on the website, record it in “Most Compatible” (Settings → Camera → Formats) and add it again');go('website')}}
 catch(e){if(done)done();toast('Video upload failed: '+errMsg(e),1)}}
async function addSlides(files){files=[...files];if(!files.length)return;const done=busy(`Uploading ${files.length} photo${files.length>1?'s':''}…`);const urls=[];
 try{for(const f of files)urls.push({url:await uploadImg(f,'hero',1920),caption:''})}catch(e){done();return toast(errMsg(e),1)}
 const ok=await saveSettings({heroSlides:[...(S.biz.settings.heroSlides||[]),...urls]});done();if(ok){toast(`${urls.length} photo${urls.length>1?'s':''} added`);go('website')}}
async function slideCap(i,v){const L=[...(S.biz.settings.heroSlides||[])];if(!L[i])return;L[i]={...L[i],caption:v.trim()};if(await saveSettings({heroSlides:L}))toast(v.trim()?'Label saved':'Label removed')}
async function moveSlide(i,d){const L=[...(S.biz.settings.heroSlides||[])];[L[i],L[i+d]]=[L[i+d],L[i]];if(await saveSettings({heroSlides:L}))go('website')}
function delSlide(i){confirmBox('Remove this photo from the slideshow?',async()=>{const L=[...(S.biz.settings.heroSlides||[])];L.splice(i,1);if(await saveSettings({heroSlides:L})){toast('Removed');go('website')}},'Remove')}
async function saveHomeText(){const stats=[0,1,2,3].map(i=>({v:val('sv'+i),l:val('sl'+i)})).filter(x=>x.v||x.l);if(await saveSettings({heroWhite:val('hw'),heroBlue:val('hb'),heroDesc:val('hd'),stats}))toast('Saved — live on your website')}
async function svcPhoto(id,f){if(!f)return;const done=busy('Uploading photo…');try{const url=await uploadImg(f,'services',1400);await svcField(id,'image_url',url);const sv=S.services.find(x=>x.id===id);if(sv)sv.image_url=url;done();go('website');toast('Photo updated — now hide any number plate');plateEdit([url],()=>go('website'),'svc:'+id)}catch(e){done();toast(errMsg(e),1)}}
async function saveSvcText(id){const d=val('sd_'+id),inc=val('si_'+id).split('\n').map(x=>x.trim()).filter(Boolean);const{error}=await sb.from('services').update({description:d,includes:inc}).eq('id',id);if(error)return toast(errMsg(error),1);const s=svcById(id);s.description=d;s.includes=inc;toast('Saved')}
async function offerSet(i,k,v){const O=[...(S.biz.settings.offers||[])];O[i]={...O[i],[k]:v};if(k==='active'&&v)O.forEach((o,j)=>{if(j!==i)o.active=false});if(await saveSettings({offers:O})){toast(k==='active'?(v?'Offer is live':'Offer hidden'):'Saved');if(k==='active')go('website')}}
async function offerAdd(){const O=[...(S.biz.settings.offers||[])];O.push({id:Date.now().toString(36),title:'Winter Special',text:'15% off a Full Valet',serviceId:(S.services.find(s=>s.active)||{}).id,expires:addD(TODAY(),30),active:false});if(await saveSettings({offers:O}))go('website')}
function offerDel(i){confirmBox('Delete this offer?',async()=>{const O=[...(S.biz.settings.offers||[])];O.splice(i,1);if(await saveSettings({offers:O}))go('website')},'Delete')}
async function saveInfo(){const faq=val('fq').split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(x=>x[0]&&x[1]).map(x=>[x[0],x.slice(1).join(' | ')]);if(await saveSettings({faq,terms:val('pt2'),cancel:val('pc2'),refund:val('pr2')}))toast('Saved')}
async function saveSocial(){const social={};['facebook','instagram','tiktok','google'].forEach(k=>social[k]=val('so_'+k));if(await saveSettings({social}))toast('Saved')}

boot();
</script>
