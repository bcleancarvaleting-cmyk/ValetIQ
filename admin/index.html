<style>
:root{--bg:#07080a;--p1:#0e1014;--p2:#151820;--p3:#1c2029;--ln:#242935;--tx:#eef1f6;--mu:#8a92a6;--ac:#2f7bff;--ok:#22c55e;--wa:#f59e0b;--bd:#ef4444;--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Sora,Inter,sans-serif;letter-spacing:-.02em;margin:0 0 .4em}h2{font-size:22px}h3{font-size:17px}h4{font-size:14px;margin-top:14px}
p{margin:0 0 .7em}.mu{color:var(--mu)}.tiny{font-size:12.5px}.b{font-weight:700}
button{font:inherit;cursor:pointer;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--ln);background:var(--p2);color:var(--tx);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}.btn.xs{padding:4px 9px;font-size:12px;border-radius:8px}.btn.bad{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.4);color:#fca5a5}.btn.ok{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.4);color:#86efac}.btn.wa{background:#25D366;border-color:#25D366;color:#03140a}.btn.block{width:100%}.btn:disabled{opacity:.45}
input,select,textarea{background:var(--p2);border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:11px 12px;font:inherit;font-size:16px;width:100%;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--ac)}input[type=checkbox]{width:auto;accent-color:var(--ac)}textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px;font-weight:500}label.f b{color:var(--bd)}
.card{background:var(--p1);border:1px solid var(--ln);border-radius:16px;padding:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}.col{display:flex;flex-direction:column;gap:8px}
.grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:520px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.s-Pending{background:rgba(245,158,11,.15);color:#fcd34d}.s-Booked{background:rgba(138,146,166,.16);color:#c3c9d6}.s-Confirmed{background:rgba(47,123,255,.16);color:#8db6ff}.s-InProgress{background:rgba(245,158,11,.15);color:#fcd34d}.s-Completed{background:rgba(34,197,94,.14);color:#86efac}.s-Cancelled{background:rgba(239,68,68,.13);color:#fca5a5}
.p-ok{background:rgba(34,197,94,.14);color:#86efac}.p-bd{background:rgba(239,68,68,.13);color:#fca5a5}.p-mu{background:var(--p3);color:var(--mu)}.p-ac{background:rgba(47,123,255,.16);color:#8db6ff}
.top{position:sticky;top:0;z-index:20;background:rgba(7,8,10,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--ln);padding:calc(10px + var(--st)) 14px 10px;display:flex;align-items:center;gap:10px}
.badge{width:34px;height:34px;border-radius:50%;background:var(--ac);display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;font-family:Sora;flex:none}
.main{padding:14px 14px calc(96px + var(--sb));max-width:900px;margin:0 auto}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(14,16,20,.95);backdrop-filter:blur(14px);border-top:1px solid var(--ln);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + var(--sb))}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mu);padding:6px 0;border-radius:10px}.nav button.on{color:var(--tx)}.nav button.on svg{color:var(--ac)}.nav svg{width:22px;height:22px}
.nav .mid{background:var(--ac);color:#fff!important;border-radius:16px;margin:-14px 6px 0;box-shadow:0 8px 24px rgba(47,123,255,.45);padding:10px 0!important}.nav .mid svg{color:#fff!important}.nav .mid.on{outline:2px solid #fff}@media(max-width:380px){.nav button{font-size:10px}}.nav .add svg{color:#fff!important}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{padding:7px 14px;border-radius:999px;background:var(--p2);border:1px solid var(--ln);color:var(--mu);font-size:13px;font-weight:600;white-space:nowrap}.tab.on{background:var(--tx);color:#000;border-color:var(--tx)}
.job{display:flex;gap:12px;padding:12px;border:1px solid var(--ln);border-radius:14px;background:var(--p1);margin-bottom:8px;cursor:pointer;border-left:4px solid var(--mu)}
.job.c-Confirmed{border-left-color:var(--ac)}.job.c-InProgress{border-left-color:var(--wa)}.job.c-Completed{border-left-color:var(--ok)}.job.c-Pending{border-left-color:var(--wa)}.job.c-Cancelled{opacity:.55;border-left-color:var(--bd)}
.job .t{min-width:52px;font-family:Sora;font-weight:700}.job .t small{display:block;font-family:Inter;font-weight:500;color:var(--mu);font-size:11.5px}
.reg{background:#f5c518;color:#000;font-family:Sora;font-weight:700;padding:1px 7px;border-radius:5px;font-size:12.5px;letter-spacing:.03em}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.chip{border:1px solid var(--ln);border-radius:10px;padding:7px 4px;text-align:center;font-size:12.5px;background:var(--p2)}.chip b{display:block;font-family:Sora;font-size:14px}.chip.free{border-color:rgba(34,197,94,.5)}.chip.busy{border-color:rgba(239,68,68,.4);opacity:.75}.chip.off{opacity:.4;text-decoration:line-through}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.mcell{min-height:62px;background:var(--p1);border:1px solid var(--ln);border-radius:10px;padding:5px;font-size:11px;cursor:pointer}.mcell.dim{opacity:.35}.mcell.td{border-color:var(--ac)}.mcell.off{background:rgba(239,68,68,.06)}.mcell b{font-family:Sora;font-size:13px}.mcell .n{display:block;margin-top:4px;color:var(--ac);font-weight:700}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.sheet .in{background:var(--p1);border:1px solid var(--ln);border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:18px 16px calc(24px + var(--sb));animation:up .2s ease}
@media(min-width:700px){.sheet{align-items:center}.sheet .in{border-radius:20px;max-height:88vh}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet .x{float:right;width:34px;height:34px;border-radius:50%;border:1px solid var(--ln);background:var(--p2)}
.sum{background:var(--p2);border-radius:12px;padding:12px}.sum .l{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}.sum .t{font-weight:700;border-top:1px solid var(--ln);margin-top:6px;padding-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + var(--sb));z-index:90;background:#fff;color:#000;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw;text-align:center}
.toast.err{background:#fecaca;color:#7f1d1d}
.sw{position:relative;display:inline-block;width:46px;height:26px;flex:none}.sw input{opacity:0;width:0;height:0}.sw span{position:absolute;inset:0;background:var(--p3);border:1px solid var(--ln);border-radius:999px;transition:.15s}.sw span:before{content:'';position:absolute;width:20px;height:20px;left:2px;top:2px;border-radius:50%;background:#fff;transition:.15s}.sw input:checked+span{background:var(--ok);border-color:var(--ok)}.sw input:checked+span:before{transform:translateX(20px)}
.kpi .k{font-size:12px;color:var(--mu)}.kpi .v{font-family:Sora;font-size:22px;font-weight:700}
.list .it{padding:11px 0;border-bottom:1px solid var(--ln);cursor:pointer}.list .it:last-child{border-bottom:0}
.empty{padding:26px;text-align:center;color:var(--mu)}
.spin{width:22px;height:22px;border:3px solid var(--ln);border-top-color:var(--ac);border-radius:50%;animation:sp 0.8s linear infinite;margin:30px auto}@keyframes sp{to{transform:rotate(360deg)}}
.banner{border-radius:14px;padding:12px 14px;font-size:13.5px;border:1px solid}.banner.off{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.45)}.banner.on{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.4)}
.sug{background:var(--p2);border:1px solid var(--ln);border-radius:10px;margin-top:4px;max-height:220px;overflow:auto}.sug div{padding:9px 12px;border-bottom:1px solid var(--ln);cursor:pointer}.sug div:last-child{border-bottom:0}
.thumb{width:96px;height:56px;border-radius:8px;background:var(--p3) center/cover;flex:none;border:1px solid var(--ln)}.thumb.sq{width:64px;height:64px}
.up{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--ln);border-radius:12px;padding:16px;color:var(--mu);font-weight:600;cursor:pointer;text-align:center}.up input{display:none}
.fab{position:fixed;right:16px;bottom:calc(84px + var(--sb));z-index:25;display:none;align-items:center;gap:6px;background:var(--ac);color:#fff;border:0;border-radius:999px;padding:13px 18px 13px 14px;font-weight:700;box-shadow:0 10px 28px rgba(47,123,255,.5)}.fab svg{width:20px;height:20px}
.subtabs{display:flex;background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:3px;margin-bottom:12px}.subtabs button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font-weight:600;color:var(--mu)}.subtabs button.on{background:var(--tx);color:#000}
.upbox{margin-top:8px;background:var(--p2);border-radius:10px;padding:8px 10px}
.phgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.ph{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1}.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}.ph span{position:absolute;left:5px;bottom:5px;font-size:10px;font-weight:700;background:rgba(0,0,0,.65);padding:2px 6px;border-radius:6px}.ph button{position:absolute;right:4px;top:4px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:22px;height:22px;font-size:11px}
.ppdots{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 6px}.ppdots i{width:14px;height:14px;border-radius:50%;background:var(--ac);display:block}.ppdots i.u{background:transparent;border:2px solid var(--ln)}
.inv{background:#fff;color:#111;border-radius:14px;padding:22px;font-size:14px;line-height:1.45}.inv .im{font-size:12.5px;color:#555}.inv .ih{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#888;margin-bottom:3px}.inv .ititle{font-size:22px;font-weight:800;letter-spacing:.08em;color:var(--ac,#2563eb)}.inv .ibar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;background:#f5f6f8;border-radius:10px;padding:10px 12px}.inv .ibar span{display:block;font-size:11px;color:#777}.inv .ibar b{font-size:13px}.inv tr.it td{font-weight:800}.inv .ipay{margin-top:16px;border:1px solid #e5e7eb;border-radius:12px;padding:12px 14px}.inv .ipg{display:grid;grid-template-columns:1fr 1fr;gap:14px}.inv .ithanks{text-align:center;margin-top:18px;padding-top:12px;border-top:1px solid #eee;font-weight:600;color:#333}@media(max-width:420px){.inv .ipg{grid-template-columns:1fr}}.inv table{width:100%;border-collapse:collapse;margin-top:12px}.inv td,.inv th{padding:7px 0;border-bottom:1px solid #e5e7eb;text-align:left}.inv .r{text-align:right}.inv h3{color:#111}
@media print{body *{visibility:hidden!important}#inv,#inv *{visibility:visible!important}#inv{position:absolute;left:0;top:0;width:100%;border-radius:0}.nav,.top,.fab{display:none!important}}
.auth{max-width:400px;margin:0 auto;padding:calc(50px + var(--st)) 20px 40px}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;margin:6px 2px 8px;font-weight:700;font-size:15px;font-family:inherit}
</style>

<body>
<div id="app"><div class="spin"></div></div>
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================= helpers ================= */
const CFG=window.VALETIQ||{};
const $=id=>document.getElementById(id);const val=id=>{const e=$(id);return e?e.value.trim():''};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const addM=(s,n)=>{const d=pd(s);d.setDate(1);d.setMonth(d.getMonth()+n);return ymd(d)};
const TODAY=()=>ymd(new Date());const hm=t=>(t||'').slice(0,5);const tm=s=>{const[h,m]=hm(s).split(':').map(Number);return h*60+m};const ft=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fd=s=>{const d=pd(s);return`${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`};const fdy=s=>{const d=pd(s);return`${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`};
const gbp=n=>{n=Math.round((+n||0)*100)/100;const neg=n<0;n=Math.abs(n);return(neg?'-':'')+'£'+n.toLocaleString('en-GB',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})};
const r2=n=>Math.round(n*100)/100;const intl=m=>{m=(m||'').replace(/\D/g,'');return m.startsWith('0')?'44'+m.slice(1):m};
const SIZES=['Small','Medium','Large'];const STATUSES=['Booked','Confirmed','In Progress','Completed','Cancelled'];const CATS=['Valeting','Detailing','Additional Services'];
const normM=t=>{let d=(t||'').replace(/\D/g,'');if(!d)return'';if(d.startsWith('0044'))return'0'+d.slice(4);if(d.startsWith('44')&&d.length>=12)return'0'+d.slice(2);if(d.startsWith('7')&&d.length===10)return'0'+d;return d};
const NOEMAIL='@no-email.invalid';const noEmail=m=>{const d=(m||'').replace(/\D/g,'');return(d?d:'nm'+Date.now().toString(36)+Math.random().toString(36).slice(2,6))+NOEMAIL};const showEmail=e=>e&&e.endsWith(NOEMAIL)?'':e;
function toast(m,err){const e=document.createElement('div');e.className='toast'+(err?' err':'');e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),err?4500:2600)}
function sheet(html){closeSheet();const s=document.createElement('div');s.className='sheet';s.id='sheet';s.innerHTML=`<div class="in"><button class="x" onclick="closeSheet()" aria-label="Close">✕</button>${html}</div>`;s.addEventListener('click',e=>{if(e.target===s)closeSheet()});document.body.appendChild(s)}
function closeSheet(){const s=$('sheet');if(s)s.remove()}
let _cf=null;function confirmBox(msg,fn,yes='Yes'){_cf=fn;sheet(`<h3>Are you sure?</h3><p class="mu">${msg}</p><div class="row"><button class="btn bad" onclick="closeSheet();_cf&&_cf()">${yes}</button><button class="btn" onclick="closeSheet()">Back</button></div>`)}
const errMsg=e=>(e&&(e.message||e.error_description))||String(e);
const ICON={inv:'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h5',web:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z',home:'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',diary:'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z',plus:'M12 5v14M5 12h14',users:'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75',gear:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z'};
const ico=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${ICON[k]}"/></svg>`;

/* ================= state ================= */
const sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const S={user:null,biz:null,services:[],slots:[],blocked:[],view:'home',date:TODAY(),dv:'day',cq:'',cust:null};
const svcById=id=>S.services.find(s=>s.id===id);
const priceFor=(s,size)=>size==2?(s.price_large??s.price_medium??s.price_small):size==1?(s.price_medium??s.price_small):s.price_small;
const isWork=d=>{const wd=S.biz.settings.workDays||[1,2,3,4,5,6];return wd.includes(pd(d).getDay())&&!S.blocked.some(b=>d>=b.from_date&&d<=b.to_date)};
const blockedReason=d=>(S.blocked.find(b=>d>=b.from_date&&d<=b.to_date)||{}).reason;
const paid=(b,pays)=>r2(pays.filter(p=>p.booking_id===b.id).reduce((s,p)=>s+ +p.amount,0));
const owed=(b,pays)=>b.status==='Cancelled'?0:Math.max(0,r2(+b.total-paid(b,pays)));
const endMin=b=>b.days>0?tm(S.biz.settings.hours?.end||'18:00'):tm(b.start_time)+b.duration_mins;

/* ================= boot / auth ================= */
async function boot(){
 if('serviceWorker' in navigator)navigator.serviceWorker.register('/admin/sw.js').catch(()=>{});
 const{data:{session}}=await sb.auth.getSession();
 sb.auth.onAuthStateChange((ev,ses)=>{if(ev==='PASSWORD_RECOVERY')return newPassword();if(ev==='SIGNED_OUT'){S.user=null;renderAuth()}});
 if(location.hash.includes('type=recovery'))return newPassword();
 if(!session)return renderAuth();
 S.user=session.user;await loadBiz()}
function renderAuth(mode='login'){
 $('app').innerHTML=`<div class="auth"><div style="text-align:center;margin-bottom:22px"><div class="badge" style="width:64px;height:64px;font-size:22px;margin:0 auto 12px">BC</div><h2>B Clean Admin</h2><p class="mu">${mode==='signup'?'Create your admin login':'Sign in to manage your diary and bookings'}</p></div>
 <div class="card"><label class="f">Email</label><input id="ae" type="email" autocomplete="email" inputmode="email"><label class="f">Password</label><input id="ap" type="password" autocomplete="${mode==='signup'?'new-password':'current-password'}">
 ${mode==='signup'?'<p class="tiny mu" style="margin-top:8px">At least 8 characters. You\'ll get an email to confirm your address.</p>':''}
 <button class="btn pri block" style="margin-top:14px" onclick="${mode==='signup'?'doSignup()':'doLogin()'}">${mode==='signup'?'Create login':'Sign in'}</button>

async function fetchBookings(from,to){const{data,error}=await sb.from('bookings').select('*, customers(id,first_name,last_name,mobile,email,vip), vehicles(reg,make,model,colour)').eq('business_id',S.biz.id).gte('date',addD(from,-3)).lte('date',to).order('date').order('start_time');if(error)throw error;
 const L=data.filter(b=>{const end=b.days>0?addD(b.date,b.days-1):b.date;return end>=from&&b.date<=to});
 const ids=L.map(b=>b.id);let pays=[];if(ids.length){for(let i=0;i<ids.length;i+=150){const r=await sb.from('payments').select('*').in('booking_id',ids.slice(i,i+150));if(r.error)throw r.error;pays=pays.concat(r.data)}}return{L,pays}}
const covers=(b,d)=>b.days>0?(d>=b.date&&d<=addD(b.date,b.days-1)):b.date===d;

async function vInvoices(){const f=S.if||'owed';const t=TODAY();let from,to,label;
 if(f==='owed'){from=addD(t,-400);to=addD(t,120)}else{const d=pd(S.im||t);from=ymd(new Date(d.getFullYear(),d.getMonth(),1));to=ymd(new Date(d.getFullYear(),d.getMonth()+1,0));label=`${MON[d.getMonth()]} ${d.getFullYear()}`}
 const{L,pays}=await fetchBookings(from,to);let rows=L.filter(b=>b.status!=='Cancelled'&&+b.total>0);
 if(f==='owed')rows=rows.filter(b=>owed(b,pays)>0&&(b.date<=t||paid(b,pays)>0||b.status==='Completed'));if(f==='paid')rows=rows.filter(b=>owed(b,pays)===0);
 rows.sort((a,b)=>f==='owed'?(a.date<b.date?-1:1):(a.date<b.date?1:-1));
 const totOwed=r2(rows.reduce((s,b)=>s+owed(b,pays),0)),totVal=r2(rows.reduce((s,b)=>s+ +b.total,0)),totPaid=r2(rows.reduce((s,b)=>s+paid(b,pays),0));

 <div class="subtabs">${[['owed','To collect'],['paid','Paid'],['all','All']].map(x=>`<button class="${f===x[0]?'on':''}" onclick="S.if='${x[0]}';go('invoices')">${x[1]}</button>`).join('')}</div>
 ${f!=='owed'?`<div class="row" style="margin-bottom:10px"><button class="btn sm" onclick="S.im=addM(S.im||TODAY(),-1);go('invoices')">‹</button><b style="flex:1;text-align:center">${label}</b><button class="btn sm" onclick="S.im=addM(S.im||TODAY(),1);go('invoices')">›</button></div>`:''}
 <div class="grid g3" style="margin-bottom:12px">${f==='owed'?`<div class="card kpi" style="grid-column:1/-1"><div class="k">Outstanding (jobs done or due)</div><div class="v" style="color:${totOwed?'#fca5a5':'inherit'}">${gbp(totOwed)}</div><div class="tiny mu">${rows.length} invoice${rows.length===1?'':'s'}</div></div>`:`<div class="card kpi"><div class="k">Invoiced</div><div class="v">${gbp(totVal)}</div></div><div class="card kpi"><div class="k">Paid</div><div class="v">${gbp(totPaid)}</div></div><div class="card kpi"><div class="k">Owed</div><div class="v">${gbp(totOwed)}</div></div>`}</div>
 <div class="card list" style="padding:4px 14px">${rows.map(b=>{const c=b.customers||{};const ow=owed(b,pays);return`<div class="it" onclick="openInvoice('${b.id}')"><div class="row"><b>INV-${esc(b.ref)}</b><span class="sp"></span><b>${gbp(b.total)}</b></div><div class="row tiny"><span class="mu">${fdy(b.date)} · ${esc((c.first_name||'')+' '+(c.last_name||''))} · ${esc(b.service_name)}</span><span class="sp"></span>${ow?`<span class="pill p-bd">owes ${gbp(ow)}</span>`:'<span class="pill p-ok">paid</span>'}</div></div>`}).join('')||`<div class="empty">${f==='owed'?'Nothing to collect 🎉':'No invoices this month.'}</div>`}</div>`}
async function openInvoice(id){sheet('<div class="spin"></div>');const[{data:b,error},{data:pays},{data:links}]=await Promise.all([sb.from('bookings').select('*, customers(*), vehicles(*)').eq('id',id).single(),sb.from('payments').select('*').eq('booking_id',id).order('created_at'),sb.from('payment_links').select('*').eq('booking_id',id).is('paid_at',null).order('created_at',{ascending:false}).limit(1)]);
 if(error)return sheet(`<p>${esc(errMsg(error))}</p>`);const st=S.biz.settings,c=b.customers||{},v=b.vehicles||{},I=invCfg(),br=st.brand||{};const ow=owed(b,pays||[]);const isRec=ow===0;const no='INV-'+b.ref;
 const today=TODAY(),due=addD(today,I.dueDays);const lk=(links||[])[0];const card=lk&&+lk.amount_pence===Math.round(ow*100)&&(!lk.id.startsWith('cs_')||Date.now()-new Date(lk.created_at)<22*3600e3)?lk.url:'';
 const when=`${fdy(b.date)} · ${b.days>0?'all day':hm(b.start_time)}`;
 const lines=[[`${b.service_name}${b.size!=null?' ('+SIZES[b.size]+')':''}`,when,+b.price],...(+b.callout?[['Call-out charge','',+b.callout]]:[]),...(+b.discount?[['Discount','',-b.discount]]:[])];
 const text=`${S.biz.name} — ${isRec?'Receipt':'Invoice'} ${no}\n${b.service_name} · ${when}\n\nTotal: ${gbp(b.total)}\nPaid: ${gbp(paid(b,pays||[]))}\n${isRec?'Paid in full — thank you!':'Balance due: '+gbp(ow)+(I.dueDays?' by '+fdy(due):' on receipt')}${!isRec&&card?'\n\nPay by card: '+card:''}${!isRec&&I.hasBank?'\n\nOr pay by '+bankText(b.ref).replace(/^Bank transfer/,'bank transfer'):''}\n\n${I.thanks}`;
 const logo=br.logo?`<img src="${esc(br.logo)}" alt="" style="width:56px;height:56px;object-fit:contain;border-radius:12px">`:`<div class="badge" style="width:48px;height:48px">${esc((S.biz.name.match(/\b\w/g)||['V']).join('').slice(0,2).toUpperCase())}</div>`;
 sheet(`<div id="inv" class="inv">
 <div class="row" style="align-items:flex-start;gap:12px">${logo}<div style="flex:1;min-width:0"><b style="font-size:18px">${esc(S.biz.name)}</b><div class="im">${I.address?esc(I.address)+'<br>':''}${esc(st.phone||'')}${st.email?'<br>'+esc(st.email):''}</div></div>
 <div style="text-align:right"><div class="ititle">${isRec?'RECEIPT':'INVOICE'}</div><div class="im">${no}</div></div></div>
 <div class="ibar"><div><span>Invoice date</span><b>${fdy(today)}</b></div><div><span>${isRec?'Status':'Due'}</span><b style="color:${isRec?'#15803d':'#111'}">${isRec?'Paid':I.dueDays?fdy(due):'On receipt'}</b></div><div><span>Booking ref</span><b>${esc(b.ref)}</b></div></div>
 <div class="row" style="align-items:flex-start;margin-top:14px;gap:14px"><div style="flex:1"><div class="ih">Billed to</div>${esc(c.first_name+' '+(c.last_name||''))}${c.mobile?'<br>'+esc(c.mobile):''}${showEmail(c.email)?'<br>'+esc(c.email):''}</div><div style="flex:1"><div class="ih">Service at</div>${esc(b.address||'—')}${b.postcode?'<br>'+esc(b.postcode):''}${v.reg?`<br>${esc(v.reg)} ${esc([v.make,v.model].filter(Boolean).join(' '))}`:''}</div></div>
 <table><tr><th>Description</th><th class="r">Amount</th></tr>${lines.map(l=>`<tr><td>${esc(l[0])}${l[1]?`<div class="im">${esc(l[1])}</div>`:''}</td><td class="r">${gbp(l[2])}</td></tr>`).join('')}
 <tr class="it"><td>Total</td><td class="r">${gbp(b.total)}</td></tr>${(pays||[]).map(p=>`<tr><td class="im">${+p.amount<0?'Refund':p.type==='deposit'?'Deposit paid':'Paid'} · ${new Date(p.created_at).toLocaleDateString('en-GB')} · ${esc(p.method)}</td><td class="r im">${gbp(-p.amount)}</td></tr>`).join('')}
 <tr class="it"><td>${isRec?'Paid in full':'Balance due'}</td><td class="r" style="color:${ow?'#b91c1c':'#15803d'}">${gbp(ow)}</td></tr></table>
 ${isRec?'':`<div class="ipay"><div class="ih">How to pay</div><div class="ipg">${card?`<div><b>💳 Card, Apple Pay or Google Pay</b><div class="im">Pay securely online:<br><a href="${esc(card)}" style="word-break:break-all">${esc(card.length>48?card.slice(0,48)+'…':card)}</a></div></div>`:`<div><b>💳 Card</b><div class="im">Ask us for a secure payment link.</div></div>`}${I.hasBank?`<div><b>🏦 Bank transfer</b><div class="im">${I.accName?esc(I.accName)+'<br>':''}Sort code <b>${esc(I.sortCode)}</b><br>Account <b>${esc(I.accNo)}</b><br>Reference <b>${esc(b.ref)}</b></div></div>`:''}</div></div>`}
 <div class="ithanks">${esc(I.thanks)}</div></div>
 <div class="grid g2" style="margin-top:12px">${ow?`<button class="btn pri" onclick="payLink('${b.id}')">${card?'Send invoice + card link':'Create card link & send'} (${gbp(ow)})</button><button class="btn" onclick="payBox('${b.id}',${ow})">Record payment</button>`:''}${c.mobile?`<a class="btn wa" href="https://wa.me/${intl(c.mobile)}?text=${encodeURIComponent(text)}">Send on WhatsApp</a>`:''}${showEmail(c.email)?`<a class="btn" href="mailto:${esc(c.email)}?subject=${encodeURIComponent(`${S.biz.name} ${isRec?'receipt':'invoice'} ${no}`)}&body=${encodeURIComponent(text)}">Email</a>`:''}<button class="btn" onclick="window.print()">Print / Save PDF</button></div>
 ${!I.hasBank&&ow?`<p class="tiny mu" style="margin-top:8px">Add your bank details in Settings → Business to offer bank transfer too.</p>`:''}`)}

const AALERTS=[['registration','New registration','Someone creates an account on your website or app'],['newBooking','New booking','A customer books online'],['newPayment','Payment received','A deposit, balance or card payment comes in']];
function pushState(){if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window))return'unsupported';return Notification.permission}
function adminAlertsHTML(st){const A=st.adminAlerts||{};const ps=pushState();const ios=/iphone|ipad/i.test(navigator.userAgent)&&!navigator.standalone;
 return`<div class="sect-h"><span>🔔 Admin notifications</span><span class="tiny mu">sent to you</span></div>

async function alertSet(k,f,v){const A={...(S.biz.settings.adminAlerts||{})};A[k]={inapp:true,push:true,email:false,...(A[k]||{}),[f]:v};if(await saveSettings({adminAlerts:A}))toast(v?'Switched on':'Switched off')}
function b64u(s){const p='='.repeat((4-s.length%4)%4);const r=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0))}
async function enablePush(test){try{const key=(window.VALETIQ||{}).vapidPublicKey;if(!key)throw new Error('Push not configured');
 const perm=await Notification.requestPermission();if(perm!=='granted'){toast('Notifications not allowed',1);return go('notif')}
 const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(key)});
 const j=sub.toJSON();const{data:{user}}=await sb.auth.getUser();
 const{error}=await sb.from('push_subscriptions').upsert({user_id:user.id,business_id:S.biz.id,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,ua:navigator.userAgent.slice(0,200)},{onConflict:'endpoint'});if(error)throw error;
 const{error:e2}=await sb.from('notifications').insert({business_id:S.biz.id,kind:'test',text:'You\'ll get a ping here for new registrations, bookings and payments.'});if(e2)throw e2;
 toast(test?'Test sent — check your notifications':'Phone alerts are on');go('notif')}catch(e){toast(errMsg(e),1)}}
async function msgSet(k,f,v){const M={...(S.biz.settings.messages||{})};M[k]={...(M[k]||{title:(MSGS.find(x=>x[0]===k)||[])[1]}),[f]:v};if(await saveSettings({messages:M}))toast(f==='on'?(v?'Switched on':'Switched off'):'Saved')}
function squarePng(file,size,pad,bg){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');if(bg){x.fillStyle=bg;x.fillRect(0,0,size,size)}const inner=size*(1-pad*2);const sc=Math.min(inner/im.width,inner/im.height);const w=im.width*sc,h=im.height*sc;x.drawImage(im,(size-w)/2,(size-h)/2,w,h);c.toBlob(b=>b?res(b):rej(new Error('Could not process image')),'image/png')};im.onerror=()=>rej(new Error('Could not read image — try a PNG or JPG'));im.src=fr.result};fr.readAsDataURL(file)})}
async function uploadLogo(f){if(!f)return;const done=busy('Branding your website & apps…');try{const v=Date.now();const out={};const bg=(S.biz.settings.brand||{}).bg||'#07080a';
 for(const[k,size,pad,b] of [['logo',600,0,null],['icon512',512,.06,bg],['icon192',192,.06,bg],['icon180',180,.06,bg],['maskable',512,.16,bg],['favicon',64,0,null]]){const blob=await squarePng(f,size,pad,b);const path=`${S.biz.id}/brand/${k}-${v}.png`;const{error}=await sb.storage.from('media').upload(path,blob,{contentType:'image/png',cacheControl:'31536000'});if(error)throw error;out[k]=sb.storage.from('media').getPublicUrl(path).data.publicUrl}
 out.bg=bg;if(await saveSettings({brand:{...(S.biz.settings.brand||{}),...out}})){applyBrand();toast('Logo updated on your website & apps');go('website')}}catch(e){toast(errMsg(e),1)}done()}
async function removeLogo(){confirmBox('Remove your logo? The website and apps go back to the initials badge.',async()=>{if(await saveSettings({brand:{}})){applyBrand();go('website')}},'Remove')}
async function saveBrand(){const patch={...(S.biz.settings.brand||{}),showName:$('bshow').checked,accent:val('bacc')};if(await saveSettings({brand:patch,accent:val('bacc')})){applyBrand();toast('Saved — live on your website')}}
function applyBrand(){const br=(S.biz&&S.biz.settings.brand)||{};const set=(sel,attr,v)=>{const e=document.querySelector(sel);if(e&&v)e.setAttribute(attr,v)};
 set('link[rel=apple-touch-icon]','href',br.icon180);set('link[rel=icon]','href',br.favicon||br.icon192);
 if(br.icon512){try{const man={name:S.biz.name+' Admin',short_name:S.biz.name+' Admin',start_url:location.origin+'/admin/',scope:location.origin+'/admin/',display:'standalone',background_color:'#07080a',theme_color:'#07080a',icons:[{src:br.icon192,sizes:'192x192',type:'image/png'},{src:br.icon512,sizes:'512x512',type:'image/png'},{src:br.maskable||br.icon512,sizes:'512x512',type:'image/png',purpose:'maskable'}]};
  const l=document.querySelector('link[rel=manifest]');l.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}))}catch(e){}}
 const bd=document.querySelector('.top .badge');if(bd){if(br.icon180){bd.style.background=`#07080a url('${br.icon180}') center/cover`;bd.textContent=''}}}

/* ================= WEBSITE ================= */
function resizeImg(file,max){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(new Error('Could not read that file'));fr.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error('Could not process image')),'image/jpeg',.84)};im.onerror=()=>rej(new Error('Could not read image — try a JPG or PNG'));im.src=fr.result};fr.readAsDataURL(file)})}
async function uploadImg(file,folder,max){const blob=await resizeImg(file,max);const path=`${S.biz.id}/${folder}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
 const{error}=await sb.storage.from('media').upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000'});if(error)throw error;return sb.storage.from('media').getPublicUrl(path).data.publicUrl}
function busy(msg){const e=document.createElement('div');e.id='busy';e.className='sheet';e.innerHTML=`<div class="in" style="text-align:center"><div class="spin" style="margin:10px auto"></div><b>${esc(msg)}</b></div>`;document.body.appendChild(e);return()=>e.remove()}
async function galSet(id,k,v){const{error}=await sb.from('gallery_items').update({[k]:v}).eq('id',id);if(error)return toast(errMsg(error),1);toast('Saved')}
async function galDel(id){const{error}=await sb.from('gallery_items').delete().eq('id',id);if(error)return toast(errMsg(error),1);go('website')}
function ogImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.crossOrigin='anonymous';i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src+(src.includes('?')?'&':'?')+'cb='+Date.now()})}
async function ogPreview(){const c=$('ogc');if(!c)return;const x=c.getContext('2d'),st=S.biz.settings,br=st.brand||{},W=1200,H=630,ac=st.accent||'#2f7bff';
 const hero=((st.heroSlides||[])[0]||{}).img||((st.heroSlides||[])[0]||'');const[img,logo]=await Promise.all([ogImg(typeof hero==='string'?hero:hero.img),ogImg(br.logo)]);
 x.fillStyle='#0b0d12';x.fillRect(0,0,W,H);if(img){const r=Math.max(W/img.width,H/img.height),w=img.width*r,h=img.height*r;x.drawImage(img,(W-w)/2,(H-h)/2,w,h)}
 const g=x.createLinearGradient(0,0,W,0);g.addColorStop(0,'rgba(5,6,9,.9)');g.addColorStop(.6,'rgba(5,6,9,.55)');g.addColorStop(1,'rgba(5,6,9,.15)');x.fillStyle=g;x.fillRect(0,0,W,H);
 let y=150;if(logo){const s=110;x.drawImage(logo,70,y-40,s,s*logo.height/logo.width);y+=110}
 const nm=S.biz.name.split(' ');x.font='800 92px Sora, Inter, sans-serif';x.fillStyle='#fff';x.fillText(nm[0],70,y+60);if(nm.length>1){const w0=x.measureText(nm[0]+' ').width;x.fillStyle=ac;x.fillText(nm.slice(1).join(' '),70+w0,y+60)}
 x.font='600 34px Inter, sans-serif';x.fillStyle='#d6dbe6';x.fillText(st.tagline||'Mobile valeting & detailing',70,y+120);
 x.fillStyle=ac;const bx=70,by=y+170,bw=360,bh=78;x.beginPath();x.roundRect?x.roundRect(bx,by,bw,bh,39):x.rect(bx,by,bw,bh);x.fill();x.font='800 32px Inter, sans-serif';x.fillStyle='#fff';x.fillText('Book your visit →',bx+40,by+50);
 x.font='600 30px Inter, sans-serif';x.fillStyle='#fff';x.fillText(location.host,bx+bw+30,by+50)}
async function ogSave(){const c=$('ogc');if(!c)return;let blob;try{blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.88))}catch(e){blob=null}if(!blob)return toast('Could not create image — try re-uploading your hero photo',1);const done=busy('Saving…');
 const{error}=await sb.storage.from('media').upload(`${S.biz.id}/brand/og.jpg`,blob,{upsert:true,contentType:'image/jpeg',cacheControl:'300'});done();if(error)return toast(errMsg(error),1);await saveSettings({ogImage:Date.now()});toast('Share image saved ✓');go('website')}
async function vWebsite(){const st=S.biz.settings;const tab=S.wt||'brand';let body='';
 if(tab==='gallery'){const{data:G}=await sb.from('gallery_items').select('*').eq('business_id',S.biz.id).order('created_at',{ascending:false});
  body=`<div class="card"><h3>Before & after gallery</h3><p class="tiny mu">Shown on your homepage. Add new ones from any booking: open it → Before & after photos → Add to website.</p>${(G||[]).length?(G||[]).map(g=>`<div class="row" style="padding:10px 0;border-top:1px solid var(--ln);gap:8px"><img src="${esc(g.before_url)}" style="width:54px;height:54px;object-fit:cover;border-radius:8px"><img src="${esc(g.after_url)}" style="width:54px;height:54px;object-fit:cover;border-radius:8px"><input value="${esc(g.title)}" style="flex:1" onchange="galSet('${g.id}','title',this.value)"><label class="sw"><input type="checkbox" ${g.show?'checked':''} onchange="galSet('${g.id}','show',this.checked)"><span></span></label><button class="btn xs bad" onclick="galDel('${g.id}')">✕</button></div>`).join(''):'<p class="tiny mu">Nothing yet.</p>'}</div>`}
 if(tab==='brand'){const br=st.brand||{};const ini=esc((S.biz.name.match(/\b\w/g)||['V']).join('').slice(0,2).toUpperCase());
  setTimeout(ogPreview,50);
  body=`<div class="card" style="margin-bottom:12px"><h3>Social share image</h3><p class="tiny mu">What people see when your website link is shared on Facebook, WhatsApp, Instagram etc. Uses your first hero photo, name and logo.</p><canvas id="ogc" width="1200" height="630" style="width:100%;border-radius:12px;border:1px solid var(--ln);background:#111"></canvas><button class="btn sm pri" style="margin-top:8px" onclick="ogSave()">Save as share image</button>${st.ogImage?`<span class="tiny mu" style="margin-left:8px">✓ Saved ${new Date(st.ogImage).toLocaleDateString('en-GB')}</span>`:''}</div>
  <div class="card" style="margin-bottom:12px"><h3>Logo</h3><p class="tiny mu">Shown in your website header, as the icon in browser tabs, and as the app icon when customers (and you) add your app to the home screen. A square PNG with a transparent or dark background looks best.</p>
  <div style="background:#07080a;border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px"><div class="tiny mu" style="margin-bottom:8px">Website header preview</div><div class="row" style="flex-wrap:nowrap">${br.logo?`<img src="${esc(br.logo)}" style="height:44px;width:44px;object-fit:contain;border-radius:10px">`:`<div class="badge" style="width:40px;height:40px">${ini}</div>`}${br.showName!==false?`<b style="font-family:Sora;font-size:19px">${esc(S.biz.name)}</b>`:''}<span class="sp"></span><span class="btn xs pri">Book now</span></div></div>
  <div class="row"><label class="btn pri">${br.logo?'Change logo':'Upload logo'}<input type="file" accept="image/*" style="display:none" onchange="uploadLogo(this.files[0])"></label>${br.logo?`<button class="btn" onclick="removeLogo()">Remove</button>`:''}</div>
  ${br.icon180?`<div class="row" style="margin-top:12px"><div style="text-align:center"><img src="${esc(br.icon180)}" style="width:60px;height:60px;border-radius:14px"><div class="tiny mu">App icon</div></div><div style="text-align:center"><img src="${esc(br.favicon||br.icon192)}" style="width:32px;height:32px;border-radius:6px;margin:14px"><div class="tiny mu">Browser tab</div></div></div>`:''}</div>
  <div class="card" style="margin-bottom:12px"><h3>Style</h3><label class="row tiny" style="gap:8px"><input type="checkbox" id="bshow" ${br.showName!==false?'checked':''}> Show business name next to the logo</label><label class="f">Brand colour (buttons, highlights, the blue part of your title)</label><div class="row"><input type="color" id="bacc" value="${esc(st.accent||br.accent||'#2f7bff')}" style="width:70px;height:44px;padding:4px"><span class="tiny mu">Currently ${esc(st.accent||'#2f7bff')}</span></div><button class="btn pri" style="margin-top:12px" onclick="saveBrand()">Save style</button></div>
  <p class="tiny mu">Existing home-screen icons update when the app is removed and added again — that's how iPhones and Android work.</p>`}
 if(tab==='home'){const slides=st.heroSlides||[];const stats=[0,1,2,3].map(i=>(st.stats||[])[i]||{v:'',l:''});
  body=`<div class="card" style="margin-bottom:12px"><h3>Slideshow photos</h3><p class="tiny mu">The big photos at the top of your homepage. Landscape photos work best — keep the car in the centre or right. They change every few seconds.</p>
  <div class="col">${slides.map((h,i)=>`<div class="row" style="background:var(--p2);border-radius:12px;padding:8px;flex-wrap:nowrap"><div class="thumb" style="background-image:url('${esc(h.url)}')"></div><div style="flex:1;min-width:0" class="tiny mu">Photo ${i+1}</div><button class="btn xs" ${i?'':'disabled'} onclick="moveSlide(${i},-1)">↑</button><button class="btn xs" ${i<slides.length-1?'':'disabled'} onclick="moveSlide(${i},1)">↓</button><button class="btn xs bad" onclick="delSlide(${i})">✕</button></div>`).join('')||'<p class="tiny mu">No photos yet — the website shows a placeholder until you add some.</p>'}</div>
  <label class="up" style="margin-top:10px">📷 Add photos (you can pick several)<input type="file" accept="image/*" multiple onchange="addSlides(this.files)"></label></div>
  <div class="card" style="margin-bottom:12px"><h3>Business name & description</h3><div class="grid g2"><div><label class="f">Name — white</label><input id="hw" value="${esc(st.heroWhite||'')}" placeholder="B Clean"></div><div><label class="f">Name — blue</label><input id="hb" value="${esc(st.heroBlue||'')}" placeholder="Valeting"></div></div><label class="f">Description</label><textarea id="hd">${esc(st.heroDesc||'')}</textarea>
  <label class="f">Highlights (up to 4, e.g. "5+" / "years in business")</label>${stats.map((x,i)=>`<div class="grid g2" style="margin-bottom:6px"><input id="sv${i}" value="${esc(x.v)}" placeholder="Value"><input id="sl${i}" value="${esc(x.l)}" placeholder="Label"></div>`).join('')}
  <button class="btn pri" style="margin-top:8px" onclick="saveHomeText()">Save</button></div>`}
 if(tab==='services')body=`<p class="tiny mu">Each service card on the homepage has its own photo and description. Prices and durations are in Settings.</p>${S.services.map(s=>`<div class="card" style="margin-bottom:10px"><div class="row" style="flex-wrap:nowrap"><div class="thumb sq" style="background-image:${s.image_url?`url('${esc(s.image_url)}')`:'none'}">${s.image_url?'':'<div class="tiny mu" style="text-align:center;padding-top:20px">No photo</div>'}</div><div style="flex:1;min-width:0"><b>${esc(s.name)}</b><div class="tiny mu">${esc(s.category)}${s.active?'':' · hidden'}</div><div class="row" style="margin-top:6px"><label class="btn xs">${s.image_url?'Change photo':'Add photo'}<input type="file" accept="image/*" style="display:none" onchange="svcPhoto('${s.id}',this.files[0])"></label>${s.image_url?`<button class="btn xs" onclick="svcField('${s.id}','image_url',null).then(()=>go('website'))">Remove</button>`:''}</div></div></div>
  <label class="f">Description</label><textarea id="sd_${s.id}" style="min-height:56px">${esc(s.description)}</textarea><label class="f">What's included (one per line)</label><textarea id="si_${s.id}" style="min-height:90px">${esc((s.includes||[]).join('\n'))}</textarea><button class="btn sm" style="margin-top:6px" onclick="saveSvcText('${s.id}')">Save</button></div>`).join('')}`;
 if(tab==='offers'){const O=st.offers||[];body=`<p class="tiny mu">The first offer that's switched on shows in the bar under your menu, with a Book now button. When none are on, the bar just says "Book now".</p>${O.map((o,i)=>`<div class="card" style="margin-bottom:10px"><div class="row"><b style="flex:1">${esc(o.title||'Offer')}</b><label class="sw"><input type="checkbox" ${o.active?'checked':''} onchange="offerSet(${i},'active',this.checked)"><span></span></label></div>
  <div class="grid g2"><div><label class="f">Label (e.g. Winter Special)</label><input value="${esc(o.title||'')}" onchange="offerSet(${i},'title',this.value)"></div><div><label class="f">Offer text</label><input value="${esc(o.text||'')}" onchange="offerSet(${i},'text',this.value)" placeholder="15% off a Full Valet"></div><div><label class="f">Service it's for</label><select onchange="offerSet(${i},'serviceId',this.value)">${S.services.filter(s=>s.active).map(s=>`<option value="${s.id}" ${o.serviceId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div><label class="f">Ends</label><input type="date" value="${o.expires||''}" onchange="offerSet(${i},'expires',this.value)"></div></div>
  <button class="btn xs bad" style="margin-top:8px" onclick="offerDel(${i})">Delete offer</button></div>`).join('')}<button class="btn pri" onclick="offerAdd()">+ New offer</button>`}
 if(tab==='info')body=`<div class="card" style="margin-bottom:12px"><h3>FAQs</h3><p class="tiny mu">One per line: <b>Question | Answer</b></p><textarea id="fq" style="min-height:220px">${esc((st.faq||[]).map(f=>f.join(' | ')).join('\n'))}</textarea></div>
  <div class="card" style="margin-bottom:12px"><h3>Policies</h3><label class="f">Terms of service</label><textarea id="pt2">${esc(st.terms||'')}</textarea><label class="f">Cancellation policy</label><textarea id="pc2">${esc(st.cancel||'')}</textarea><label class="f">Refund policy</label><textarea id="pr2">${esc(st.refund||'')}</textarea></div><button class="btn pri block" onclick="saveInfo()">Save FAQs & policies</button>`;
 if(tab==='social'){const so=st.social||{};body=`<div class="card"><p class="tiny mu">Icons appear at the top of your website. Leave blank to hide.</p>${[['facebook','Facebook page link'],['instagram','Instagram link'],['tiktok','TikTok link'],['google','Google reviews link']].map(([k,l])=>`<label class="f">${l}</label><input id="so_${k}" value="${esc(so[k]||'')}" placeholder="https://…">`).join('')}<button class="btn pri" style="margin-top:12px" onclick="saveSocial()">Save</button></div>`}
 $('main').innerHTML=`${subTabs('website')}<div class="row"><h2 style="margin:0">Website</h2><span class="sp"></span><a class="btn sm" href="/" target="_blank" rel="noopener">View site ↗</a></div><p class="tiny mu" style="margin:4px 0 10px">Changes show on bcleanvaleting.co.uk straight away.</p>
 <div class="tabs" style="margin-bottom:12px">${[['brand','Branding'],['home','Homepage'],['services','Service cards'],['offers','Offers'],['info','FAQs & policies'],['social','Social links'],['gallery','Gallery']].map(t=>`<button class="tab ${tab===t[0]?'on':''}" onclick="S.wt='${t[0]}';go('website')">${t[1]}</button>`).join('')}</div>${body}`}
async function addSlides(files){files=[...files];if(!files.length)return;const done=busy(`Uploading ${files.length} photo${files.length>1?'s':''}…`);const urls=[];
 try{for(const f of files)urls.push({url:await uploadImg(f,'hero',1920),caption:''})}catch(e){done();return toast(errMsg(e),1)}
 const ok=await saveSettings({heroSlides:[...(S.biz.settings.heroSlides||[]),...urls]});done();if(ok){toast(`${urls.length} photo${urls.length>1?'s':''} added`);go('website')}}
async function moveSlide(i,d){const L=[...(S.biz.settings.heroSlides||[])];[L[i],L[i+d]]=[L[i+d],L[i]];if(await saveSettings({heroSlides:L}))go('website')}
function delSlide(i){confirmBox('Remove this photo from the slideshow?',async()=>{const L=[...(S.biz.settings.heroSlides||[])];L.splice(i,1);if(await saveSettings({heroSlides:L})){toast('Removed');go('website')}},'Remove')}
async function saveHomeText(){const stats=[0,1,2,3].map(i=>({v:val('sv'+i),l:val('sl'+i)})).filter(x=>x.v||x.l);if(await saveSettings({heroWhite:val('hw'),heroBlue:val('hb'),heroDesc:val('hd'),stats}))toast('Saved — live on your website')}
async function svcPhoto(id,f){if(!f)return;const done=busy('Uploading photo…');try{const url=await uploadImg(f,'services',1400);await svcField(id,'image_url',url);done();toast('Photo updated');go('website')}catch(e){done();toast(errMsg(e),1)}}
async function saveSvcText(id){const d=val('sd_'+id),inc=val('si_'+id).split('\n').map(x=>x.trim()).filter(Boolean);const{error}=await sb.from('services').update({description:d,includes:inc}).eq('id',id);if(error)return toast(errMsg(error),1);const s=svcById(id);s.description=d;s.includes=inc;toast('Saved')}
async function offerSet(i,k,v){const O=[...(S.biz.settings.offers||[])];O[i]={...O[i],[k]:v};if(k==='active'&&v)O.forEach((o,j)=>{if(j!==i)o.active=false});if(await saveSettings({offers:O})){toast(k==='active'?(v?'Offer is live':'Offer hidden'):'Saved');if(k==='active')go('website')}}
async function offerAdd(){const O=[...(S.biz.settings.offers||[])];O.push({id:Date.now().toString(36),title:'Winter Special',text:'15% off a Full Valet',serviceId:(S.services.find(s=>s.active)||{}).id,expires:addD(TODAY(),30),active:false});if(await saveSettings({offers:O}))go('website')}
function offerDel(i){confirmBox('Delete this offer?',async()=>{const O=[...(S.biz.settings.offers||[])];O.splice(i,1);if(await saveSettings({offers:O}))go('website')},'Delete')}
async function saveInfo(){const faq=val('fq').split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(x=>x[0]&&x[1]).map(x=>[x[0],x.slice(1).join(' | ')]);if(await saveSettings({faq,terms:val('pt2'),cancel:val('pc2'),refund:val('pr2')}))toast('Saved')}
async function saveSocial(){const social={};['facebook','instagram','tiktok','google'].forEach(k=>social[k]=val('so_'+k));if(await saveSettings({social}))toast('Saved')}

boot();
